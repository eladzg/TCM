  classical: 上脘（一名胃脘）巨闕下一寸，臍上五寸，上脘中脘屬胃絡脾，足陽明手太陽任脈之會。素註銅人，針八分，先補後瀉，風癇熱病，先瀉後補，立愈，日灸二七壯，至百壯，未愈倍之，明堂灸三壯。主腹中雷鳴相逐，食不化，腹□刺痛，霍亂吐利，腹痛，身熱汗不出，翻胃嘔吐，食不下，腹脹氣滿，心忪驚悸，時嘔血，痰多吐涎，賁豚伏梁，二蟲卒心痛，風癇熱病，馬黃黃疸，積聚堅大如盤，虛勞吐血，五毒□，不能食。（忪音忠□音熾）
