  classical: 水分（一名分水）下脘下一寸，臍上一寸，穴當小腸下，口至是而泌別清濁，水液入膀胱，渣滓入大腸，故曰水分。素註針一寸。銅人針八分，留三呼，瀉五吸，水病灸大良。又云禁針，針之水盡，即死，明堂水病，灸七七壯，止四百壯，針五分，留三呼。資生云：不針為是。主水病，腹堅腫如鼓，轉筋不嗜食，腸胃虛脹，繞臍痛沖心，腰脊急強，腸鳴狀如雷聲，上沖心，鬼擊鼻出血，小兒陷□。
