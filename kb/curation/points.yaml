  classical: 商丘足內踝骨下微前陷中，前有中封，後有照海，其穴居中，脾脈所行為經金，脾實瀉之。銅人灸三壯，針三分。主腹脹腸中鳴，不便，脾虛，令人不樂，身寒，善太息，心悲，骨痺氣逆，痔疾，骨疽蝕，魘夢，癇瘈寒，好嘔，陰股內痛，氣癰狐疝，走上下，引小腹痛，不可俛仰，脾積痞氣，黃疸，舌本強痛，腹脹寒，溏瘕泄水，面黃，善思善味，食不消，體重節痛，怠惰嗜臥，婦人絕子，小兒慢風。
