  name_pinyin: Xiao Cheng Qi Tang
  name_zh: 小承氣湯
  status: draft
  sources:
  - source_id: GUT-SHANGHAN
    field: indications
    locator: 條208, 條209, 條213, 條214, 條250, 條374
