  classical: 公孫足大指本節後一寸，內踝前，足太陰絡脈，別走陽明胃經。銅人針四分，灸三壯。主寒瘧，不嗜食，癇氣好太息，多寒熱，汗出，病至則喜嘔，嘔已乃衰，頭面腫起，煩心狂言，多飲膽虛，厥氣上逆則霍亂，實則腸中切痛，瀉之，虛則鼓脹，補之。
