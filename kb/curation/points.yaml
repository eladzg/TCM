  classical: 風門（一名熱府）二椎下兩傍，相去脊各一寸五分，正坐取之。銅人針五分。素註，針三分，留七呼，明堂，灸五壯。若頻刺，泄諸陽熱氣，背永不發癰疽，灸五壯。主發背癰疽，身熱上氣，喘氣逆咳，胸背痛，風勞嘔吐，多嚏，鼻鼽，出清涕，傷寒項強，目眩，胸中熱，臥不安。
