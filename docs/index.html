<script>
// Rule-based engine for the Hebrew interview prototype: Hebrew free-text extraction, safety screen,
// pattern scoring, next-question choice and the draft DiagnosticReport.
// Runs in the browser (window.TCMEngine) and in Node (module.exports) so tests can drive it.
//
// Scoring is a placeholder until the clinician sets real weights: every derived pattern-feature
// link carries kb.defaults.weight, and a pattern's score is a cosine similarity between the
// findings the patient confirmed and the pattern's linked features, minus a penalty for linked
// features the patient denied.
(function (root) {
  "use strict";

  var MIN_LINKS = 3;          // patterns with fewer derived links are too thin to rank
  var TOP_K = 8;              // candidates considered when choosing the next question
  var MAX_ADAPTIVE = 12;      // adaptive questions after the screening phase
  var NIQQUD = /[֑-ׇ]/g;
  var PREFIX = "ובכלמשה";
  var NEG_BEFORE = /(^|[\s,.;])(לא|אין|בלי|ללא)(\s+(לי|לו|לה|בכלל|ממש|כל כך|אף פעם|היה לי|היו לי))*\s+$/;

  function normalize(text) {
    return String(text || "").replace(NIQQUD, "").replace(/[״"׳']/g, "").toLowerCase();
  }

  function isBoundary(ch) {
    return ch === undefined || /[\s,.;:!?()\-–—/]/.test(ch);
  }

  // Hebrew attaches prefixes (ו, ה, ב, כ, ל, מ, ש) to words, so a term may start after up to two of
  // them; anything else before it means the term is part of another word ("ליחה" in "סליחה").
  function termAt(text, term) {
    var hits = [];
    var from = 0;
    while (true) {
      var i = text.indexOf(term, from);
      if (i === -1) return hits;
      var j = i;
      var prefixes = 0;
      while (prefixes < 2 && j > 0 && PREFIX.indexOf(text[j - 1]) !== -1 && !isBoundary(text[j - 1])) {
        j -= 1;
        prefixes += 1;
      }
      if (isBoundary(text[j - 1])) hits.push(i);
      from = i + 1;
    }
  }

  function quoteAround(original, index, length) {
    var start = index;
    var end = index + length;
    while (start > 0 && !/[,.;!?\n]/.test(original[start - 1])) start -= 1;
    while (end < original.length && !/[,.;!?\n]/.test(original[end])) end += 1;
    return original.slice(start, end).trim();
  }

  function createEngine(kb) {
    var features = kb.features;
    var featById = {};
    features.forEach(function (f) { featById[f.id] = f; });
    var weight = kb.defaults.weight;
    var penalty = kb.defaults.denied_penalty;
    var syndromes = kb.syndromes.filter(function (s) { return s.links.length >= MIN_LINKS; });
    var groupOrder = Object.keys(kb.groups);

    function newState(patient) {
      return {
        patient: patient || {},   // {age, sex: "F"|"M", pregnancy: "yes"|"no"|"unknown"|"na"}
        answers: {},              // feature id -> {value: true|false|null, source, quote}
        asked: [],                // feature ids in the order asked
        adaptiveAsked: 0,
        flags: [],                // safety flags
        halted: false,
        tongueObserved: false,
        pulseObserved: false,
        transcript: []
      };
    }

    function sexAllows(f, state) {
      return !f.sex || !state.patient.sex || f.sex === state.patient.sex;
    }

    function setAnswer(state, featureId, value, source, quote) {
      if (!featById[featureId]) throw new Error("unknown feature " + featureId);
      state.answers[featureId] = { value: value, source: source, quote: quote || "" };
    }

    // Clinician tongue/pulse entry: checked items are present, every other item in the section is
    // absent (the clinician looked), and nothing is recorded when the section was not observed.
    function setObjective(state, kind, checkedIds) {
      var observed = checkedIds !== null;
      if (kind === "tongue") state.tongueObserved = observed;
      else state.pulseObserved = observed;
      features.forEach(function (f) {
        if (f.kind !== kind) return;
        if (!observed) { delete state.answers[f.id]; return; }
        setAnswer(state, f.id, checkedIds.indexOf(f.id) !== -1, "clinician");
      });
    }

    // Hebrew free text -> findings. Negated mentions ("אין לי צמא") become "no" answers.
    function extract(text) {
      var original = String(text || "");
      var norm = normalize(original);
      var found = {};
      features.forEach(function (f) {
        (f.syn_he || []).forEach(function (term) {
          var t = normalize(term);
          termAt(norm, t).forEach(function (i) {
            var before = norm.slice(Math.max(0, i - 24), i);
            var negated = NEG_BEFORE.test(before) && !/^(לא|אין|בלי)/.test(t);
            var prev = found[f.id];
            // a positive mention wins over a negated one of the same feature
            if (!prev || (prev.value === false && !negated)) {
              found[f.id] = { feature: f.id, value: !negated, quote: quoteAround(original, i, t.length) };
            }
          });
        });
      });
      return Object.keys(found).map(function (k) { return found[k]; });
    }

    function screenText(text) {
      var norm = normalize(text);
      var hits = [];
      kb.safety.red_flag_terms.forEach(function (rule) {
        rule.terms.forEach(function (term) {
          var t = normalize(term);
          termAt(norm, t).forEach(function (i) {
            var before = norm.slice(Math.max(0, i - 24), i);
            if (NEG_BEFORE.test(before)) return;
            hits.push({ category: "A", type: rule.gloss_en.replace(/\W+/g, "_"), gloss_en: rule.gloss_en,
                        verbatim_he: quoteAround(String(text), i, t.length) });
          });
        });
      });
      return hits;
    }

    function addFlag(state, flag) {
      var exists = state.flags.some(function (x) { return x.type === flag.type && x.category === flag.category; });
      if (!exists) state.flags.push(flag);
      if (flag.category === "A") state.halted = true;
    }

    // Takes the patient's free-text answer: red-flag screen first, then finding extraction.
    function ingestText(state, text, context) {
      state.transcript.push({ role: "patient", text: text, context: context || "" });
      var redFlags = screenText(text);
      redFlags.forEach(function (f) { f.status = "current"; addFlag(state, f); });
      if (state.halted) return { halted: true, findings: [], flags: redFlags };
      var findings = extract(text).filter(function (x) { return sexAllows(featById[x.feature], state); });
      findings.forEach(function (x) {
        if (!state.answers[x.feature]) setAnswer(state, x.feature, x.value, "free_text", x.quote);
      });
      return { halted: false, findings: findings, flags: redFlags };
    }

    function ingestMedications(state, text) {
      state.patient.medications = text;
      var norm = normalize(text);
      kb.safety.constraint_terms.forEach(function (rule) {
        rule.terms.forEach(function (term) {
          var t = normalize(term);
          if (termAt(norm, t).length) {
            addFlag(state, { category: "C", type: rule.code.toLowerCase(), gloss_en: rule.gloss_en,
                             verbatim_he: quoteAround(String(text), norm.indexOf(t), t.length), status: "current" });
          }
        });
      });
    }

    function redFlagAnswer(state, questionId, yes) {
      if (!yes) return;
      var q = kb.safety.red_flag_questions.filter(function (x) { return x.id === questionId; })[0];
      addFlag(state, { category: "A", type: questionId.toLowerCase(), gloss_en: q.gloss_en,
                       verbatim_he: q.q_he + " - כן", status: "current" });
    }

    function score(state) {
      var yes = Object.keys(state.answers).filter(function (k) { return state.answers[k].value === true; });
      var yesWeight = yes.length;
      var ranked = syndromes.map(function (s) {
        var P = 0, D = 0, L = 0, supporting = [], contradicting = [], missing = [];
        s.links.forEach(function (l) {
          if (!sexAllows(featById[l.f], state)) return;
          var w = l.w === undefined ? weight : l.w;
          L += w * w;
          var a = state.answers[l.f];
          if (a && a.value === true) { P += w; supporting.push(l); }
          else if (a && a.value === false) { D += w; contradicting.push(l); }
          else missing.push(l);
        });
        var value = yesWeight && L ? Math.max(0, P - penalty * D) / Math.sqrt(L * yesWeight) : 0;
        return { syndrome: s, score: value, supporting: supporting, contradicting: contradicting, missing: missing };
      });
      ranked.sort(function (a, b) { return b.score - a.score || b.supporting.length - a.supporting.length; });
      return ranked;
    }

    function screeningQueue(state) {
      return features
        .filter(function (f) { return f.screen && (f.kind || "symptom") === "symptom" && sexAllows(f, state); })
        .sort(function (a, b) { return groupOrder.indexOf(a.group) - groupOrder.indexOf(b.group); })
        .filter(function (f) { return !state.answers[f.id]; });
    }

    // The question that best splits the current top candidates: the feature whose linked
    // candidates hold closest to half of the candidates' score mass.
    function bestDiscriminator(state, ranked) {
      var top = ranked.slice(0, TOP_K).filter(function (r) { return r.score > 0; });
      if (top.length === 0) return null;
      var total = top.reduce(function (s, r) { return s + r.score; }, 0);
      var best = null;
      features.forEach(function (f) {
        if ((f.kind || "symptom") !== "symptom" || state.answers[f.id] || !sexAllows(f, state)) return;
        var mass = 0, separates = [];
        top.forEach(function (r) {
          if (r.syndrome.links.some(function (l) { return l.f === f.id; })) {
            mass += r.score / total;
            separates.push(r.syndrome.id);
          }
        });
        if (!separates.length) return;
        var value = Math.min(mass, 1 - mass) + (separates[0] === top[0].syndrome.id ? 0.05 : 0);
        if (top.length === 1) value = 1;
        if (!best || value > best.value) best = { feature: f, value: value, separates: separates };
      });
      return best;
    }

    function nextQuestion(state) {
      if (state.halted) return null;
      var queue = screeningQueue(state);
      if (queue.length) return { phase: "screening", feature: queue[0], separates: [] };
      if (state.adaptiveAsked >= MAX_ADAPTIVE) return null;
      var best = bestDiscriminator(state, score(state));
      if (!best) return null;
      return { phase: "adaptive", feature: best.feature, separates: best.separates };
    }

    function answerQuestion(state, question, value) {
      setAnswer(state, question.feature.id, value, "question");
      state.asked.push(question.feature.id);
      if (question.phase === "adaptive") state.adaptiveAsked += 1;
      state.transcript.push({ role: "system", text: question.feature.q_he, feature: question.feature.id });
      state.transcript.push({ role: "patient", text: value === true ? "כן" : value === false ? "לא" : "לא בטוח/ה" });
    }

    function principle(yesFeatures, a, b, labels) {
      var sa = [], sb = [];
      yesFeatures.forEach(function (f) {
        if ((f.tags || []).indexOf(a) !== -1) sa.push(f.id);
        if ((f.tags || []).indexOf(b) !== -1) sb.push(f.id);
      });
      var value = "undetermined";
      if (sa.length >= 2 && sa.length >= 2 * Math.max(sb.length, 1)) value = labels[0];
      else if (sb.length >= 2 && sb.length >= 2 * Math.max(sa.length, 1)) value = labels[1];
      else if (sa.length >= 2 && sb.length >= 2) value = "mixed";
      return { value: value, supporting_feature_ids: value === labels[0] ? sa : value === labels[1] ? sb : sa.concat(sb) };
    }

    function report(state, meta) {
      meta = meta || {};
      var ranked = score(state).filter(function (r) { return r.score > 0; });
      var findingIds = {};
      var findings = Object.keys(state.answers).map(function (fid, i) {
        var a = state.answers[fid];
        var f = featById[fid];
        var id = (f.kind === "tongue" ? "OBS-T" : f.kind === "pulse" ? "OBS-P" : "F-") + (i + 1);
        findingIds[fid] = id;
        return { finding_id: id, feature_id: fid, label_he: f.label_he,
                 value: a.value === true ? "present" : a.value === false ? "absent" : "unknown",
                 source: a.source, verbatim_he: a.quote || null };
      });
      var yesFeatures = Object.keys(state.answers)
        .filter(function (k) { return state.answers[k].value === true; })
        .map(function (k) { return featById[k]; });
      var flags = state.flags.map(function (f) {
        return { code: "SAFETY_CATEGORY_" + f.category, severity: f.category === "A" ? "red" : "amber",
                 message_en: f.gloss_en, verbatim_he: f.verbatim_he, related_ids: [] };
      });
      var p = state.patient;
      if (p.sex === "F" && p.age >= 12 && p.age <= 55 && (!p.pregnancy || p.pregnancy === "unknown")) {
        flags.push({ code: "PREGNANCY_STATUS_UNKNOWN", severity: "red",
                     message_en: "Woman aged " + p.age + "; pregnancy status not confirmed.", related_ids: ["safety.pregnancy_status"] });
      }
      if (p.pregnancy === "yes") {
        flags.push({ code: "PREGNANCY", severity: "red", message_en: "Patient reports pregnancy.", related_ids: ["safety.pregnancy_status"] });
      }
      if (!state.tongueObserved || !state.pulseObserved) {
        flags.push({ code: "OBJECTIVE_FINDINGS_MISSING", severity: "amber",
                     message_en: "Tongue or pulse not entered; confidence is capped at moderate.", related_ids: [] });
      }
      flags.push({ code: "PLACEHOLDER_WEIGHTS", severity: "info",
                   message_en: "Pattern-feature links were derived automatically from WHO 2022 and GB/T 16751.2 text and all carry the same placeholder weight. Ranking is a proposal only.", related_ids: [] });
      var differential = ranked.slice(0, 5).map(function (r, i) {
        var s = r.syndrome;
        var objective = state.tongueObserved && state.pulseObserved;
        var confidence = r.supporting.length < 3 ? "low" : "moderate";
        if (!objective && confidence === "moderate" && r.supporting.length < 5) confidence = "low";
        return {
          rank: i + 1,
          role: i === 0 ? "primary" : "alternative",
          syndrome_id: s.id,
          names: { en: s.en, pinyin: s.py, zh: s.zh, he: s.he || null },
          category: s.cat,
          graph_score: Math.round(r.score * 1000) / 1000,
          confidence: confidence,
          supporting: r.supporting.map(function (l) {
            return { finding_id: findingIds[l.f], feature_id: l.f, matched_manifestation_en: l.ev, sources: l.src || ["WHO"], evidence_ref: s.src };
          }),
          contradicting: r.contradicting.map(function (l) {
            return { finding_id: findingIds[l.f], feature_id: l.f, conflict_en: "Reported absent: " + l.ev, evidence_ref: s.src };
          }),
          missing_key_manifestations: r.missing.map(function (l) {
            var f = featById[l.f];
            return { feature_id: l.f, manifestation_en: l.ev, evidence_ref: s.src, suggested_question_he: f.q_he || null };
          }),
          source_text: { presentation: s.text, tongue: s.tongue, pulse: s.pulse, gb_code: s.gb || null, gb_zh: s.gbtext || null },
          treatment_principle: s.tp ? { text_en: s.tp, evidence_ref: s.src } : null
        };
      });
      var disc = bestDiscriminator(state, score(state));
      var summary = clinicianSummary(differential, state, flags);
      return {
        schema_version: "diagnostic_report.v1",
        generator: "interview_prototype.v0 (rule-based, placeholder weights)",
        report_id: meta.report_id || "dx_proto_" + Date.now(),
        session_id: meta.session_id || null,
        kb_version: kb.kb_version,
        created_at: meta.created_at || new Date().toISOString(),
        status: "draft_for_clinician",
        patient: { age: p.age || null, sex: p.sex || null, pregnancy: p.pregnancy || null, medications_he: p.medications || null },
        data_completeness: {
          tongue_observed: state.tongueObserved,
          pulse_observed: state.pulseObserved,
          unanswered_key_slots: flags.some(function (f) { return f.code === "PREGNANCY_STATUS_UNKNOWN"; }) ? ["safety.pregnancy_status"] : []
        },
        eight_principles: {
          interior_exterior: principle(yesFeatures, "interior", "exterior", ["interior", "exterior"]),
          cold_heat: principle(yesFeatures, "cold", "heat", ["cold", "heat"]),
          deficiency_excess: principle(yesFeatures, "def", "excess", ["deficiency", "excess"])
        },
        findings: findings,
        differential: differential,
        discriminating_questions: disc ? [{ feature_id: disc.feature.id, question_he: disc.feature.q_he, separates: disc.separates }] : [],
        flags: flags,
        clinician_summary: { language: "he", text: summary }
      };
    }

    function clinicianSummary(differential, state, flags) {
      if (state.halted) return "הראיון הופסק בגלל סימן אזהרה דחוף. נדרשת פנייה רפואית לפני כל טיפול.";
      if (!differential.length) return "אין מספיק ממצאים כדי להציע תבנית. מומלץ להשלים ראיון ובדיקת לשון ודופק.";
      var first = differential[0];
      var labels = first.supporting.map(function (x) { return featById[x.feature_id].label_he; });
      var text = "הממצאים תואמים בעיקר את התבנית " + first.names.en + " (" + first.names.zh + "): " +
        labels.slice(0, 6).join(", ") + ".";
      if (differential[1]) text += " חלופה: " + differential[1].names.en + ".";
      var missing = flags.filter(function (f) { return f.code === "OBJECTIVE_FINDINGS_MISSING" || f.code === "PREGNANCY_STATUS_UNKNOWN"; });
      if (missing.length) text += " חסר: " + missing.map(function (f) {
        return f.code === "PREGNANCY_STATUS_UNKNOWN" ? "סטטוס היריון" : "לשון/דופק";
      }).join(", ") + ".";
      return text + " זו הצעה לשיקול המטפל/ת, על בסיס משקלות ברירת מחדל שטרם כוילו.";
    }

    return {
      newState: newState,
      extract: extract,
      screenText: screenText,
      ingestText: ingestText,
      ingestMedications: ingestMedications,
      redFlagAnswer: redFlagAnswer,
      setAnswer: setAnswer,
      setObjective: setObjective,
      score: score,
      nextQuestion: nextQuestion,
      answerQuestion: answerQuestion,
      report: report,
      features: features,
      featById: featById,
      MAX_ADAPTIVE: MAX_ADAPTIVE
    };
  }

  var api = { createEngine: createEngine, normalize: normalize };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.TCMEngine = api;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
// UI for the interview prototype: a Hebrew chat for the patient and a worksheet for the clinician.
(function () {
  "use strict";
  var kb = window.TCM_KB;
  var E = window.TCMEngine.createEngine(kb);
  var state;
  var current = null;     // the question waiting for an answer
  var step = "intake";
  var chat = document.getElementById("chat");
  var clin = document.getElementById("view-clin");

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function say(text, cls, meta) {
    var m = el("div", { class: "msg " + (cls || "sys"), text: text });
    if (meta) m.appendChild(el("span", { class: "meta", text: meta }));
    chat.appendChild(m);
    m.scrollIntoView({ block: "nearest" });
    return m;
  }
  function panel(children) {
    var p = el("div", { class: "panel" }, children);
    chat.appendChild(p);
    p.scrollIntoView({ block: "nearest" });
    return p;
  }
  function showUnderstood(findings) {
    if (!findings.length) return;
    var box = el("div", { class: "understood" });
    findings.forEach(function (f) {
      box.appendChild(el("span", { class: "chip" + (f.value ? "" : " neg"), text: E.featById[f.feature].label_he }));
    });
    chat.appendChild(box);
  }
  function halt() {
    say(kb.safety.emergency_template_he, "alert");
    step = "halted";
    renderClinician();
  }

  // ---- steps ----
  function start() {
    chat.textContent = "";
    state = E.newState({});
    current = null;
    objective = { tongue: null, pulse: null };
    step = "intake";
    say("שלום, אני עוזר/ת האינטייק של הקליניקה. אשאל כמה שאלות לפני הפגישה, והמטפל/ת יעבור/תעבור על התשובות. אני לא נותן/ת אבחנה או טיפול.");
    var age = el("input", { type: "number", id: "age", min: "1", max: "120", inputmode: "numeric", style: "width:6em" });
    var sexRow = el("div", { class: "row" }, [
      el("span", { text: "מין:" }),
      el("label", { class: "opt" }, [el("input", { type: "radio", name: "sex", value: "F", id: "sex-f" }), "אישה"]),
      el("label", { class: "opt" }, [el("input", { type: "radio", name: "sex", value: "M", id: "sex-m" }), "גבר"])
    ]);
    var preg = el("div", { class: "row", hidden: "" }, [
      el("span", { text: "האם יש אפשרות שאת בהיריון?" }),
      el("label", { class: "opt" }, [el("input", { type: "radio", name: "preg", value: "yes", id: "preg-y" }), "כן"]),
      el("label", { class: "opt" }, [el("input", { type: "radio", name: "preg", value: "no", id: "preg-n" }), "לא"]),
      el("label", { class: "opt" }, [el("input", { type: "radio", name: "preg", value: "unknown", id: "preg-u" }), "לא בטוחה"])
    ]);
    function syncPreg() {
      var f = document.getElementById("sex-f").checked;
      var a = Number(age.value);
      preg.hidden = !(f && (!a || (a >= 12 && a <= 55)));
    }
    sexRow.addEventListener("change", syncPreg);
    age.addEventListener("input", syncPreg);
    var go = el("button", { class: "btn", type: "button", text: "המשך" });
    var p = panel([el("label", { class: "row" }, [el("span", { text: "גיל:" }), age]), sexRow, preg, go]);
    go.addEventListener("click", function () {
      var sex = (document.querySelector("input[name=sex]:checked") || {}).value;
      var pr = (document.querySelector("input[name=preg]:checked") || {}).value;
      state.patient = { age: Number(age.value) || null, sex: sex || null,
                        pregnancy: preg.hidden ? "na" : (pr || "unknown") };
      p.remove();
      say([state.patient.age ? "גיל " + state.patient.age : "", sex === "F" ? "אישה" : sex === "M" ? "גבר" : "",
           pr === "yes" ? "ייתכן היריון" : pr === "no" ? "לא בהיריון" : ""].filter(Boolean).join(", ") || "דילגתי", "pt");
      redFlags();
    });
  }

  function redFlags() {
    step = "redflags";
    say("לפני שנתחיל: האם אחד מהדברים האלה קורה לך עכשיו?");
    var boxes = kb.safety.red_flag_questions.map(function (q) {
      return el("label", { class: "opt" }, [el("input", { type: "checkbox", value: q.id, id: "rf-" + q.id }), q.q_he]);
    });
    var none = el("button", { class: "btn no", type: "button", text: "אף אחד מאלה" });
    var yes = el("button", { class: "btn", type: "button", text: "סימנתי" });
    var p = panel([el("div", { style: "display:grid;gap:6px" }, boxes), el("div", { class: "answers" }, [none, yes])]);
    function done(useChecks) {
      var checked = useChecks ? Array.prototype.slice.call(p.querySelectorAll("input:checked")) : [];
      p.remove();
      if (!checked.length) { say("אף אחד מאלה", "pt"); return meds(); }
      checked.forEach(function (c) { E.redFlagAnswer(state, c.value, true); say(c.parentNode.textContent, "pt"); });
      halt();
    }
    none.addEventListener("click", function () { done(false); });
    yes.addEventListener("click", function () { done(true); });
  }

  function composer(placeholder, onSend, allowEmpty) {
    var t = el("textarea", { id: "composer-" + step, placeholder: placeholder });
    var send = el("button", { class: "btn", type: "button", text: "שליחה" });
    var p = panel([t, el("div", { class: "answers" }, [send])]);
    function go() {
      var v = t.value.trim();
      if (!v && !allowEmpty) { t.focus(); return; }
      p.remove();
      onSend(v);
    }
    send.addEventListener("click", go);
    t.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
    t.focus();
  }

  function meds() {
    step = "meds";
    say("אילו תרופות, ויטמינים או תוספים את/ה לוקח/ת כרגע? אם יש מחלות רקע או אלרגיות, אפשר לכתוב גם אותן.");
    composer("למשל: אלטרוקסין, ויטמין D. אם אין, כתוב/כתבי 'אין'", function (v) {
      say(v || "אין", "pt");
      E.ingestMedications(state, v);
      complaint();
    }, true);
  }

  function complaint() {
    step = "complaint";
    say("ספר/י לי במילים שלך מה מביא אותך לטיפול. מה מרגישים, ממתי, ומה מחמיר או מקל?");
    composer("כתוב/כתבי בחופשיות", function (v) {
      say(v, "pt");
      var r = E.ingestText(state, v, "chief_complaint");
      if (r.halted) return halt();
      showUnderstood(r.findings);
      if (r.findings.length) say("תודה, רשמתי. עכשיו כמה שאלות קצרות. אפשר לענות בכפתורים, או לכתוב בחופשיות.");
      else say("תודה. עכשיו כמה שאלות קצרות. אפשר לענות בכפתורים, או לכתוב בחופשיות.");
      ask();
    });
  }

  function ask() {
    step = "questions";
    current = E.nextQuestion(state);
    if (!current) return finish();
    var f = current.feature;
    var n = state.asked.length + 1;
    var msg = say(f.q_he, "sys", (current.phase === "screening" ? "סקירה כללית" : "שאלת הבחנה") + " · " + kb.groups[f.group] + " · שאלה " + n);
    var p;
    function answer(v, label) {
      p.remove();
      say(label, "pt");
      E.answerQuestion(state, current, v);
      ask();
    }
    var t = el("textarea", { id: "free-" + n, placeholder: "או כתוב/כתבי תשובה במילים שלך", style: "min-height:44px" });
    var sendFree = el("button", { class: "btn ghost", type: "button", text: "שליחה" });
    p = panel([
      el("div", { class: "answers" }, [
        el("button", { class: "btn", type: "button", text: "כן", onclick: function () { answer(true, "כן"); } }),
        el("button", { class: "btn no", type: "button", text: "לא", onclick: function () { answer(false, "לא"); } }),
        el("button", { class: "btn no", type: "button", text: "לא בטוח/ה", onclick: function () { answer(null, "לא בטוח/ה"); } }),
        el("button", { class: "btn ghost", type: "button", text: "סיום הראיון", onclick: function () { p.remove(); finish(); } })
      ]),
      el("div", { class: "row" }, [t, sendFree]),
      el("span", { class: "progress", text: "עד " + E.MAX_ADAPTIVE + " שאלות הבחנה אחרי הסקירה הכללית" })
    ]);
    t.style.flex = "1";
    sendFree.addEventListener("click", function () {
      var v = t.value.trim();
      if (!v) return;
      p.remove();
      say(v, "pt");
      var r = E.ingestText(state, v, f.id);
      if (r.halted) return halt();
      showUnderstood(r.findings);
      var own = r.findings.filter(function (x) { return x.feature === f.id; })[0];
      if (own || /^(כן|נכון|בטח|כמובן|יש)([\s,.!]|$)/.test(v)) {
        E.answerQuestion(state, current, own ? own.value : true);
      } else if (/^(לא|אין|ממש לא)([\s,.!]|$)/.test(v)) {
        E.answerQuestion(state, current, false);
      } else {
        state.asked.push(f.id);
        if (current.phase === "adaptive") state.adaptiveAsked += 1;
        E.setAnswer(state, f.id, null, "question", v);
      }
      ask();
    });
    void msg;
  }

  function finish() {
    step = "done";
    current = null;
    say("תודה רבה! המטפל/ת יעבור/תעבור על התשובות לפני הפגישה. אם יש עוד משהו שחשוב לך שיידע/תדע, אפשר לכתוב אותו כאן.");
    composer("לא חובה", function (v) {
      if (v) {
        say(v, "pt");
        var r = E.ingestText(state, v, "closing");
        if (r.halted) return halt();
        showUnderstood(r.findings);
      }
      say("הראיון הסתיים. הסיכום מחכה למטפל/ת בלשונית 'סיכום למטפל'.");
      renderClinician();
    }, true);
    renderClinician();
  }

  // ---- clinician view ----
  var objective = { tongue: null, pulse: null };

  function objectivePanel(kind, title) {
    var feats = E.features.filter(function (f) { return f.kind === kind; });
    var observed = el("label", { class: "opt" }, [el("input", { type: "checkbox", id: kind + "-observed" }), "נבדק"]);
    var obsInput = observed.querySelector("input");
    obsInput.checked = objective[kind] !== null;
    var checks = el("div", { class: "checks" }, feats.map(function (f) {
      var inp = el("input", { type: "checkbox", value: f.id, id: "obj-" + f.id });
      inp.checked = !!(objective[kind] && objective[kind].indexOf(f.id) !== -1);
      return el("label", { class: "opt" }, [inp, f.label_he]);
    }));
    function sync() {
      if (!obsInput.checked) objective[kind] = null;
      else objective[kind] = Array.prototype.slice.call(checks.querySelectorAll("input:checked")).map(function (i) { return i.value; });
      renderClinician();
    }
    checks.addEventListener("change", function () { obsInput.checked = true; sync(); });
    obsInput.addEventListener("change", sync);
    return el("div", { class: "panel" }, [el("div", { class: "row" }, [el("h3", { text: title }), observed]), checks]);
  }

  function evList(items, render, cls) {
    var ul = el("ul", { class: "ev" + (cls ? " " + cls : "") });
    items.forEach(function (x) { ul.appendChild(render(x)); });
    return ul;
  }

  var FLAG_HE = {
    SAFETY_CATEGORY_A: "סימן אזהרה דחוף: ",
    SAFETY_CATEGORY_C: "שיקול בטיחות לטיפול: ",
    SAFETY_CATEGORY_D: "מידע בטיחותי לא ודאי: ",
    PREGNANCY_STATUS_UNKNOWN: "סטטוס היריון לא אושר (אישה בגיל הפוריות).",
    PREGNANCY: "המטופלת מדווחת על היריון אפשרי.",
    OBJECTIVE_FINDINGS_MISSING: "לשון או דופק לא הוזנו, ולכן רמת הביטחון מוגבלת.",
    PLACEHOLDER_WEIGHTS: "הקישורים בין תסמינים לתבניות נגזרו אוטומטית מטקסט WHO 2022, וכולם במשקל ברירת מחדל זהה. הדירוג הוא הצעה בלבד."
  };

  function renderClinician() {
    if (!state) return;
    E.setObjective(state, "tongue", objective.tongue);
    E.setObjective(state, "pulse", objective.pulse);
    var rep = E.report(state, { session_id: "proto_session" });
    clin.textContent = "";
    var flagBox = el("div", { class: "flags" }, rep.flags.map(function (f) {
      var he = FLAG_HE[f.code] || "";
      return el("div", { class: "flag " + f.severity, title: f.code }, [
        he, f.code.indexOf("SAFETY_") === 0 ? el("bdi", { text: f.message_en }) : null, f.verbatim_he ? " · “" + f.verbatim_he + "”" : ""
      ]);
    }));
    var ep = rep.eight_principles;
    var heb = { interior: "פנים", exterior: "חוץ", cold: "קור", heat: "חום", deficiency: "חוסר", excess: "עודף", mixed: "מעורב", undetermined: "לא הוכרע" };
    var dxs = rep.differential.map(function (d) {
      var s = E.featById;
      var card = el("article", { class: "dx" + (d.rank === 1 ? " primary" : "") }, [
        el("div", { class: "dx-head" }, [
          el("div", { class: "dx-name" }, [d.rank + ". " + d.names.en, " ", el("span", { class: "zh", text: d.names.zh + " " + d.names.pinyin })]),
          el("span", { class: "score", text: "התאמה " + d.graph_score.toFixed(2) + " · ביטחון " + (d.confidence === "moderate" ? "בינוני" : "נמוך") })
        ]),
        el("div", { class: "bar" }, [el("i", { style: "width:" + Math.round(Math.min(1, d.graph_score) * 100) + "%" })]),
        el("span", { class: "id", text: d.syndrome_id + " · " + d.category })
      ]);
      card.appendChild(el("h3", { text: "תומך (" + d.supporting.length + ")" }));
      card.appendChild(evList(d.supporting, function (x) {
        return el("li", {}, [s[x.feature_id].label_he + " ", el("span", { class: "en", text: x.matched_manifestation_en }),
          " ", el("span", { class: "id", text: x.sources.join("+") })]);
      }));
      if (d.contradicting.length) {
        card.appendChild(el("h3", { text: "סותר (" + d.contradicting.length + ")" }));
        card.appendChild(evList(d.contradicting, function (x) {
          return el("li", {}, ["נשלל: " + s[x.feature_id].label_he]);
        }, "contra"));
      }
      if (d.missing_key_manifestations.length) {
        var det = el("details", {}, [el("summary", { text: "לא נשאל / לא נבדק (" + d.missing_key_manifestations.length + ")" })]);
        det.appendChild(evList(d.missing_key_manifestations, function (x) {
          return el("li", {}, [s[x.feature_id].label_he + " ", el("span", { class: "en", text: x.manifestation_en })]);
        }));
        card.appendChild(det);
      }
      var src = el("details", {}, [el("summary", { text: "הטקסט במקור (" + d.supporting[0].evidence_ref + ")" }),
        el("div", { class: "src" }, [d.source_text.presentation, d.source_text.tongue ? " " + d.source_text.tongue : "", d.source_text.pulse ? " " + d.source_text.pulse : ""])]);
      if (d.source_text.gb_zh) {
        src.appendChild(el("div", { class: "src zh" }, ["GB/T 16751.2 " + d.source_text.gb_code + ": " + d.source_text.gb_zh]));
      }
      card.appendChild(src);
      return card;
    });
    var json = JSON.stringify(rep, null, 2);
    var copy = el("button", { class: "btn ghost", type: "button", text: "העתקת JSON" });
    var pre = el("pre", { class: "json", text: json });
    copy.addEventListener("click", function () {
      var done = function () { copy.textContent = "הועתק"; setTimeout(function () { copy.textContent = "העתקת JSON"; }, 1500); };
      try {
        navigator.clipboard.writeText(json).then(done, function () { selectPre(); });
      } catch (e) { selectPre(); }
    });
    function selectPre() { var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    var findingsList = rep.findings.filter(function (f) { return E.featById[f.feature_id].kind === undefined || E.featById[f.feature_id].kind === "symptom"; });
    var yes = findingsList.filter(function (f) { return f.value === "present"; });
    var no = findingsList.filter(function (f) { return f.value === "absent"; });
    var dq = rep.discriminating_questions[0];
    var children = [
      el("div", { class: "panel" }, [
        el("h2", { text: "הצעה למטפל" }),
        el("p", { class: "summary", text: rep.clinician_summary.text, style: "margin:0" }),
        el("div", { class: "ep" }, [
          el("span", { text: "פנים/חוץ: " + heb[ep.interior_exterior.value] }),
          el("span", { text: "קור/חום: " + heb[ep.cold_heat.value] }),
          el("span", { text: "חוסר/עודף: " + heb[ep.deficiency_excess.value] })
        ]),
        dq ? el("p", { style: "margin:0;font-size:.92rem", text: "שאלת הבחנה מוצעת: " + dq.question_he }) : null
      ]),
      flagBox,
      el("div", { class: "grid2" }, [objectivePanel("tongue", "לשון"), objectivePanel("pulse", "דופק")]),
      el("div", { class: "panel" }, [
        el("h3", { text: "ממצאים מהראיון (" + yes.length + " קיימים, " + no.length + " נשללו)" }),
        el("div", { class: "understood", style: "justify-self:start;max-width:none" },
          yes.map(function (f) { return el("span", { class: "chip", text: f.label_he, title: f.verbatim_he || "" }); })
            .concat(no.map(function (f) { return el("span", { class: "chip neg", text: f.label_he }); }))),
        state.patient.medications ? el("p", { style: "margin:0;font-size:.9rem", text: "תרופות ורקע: " + state.patient.medications }) : null
      ]),
      el("h2", { text: "תבניות אפשריות" })
    ];
    if (!dxs.length) children.push(el("p", { class: "empty", text: "עוד אין מספיק ממצאים. השלימו את הראיון בלשונית 'ראיון המטופל', או לחצו על 'מילוי מקרה לדוגמה'." }));
    children = children.concat(dxs);
    children.push(el("details", {}, [el("summary", { text: "DiagnosticReport (JSON)" }), el("div", { class: "row", style: "margin:8px 0" }, [copy]), pre]));
    children.forEach(function (c) { if (c) clin.appendChild(c); });
  }

  // ---- tabs and demo ----
  function showTab(which) {
    document.getElementById("tab-patient").setAttribute("aria-selected", which === "patient");
    document.getElementById("tab-clin").setAttribute("aria-selected", which === "clin");
    document.getElementById("view-patient").hidden = which !== "patient";
    clin.hidden = which !== "clin";
    if (which === "clin") renderClinician();
    window.scrollTo(0, 0);
  }
  document.getElementById("tab-patient").addEventListener("click", function () { showTab("patient"); });
  document.getElementById("tab-clin").addEventListener("click", function () { showTab("clin"); });

  // Sample case from the architecture doc (section 4.4): a 41-year-old woman with temporal headaches.
  document.getElementById("demo").addEventListener("click", function () {
    start();
    chat.textContent = "";
    state.patient = { age: 41, sex: "F", pregnancy: "unknown" };
    say("מקרה לדוגמה: אישה בת 41, סטטוס היריון לא נמסר.", "sys");
    E.ingestMedications(state, "ציפרלקס");
    say("ציפרלקס", "pt");
    var text = "יש לי כאבי ראש פועמים ברקות, בעיקר כשאני בלחץ ולפני המחזור. אני עצבנית מאוד, יש לי טעם מר בפה ואני מתעוררת בלילה.";
    say(text, "pt");
    var r = E.ingestText(state, text, "chief_complaint");
    showUnderstood(r.findings);
    var truth = ["FT.DIZZY", "FT.RED_FACE", "FT.RESTLESS", "FT.FEELS_HOT", "FT.PMS", "FT.MENS_IRREGULAR", "FT.DRY_MOUTH"];
    var q, guard = 0;
    while ((q = E.nextQuestion(state)) && guard++ < 40) {
      var v = truth.indexOf(q.feature.id) !== -1 || (state.answers[q.feature.id] && state.answers[q.feature.id].value === true);
      say(q.feature.q_he, "sys");
      say(v ? "כן" : "לא", "pt");
      E.answerQuestion(state, q, v);
    }
    say("הראיון לדוגמה הסתיים. במקרה הזה המטפל/ת סימן/ה לשון אדומה וצדי לשון אדומים, ודופק מיתרי.");
    objective = { tongue: ["TG.RED", "TG.RED_SIDES"], pulse: ["PL.WIRY"] };
    step = "done";
    showTab("clin");
  });

  // Hooks for the voice interview (voice_ui.js): it drives the same state and views, with the
  // ElevenLabs agent in place of the typed composer.
  window.TCMInterviewUI = {
    kb: kb,
    engine: E,
    beginVoice: function () {
      chat.textContent = "";
      state = E.newState({});
      current = null;
      objective = { tongue: null, pulse: null };
      step = "voice";
      showTab("patient");
      renderClinician();
      return state;
    },
    say: say,
    showUnderstood: showUnderstood,
    halt: halt,
    renderClinician: renderClinician,
    showTab: showTab,
    restart: start
  };

  start();
  renderClinician();
})();

// An agent id is not a secret, but this agent is public: anyone holding the id can start a

<script>
// Turn logic for the voice interview. The ElevenLabs agent only speaks and listens: after every
// patient answer it calls the `interview_step` client tool, and this module feeds the answer to the
// rule-based engine and returns what the agent should say next. The engine, not the LLM, decides
// the questions and runs the safety screen.
// Runs in the browser (window.TCMVoiceFlow) and in Node (module.exports) so tests can drive it.
(function (root) {
  "use strict";

  var CLOSING_Q = "לפני שנסיים, יש עוד משהו שחשוב לך שהמטפל ידע?";
  var DONE_SAY = "תודה רבה. המטפל יעבור על התשובות לפני הפגישה.";
  var ASK_AGE = "בן או בת כמה את או אתה?";
  var ASK_SEX = "ולצורך הרישום, את אישה או אתה גבר?";
  var ASK_PREGNANCY = "האם יש אפשרות שאת בהיריון?";
  var ASK_MEDS = "אילו תרופות, ויטמינים או תוספים את או אתה לוקחים כרגע? ואם יש מחלות רקע או אלרגיות, אפשר לספר גם עליהן.";
  var ASK_COMPLAINT = "ספרו לי במילים שלכם מה מביא אתכם לטיפול: מה מרגישים, ממתי, ומה מחמיר או מקל?";

  function createVoiceFlow(E, kb, state) {
    var step = "intake";
    var current = null;           // engine question waiting for an answer
    var pregnancyAsked = false;
    var redFlagRepeats = 0;
    var rfIds = kb.safety.red_flag_questions.map(function (q) { return q.id; });

    function out(status, say, extra) {
      var r = { status: status, say: say, step: step };
      Object.keys(extra || {}).forEach(function (k) { r[k] = extra[k]; });
      return r;
    }

    function halt() {
      step = "halted";
      current = null;
      return out("halt", kb.safety.emergency_template_he);
    }

    function needsPregnancy() {
      var p = state.patient;
      return p.sex === "F" && (!p.age || (p.age >= 12 && p.age <= 55));
    }

    function redFlagPrompt() {
      return "לפני שנמשיך, כמה שאלות בטיחות. האם אחד מהדברים האלה קורה לך עכשיו? " +
        kb.safety.red_flag_questions.map(function (q) { return q.q_he.replace(/^האם\s+/, "").replace(/\?$/, ""); }).join("; ") + "?";
    }

    function askNext() {
      current = E.nextQuestion(state);
      if (!current) {
        step = "closing";
        return out("ask", CLOSING_Q);
      }
      return out("ask", current.feature.q_he, { feature: current.feature.id, phase: current.phase });
    }

    function step_(p) {
      p = p || {};
      var said = String(p.patient_said || "").trim();
      var answer = p.answer || "other";
      var findings = [];

      if (step === "halted") return halt();
      if (step === "done") return out("done", DONE_SAY);

      if (step === "intake") {
        if (p.age) state.patient.age = Number(p.age) || state.patient.age;
        if (p.sex === "F" || p.sex === "M") state.patient.sex = p.sex;
        if (pregnancyAsked) {
          state.patient.pregnancy = p.pregnancy ||
            (answer === "yes" ? "yes" : answer === "no" ? "no" : "unknown");
        }
        if (screenOnly(said)) return halt();
        if (!state.patient.age) return out("repeat", ASK_AGE);
        if (!state.patient.sex) return out("ask", ASK_SEX);
        if (needsPregnancy() && !pregnancyAsked) {
          pregnancyAsked = true;
          return out("ask", ASK_PREGNANCY);
        }
        if (!needsPregnancy()) state.patient.pregnancy = "na";
        step = "redflags";
        return out("ask", redFlagPrompt());
      }

      if (step === "redflags") {
        var ids = String(p.red_flags || "").split(/[\s,]+/).filter(function (x) { return rfIds.indexOf(x) !== -1; });
        if (answer === "yes" || ids.length) {
          ids.forEach(function (id) { E.redFlagAnswer(state, id, true); });
          if (!ids.length) {
            state.flags.push({ category: "A", type: "rf_unspecified", gloss_en: "urgent symptom reported at screening",
                               verbatim_he: said, status: "current" });
          }
          state.halted = true;
          return halt();
        }
        if (screenOnly(said)) return halt();
        if (answer === "unsure" && redFlagRepeats === 0) {
          redFlagRepeats += 1;
          return out("repeat", "רק כדי לוודא, כי זה חשוב: " + redFlagPrompt());
        }
        if (answer === "unsure") {
          state.flags.push({ category: "D", type: "rf_uncertain", gloss_en: "patient unsure about urgent-symptom screening",
                             verbatim_he: said, status: "current" });
        }
        step = "meds";
        return out("ask", ASK_MEDS);
      }

      if (step === "meds") {
        if (screenOnly(said)) return halt();
        E.ingestMedications(state, answer === "no" ? "" : said);
        step = "complaint";
        return out("ask", ASK_COMPLAINT, { medications: state.patient.medications });
      }

      if (step === "complaint") {
        var c = E.ingestText(state, said, "chief_complaint");
        if (c.halted) return halt();
        step = "questions";
        return withFindings(askNext(), c.findings);
      }

      if (step === "questions") {
        var f = current.feature;
        var r = E.ingestText(state, said, f.id);
        if (r.halted) return halt();
        findings = r.findings;
        var own = r.findings.filter(function (x) { return x.feature === f.id; })[0];
        if (answer === "yes" || answer === "no" || answer === "unsure") {
          E.answerQuestion(state, current, answer === "yes" ? true : answer === "no" ? false : null);
        } else if (own) {
          E.answerQuestion(state, current, own.value);
        } else {
          state.asked.push(f.id);
          if (current.phase === "adaptive") state.adaptiveAsked += 1;
          E.setAnswer(state, f.id, null, "question", said);
        }
        return withFindings(askNext(), findings);
      }

      if (step === "closing") {
        if (said && answer !== "no") {
          var z = E.ingestText(state, said, "closing");
          if (z.halted) return halt();
          findings = z.findings;
        }
        step = "done";
        return withFindings(out("done", DONE_SAY), findings);
      }
      throw new Error("unknown step " + step);
    }

    // A red-flag word in an intake or medication answer halts the interview too; only then is the
    // answer passed to ingestText, so these answers never add symptom findings.
    function screenOnly(said) {
      if (!said || !E.screenText(said).length) return false;
      return E.ingestText(state, said, step).halted;
    }

    function withFindings(r, findings) {
      r.findings = findings || [];
      return r;
    }

    return {
      step: step_,
      current: function () { return current; },
      stage: function () { return step; },
      finish: function () { if (step !== "halted") step = "done"; }
    };
  }

  var api = { createVoiceFlow: createVoiceFlow };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.TCMVoiceFlow = api;
})(typeof window !== "undefined" ? window : this);

</script>
<script type="module">
// Voice mode: connects the page to the ElevenLabs agent and routes its `interview_step` tool calls
// to the voice flow (voice_flow.js), which drives the same engine and clinician view as the chat.
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm";

const ui = window.TCMInterviewUI;
const startBtn = document.getElementById("voice-start");
const endBtn = document.getElementById("voice-end");
const bar = document.getElementById("voicebar");
const orb = document.getElementById("voice-orb");
const statusEl = document.getElementById("voice-status");

let conversation = null;
let flow = null;
let raf = 0;

function agentId() {
  const fromUrl = new URLSearchParams(location.search).get("agent");
  return fromUrl || (window.TCM_VOICE_CONFIG || {}).agentId || "";
}

function setStatus(text, mode) {
  statusEl.textContent = text;
  orb.className = "orb" + (mode ? " " + mode : "");
}

function pulse() {
  if (!conversation) return;
  const speaking = orb.classList.contains("speaking");
  const v = speaking ? conversation.getOutputVolume() : conversation.getInputVolume();
  orb.style.transform = "scale(" + (1 + Math.min(1, v * 3)).toFixed(2) + ")";
  raf = requestAnimationFrame(pulse);
}

function interviewStep(params) {
  const r = flow.step(params);
  ui.showUnderstood(r.findings || []);
  if (r.status === "halt") ui.halt();
  else ui.renderClinician();
  // The agent only needs what to say next; the rest stays on the page.
  return JSON.stringify({ status: r.status, say: r.say });
}

async function start() {
  const id = agentId();
  if (!id) {
    ui.say("לא הוגדר סוכן קולי. יש להוסיף agentId לקובץ voice_config.js.", "alert");
    return;
  }
  startBtn.disabled = true;
  const state = ui.beginVoice();
  flow = window.TCMVoiceFlow.createVoiceFlow(ui.engine, ui.kb, state);
  bar.hidden = false;
  setStatus("מבקש גישה למיקרופון…");
  const problem = await checkMicrophone();
  if (problem) {
    setStatus("אין גישה למיקרופון");
    showMicHelp(problem);
    endBtn.hidden = true;
    startBtn.disabled = false;
    return;
  }
  setStatus("מתחבר…");
  try {
    conversation = await Conversation.startSession({
      agentId: id,
      // WebRTC gives the best audio; ?transport=websocket works on networks that block it.
      connectionType: new URLSearchParams(location.search).get("transport") === "websocket" ? "websocket" : "webrtc",
      clientTools: { interview_step: interviewStep },
      onConnect: () => setStatus("מחובר", "listening"),
      onModeChange: ({ mode }) => setStatus(mode === "speaking" ? "יעל מדברת" : "יעל מקשיבה", mode),
      onMessage: ({ source, message }) => { if (message) ui.say(message, source === "user" ? "pt" : "sys"); },
      onError: (message) => ui.say("שגיאה בשיחה הקולית: " + message, "alert"),
      onDisconnect: ended
    });
    window.TCMVoiceSession = conversation;   // for debugging from the console
    raf = requestAnimationFrame(pulse);
  } catch (e) {
    setStatus("החיבור נכשל: " + (e && e.message ? e.message : e));
    conversation = null;
    startBtn.disabled = false;
  }
}

// ---- microphone diagnosis ----
// A web page cannot open the browser's own settings, so this names the actual blocker and links
// straight to what can be opened: the operating system's microphone privacy page, a fresh tab
// outside a preview frame, and a copyable chrome:// address.

const OS = /Windows/i.test(navigator.userAgent) ? "windows" : /Mac OS X|Macintosh/i.test(navigator.userAgent) ? "mac" : "other";
const BROWSER_SETTINGS = /Edg\//.test(navigator.userAgent) ? "edge://settings/content/microphone" : "chrome://settings/content/microphone";

function inFrame() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

// Resolves to null when the microphone works, else {kind, detail}.
async function checkMicrophone() {
  // Chrome on Android opens downloaded files from content:// and never grants the microphone there.
  if (location.protocol === "content:" || (/Android/i.test(navigator.userAgent) && location.protocol === "file:")) {
    return { kind: "phonefile", detail: location.protocol };
  }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return { kind: "insecure", detail: location.protocol };
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((t) => t.stop());   // only a check; the SDK opens its own stream
    return null;
  } catch (e) {
    const name = (e && e.name) || "Error";
    let permission = "unknown";
    try { permission = (await navigator.permissions.query({ name: "microphone" })).state; } catch (_) { /* not supported */ }
    if (name === "NotFoundError" || name === "OverconstrainedError") return { kind: "nodevice", detail: name };
    if (name === "NotReadableError" || name === "AbortError") return { kind: "busy", detail: name };
    if (name === "NotAllowedError" || name === "SecurityError") {
      if (inFrame()) return { kind: "frame", detail: name + "/" + permission };
      return { kind: permission === "denied" ? "site" : "system", detail: name + "/" + permission };
    }
    return { kind: "other", detail: name + ": " + (e.message || "") };
  }
}

function h(tag, attrs, kids) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  });
  (kids || []).forEach((c) => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}

function osSettingsButton() {
  if (OS === "windows") {
    return h("a", { class: "btn", href: "ms-settings:privacy-microphone", text: "פתיחת הגדרות המיקרופון של Windows" });
  }
  if (OS === "mac") {
    return h("a", { class: "btn", href: "x-apple.systempreferences:com.apple.preference.security?Privacy_Microphone",
                    text: "פתיחת הגדרות המיקרופון של macOS" });
  }
  return null;
}

function copyButton(text) {
  const b = h("button", { class: "btn ghost", type: "button", text: "העתקת הכתובת " + text });
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); b.textContent = "הועתק. הדביקו בשורת הכתובת של דפדפן חדש"; }
    catch (e) { b.textContent = text; }
  });
  return b;
}

function retryButton(panel) {
  return h("button", { class: "btn", type: "button", text: "לנסות שוב",
                       onclick: () => { panel.remove(); endBtn.hidden = false; start(); } });
}

function showMicHelp(problem) {
  const old = document.getElementById("mic-help");
  if (old) old.remove();
  const panel = h("div", { class: "panel mic-help", id: "mic-help", role: "alert" });
  const steps = [];
  let title = "";
  const buttons = [];
  if (problem.kind === "frame") {
    title = "הדף פתוח בתוך תצוגה מקדימה, והיא לא מאפשרת שימוש במיקרופון.";
    steps.push("יש לפתוח את הדף בלשונית נפרדת של Chrome או Edge: להוריד את הקובץ ולפתוח אותו בלחיצה כפולה.");
    buttons.push(h("a", { class: "btn", href: location.href, target: "_blank", rel: "noopener", text: "פתיחה בלשונית חדשה" }));
  } else if (problem.kind === "site") {
    title = "הדפדפן חוסם את המיקרופון לדף הזה.";
    steps.push("ללחוץ על סמל המנעול או ההגדרות משמאל לכתובת הדף, ולשנות את \"מיקרופון\" ל\"אישור\".");
    steps.push("או להדביק את הכתובת " + BROWSER_SETTINGS + " בלשונית חדשה, ולהוריד את הדף מרשימת \"לא מורשה\".");
    steps.push("אחר כך לרענן את הדף וללחוץ שוב על \"שיחה קולית\".");
    buttons.push(copyButton(BROWSER_SETTINGS));
  } else if (problem.kind === "system") {
    title = "הדפדפן אישר, אבל מערכת ההפעלה חוסמת את המיקרופון לדפדפן.";
    steps.push(OS === "windows" ? "בהגדרות שייפתחו: להפעיל \"גישה למיקרופון\" ואת \"אפשר לאפליקציות שולחן עבודה לגשת למיקרופון\"."
      : OS === "mac" ? "בהגדרות שייפתחו: לסמן את Chrome או Edge ברשימה, ואז לסגור ולפתוח מחדש את הדפדפן."
      : "לבדוק בהגדרות הפרטיות של המערכת שלדפדפן מותר להשתמש במיקרופון.");
    steps.push("אם זה לא עוזר, לבדוק גם את הגדרת האתר בדפדפן (" + BROWSER_SETTINGS + ").");
    const os = osSettingsButton();
    if (os) buttons.push(os);
    buttons.push(copyButton(BROWSER_SETTINGS));
  } else if (problem.kind === "busy") {
    title = "המיקרופון תפוס על ידי תוכנה אחרת.";
    steps.push("לסגור תוכנות שמשתמשות במיקרופון (Zoom, Teams, WhatsApp וכדומה) ולנסות שוב.");
    const os = osSettingsButton();
    if (os) buttons.push(os);
  } else if (problem.kind === "nodevice") {
    title = "לא נמצא מיקרופון במחשב.";
    steps.push("לחבר מיקרופון או אוזניות עם מיקרופון, ולבדוק שהוא מוגדר כהתקן ברירת המחדל במערכת.");
    const os = osSettingsButton();
    if (os) buttons.push(os);
  } else if (problem.kind === "phonefile") {
    title = "בטלפון אי אפשר להשתמש במיקרופון בקובץ שהורד.";
    steps.push("Chrome באנדרואיד חוסם מיקרופון בקבצים שנפתחים מהזיכרון של הטלפון, גם כשההרשאה מאושרת.");
    steps.push("אפשר לפתוח את אותו הקובץ ב-Chrome או Edge במחשב, או להשתמש בדף בכתובת https.");
  } else if (problem.kind === "insecure") {
    title = "הדפדפן לא מאפשר מיקרופון בכתובת הזו.";
    steps.push("יש לפתוח את הקובץ ישירות מהמחשב (כתובת שמתחילה ב-file://) או מכתובת https, ב-Chrome או Edge.");
  } else {
    title = "לא הצלחנו להפעיל את המיקרופון.";
    steps.push("לבדוק את הגדרת המיקרופון בדפדפן (" + BROWSER_SETTINGS + ") ובמערכת ההפעלה, ולנסות שוב.");
    buttons.push(copyButton(BROWSER_SETTINGS));
    const os = osSettingsButton();
    if (os) buttons.push(os);
  }
  buttons.push(retryButton(panel));
  panel.appendChild(h("h3", { text: title }));
  panel.appendChild(h("ol", { class: "ev" }, steps.map((t) => h("li", { text: t }))));
  panel.appendChild(h("div", { class: "answers" }, buttons));
  panel.appendChild(h("p", { class: "voice-note", text: "פרטים טכניים: " + problem.detail }));
  bar.insertAdjacentElement("afterend", panel);
}

function ended() {
  cancelAnimationFrame(raf);
  conversation = null;
  if (flow) flow.finish();
  setStatus("השיחה הסתיימה. הסיכום מחכה בלשונית 'סיכום למטפל'.");
  orb.style.transform = "";
  endBtn.hidden = true;
  startBtn.disabled = false;
  ui.renderClinician();
}

startBtn.addEventListener("click", () => { endBtn.hidden = false; start(); });
endBtn.addEventListener("click", () => { if (conversation) conversation.endSession(); else ended(); });

</script>
