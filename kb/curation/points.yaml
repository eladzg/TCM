  classical: 太白足大指內側，內踝前核骨下陷中，脾脈所注，為俞土。銅人針三分，灸三壯。主身熱煩滿，腹脹食不化，嘔吐泄瀉膿血，腰痛，大便難，氣逆，霍亂腹中切痛，腸鳴，膝股胻痠轉筋，身重骨痛，胃心痛，腹脹胸滿，心痛脈緩。
