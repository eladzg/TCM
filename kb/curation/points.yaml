  channel_id: CH.GV
  name_pinyin: Chángqiáng
  name_zh: 长强
  name_en: Long Strong
  location: In the perineal region, on the midline halfway between the tip of the coccyx and the anus.
  actions: Traditionally regulates the Governing Vessel, clears damp-heat, and steadies the lower opening.
  indications: Reference uses include hemorrhoids, rectal prolapse, diarrhea, constipation, and pain around the coccyx.; Secondary uses include agitation, seizure patterns, and stiffness along the spine.
