  channel_id: CH.GB
  name_pinyin: Qiūxū
  name_zh: 丘墟
  name_en: Hill Ruins
  location: At the anterolateral ankle, in the hollow in front of and below the lateral malleolus, lateral to the extensor digitorum longus tendon.
  actions: Spreads Liver and Gallbladder qi; clears channel heat; stabilizes the ankle.
  indications: Lateral ankle pain or swelling; hypochondriac pain; bitter taste; eye redness.; Neck swelling; headache; indecision or timidity in traditional patterns.
  needling_notes: 'depth: 0.5–0.8 cun with controlled direction outside the ankle joint space; moxibustion: Point-specific moxibustion applicability is not established in the checked point source. Scarring/suppurative moxibustion near a joint is avoided.'
