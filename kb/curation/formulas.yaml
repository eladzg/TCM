    locator: 條35, 條36, 條37, 條46, 條51, 條52, 條55, 條232, 條235
  - source_id: GUT-SHANGHAN
    field: composition
    locator: 辨太陽病脈證並治（中）第六, after 條35
    quote: 麻黃三兩（去節）桂枝二兩（去皮）甘草一兩（炙）杏仁七十個（去皮尖）
  - source_id: GUT-SHANGHAN
    field: classical
    locator: 辨太陽病脈證並治（中）第六, 麻黃湯方
  - source_id: WS-YFJJ
    field: indications
    locator: 发表之劑第二·麻黄汤
    quote: 治傷寒太陽證，邪气在表，发熱、头痛、身痛、腰痛、骨節痛、项背强，恶寒恶风，無汗而喘，脈浮而紧。亦治哮證
  indications: '傷寒論 條35：太陽病，頭痛發熱，身疼腰痛，骨節疼痛，惡風無汗而喘者，麻黃湯主之。

    傷寒論 條36：太陽與陽明合病，喘而胸滿者，不可下，宜麻黃湯。

    傷寒論 條37：太陽病，十日已去，脈浮細而嗜卧者，外已解也。設胸滿脅痛者，與小柴胡湯，脈但浮者，與麻黃湯。

    傷寒論 條46：太陽病，脈浮緊，無汗，發熱，身疼痛，八九日不解，表證仍在，此當發其汗。到藥已微除，其人發煩，目瞑，劇者必衄，衄乃解。所以然者，陽氣重故也。麻黃湯主之。

    傷寒論 條51：脈浮者，病在表，可發汗，宜麻黃湯。

    傷寒論 條52：脈浮而數者，可發汗，宜麻黃湯。

    傷寒論 條55：傷寒，脈浮緊，不發汗，因致衄者，麻黃湯主之。

    傷寒論 條232：脈但浮，無餘證者，與麻黃湯；若不盡，腹滿加噦著，不治。

    傷寒論 條235：陽明病，脈浮，無汗而喘者，發汗則愈，宜麻黃湯。

    醫方集解 发表之劑第二·麻黄汤：治傷寒太陽證，邪气在表，发熱、头痛、身痛、腰痛、骨節痛、项背强，恶寒恶风，無汗而喘，脈浮而紧。亦治哮證'
  composition:
  - herb_id: HERB.MA_HUANG
    dose_original: 三兩（去節）
  - herb_id: HERB.GUI_ZHI
    dose_original: 二兩（去皮）
  - herb_id: HERB.GAN_CAO
    dose_original: 一兩（炙）
  - herb_id: HERB.XING_REN
    dose_original: 七十個（去皮尖）
  classical: 上四味，以水九升，先煮麻黃，減二升，去上沫；內諸藥；煮取二升半，去滓，溫服八合。覆取微似汗，不須啜粥。餘如桂枝法將息。
