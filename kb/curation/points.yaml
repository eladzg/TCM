  channel_id: CH.CV
  name_pinyin: Zhōngwǎn
  name_zh: 中脘
  name_en: Middle Epigastrium
  location: On the upper abdomen, 4 B-cun above the center of the umbilicus on the anterior midline, halfway to the xiphisternal junction.
  actions: Traditionally harmonizes the Stomach, strengthens the middle burner, and descends rebellious qi.
  indications: Reference uses include epigastric pain, nausea, vomiting, poor appetite, reflux, and abdominal fullness.; Secondary uses include diarrhea, insomnia linked with digestive disharmony, and phlegm accumulation.
  needling_notes: 'depth: 1.0-1.5 cun perpendicular, reduced according to abdominal wall and organ anatomy; moxibustion: Applicable outside pregnancy at CV-12; abdominal moxibustion is contraindicated throughout pregnancy'
  cautions: CV-12 requires reduced depth when the abdominal wall is thin because the peritoneal cavity lies beneath it. WHO advises avoiding upper-abdominal points after the third month of pregnancy.
  classical: 中脘（一名太倉）上脘下一寸，臍上四寸，居心蔽骨與臍之中，手太陽少陽足陽明任脈之會，上紀者，中脘也。胃之募也。難經曰：腑會中脘。疏曰：腑病治此。銅人針八分，留七呼，瀉五吸，疾出針，灸二七壯，止二百壯，明堂灸二七壯，止四百壯。素註針一寸二分，灸七壯。主五膈，喘息不止，腹暴脹，中惡，脾疼，飲食不進，□胃，赤白痢，寒癖氣，心疼，伏梁，心下如覆杯，心膨脹，面色痿黃，天行傷寒熱不已，溫瘧先腹痛，先瀉霍亂，瀉出不知，食飲不化，心痛生寒，不可俯仰，氣發噎。東垣曰：氣在於腸胃者，取之足太陰陽明，不下，取三里章門中脘。又曰：胃虛而致太陰無所稟者，於足陽明募穴中引導之。
