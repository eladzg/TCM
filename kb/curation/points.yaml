  name_zh: 上脘
  name_en: Upper Epigastrium
  location: On the upper abdomen, 5 B-cun above the center of the umbilicus on the anterior midline.
  actions: Traditionally harmonizes the Stomach, transforms phlegm, and settles rebellious qi.
