  name_pinyin: xuè fèn zhèng
  name_zh: 血分证
  category: Patterns of Wei-defence, qi, Ying nutrients and blood
  aetiology: This pattern often occurs when heat in febrile conditions moves blood, stirs wind and consumes yin.
  tongue: Characterized by fever that aggravates at night, restlessness, insomnia, unconsciousness, delirium, a dark purple tongue and a wiry, rapid pulse. Alternatively, dark purple maculae, haematemesis, nosebleed, bloody stools, bloody urine, a dry tongue with a scanty coating and a thready, deficient pulse may be present.
  pulse: Characterized by fever that aggravates at night, restlessness, insomnia, unconsciousness, delirium, a dark purple tongue and a wiry, rapid pulse. Alternatively, dark purple maculae, haematemesis, nosebleed, bloody stools, bloody urine, a dry tongue with a scanty coating and a thready, deficient pulse may be present.
