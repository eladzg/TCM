- point_id: GB21
  channel_id: CH.GB
  name_pinyin: Jiānjǐng
  name_zh: 肩井
  name_en: Shoulder Well
  location: At the top of the shoulder, midway along the line from the C7 spinous process to the lateral tip of the acromion.
  actions: Relaxes the shoulder; descends rebellious qi; transforms phlegm; promotes breast and labour functions in traditional practice.
  indications: Shoulder and upper-back pain; neck stiffness; restricted arm movement.; Breast swelling or impaired lactation; difficult labour in specialist obstetric practice.
  needling_notes: 'depth: Oblique across an isolated and gently lifted trapezius, never inferiorly toward the lung; depth must follow individual anatomy, posture and breathing.; moxibustion: Not established in checked sources.'
  cautions: The lung apex lies beneath GB-21, so an inferior or overly deep trajectory can cause pneumothorax. Pregnancy caution is traditional, especially before 37 weeks; reviewed human evidence has not shown increased miscarriage, preterm birth or reliable labour induction, but rare harm is not fully excluded and use requires individualized obstetric assessment.
  classical: 肩井（一名膊井）肩上陷中，缺盆上，大骨前一寸半，以三指按取，當中指下陷中，手足少陽足陽明陽維之會，連入五臟，針五分，灸五壯，先補後瀉。主中風氣塞，涎上不語，氣逆，婦人難產，墮胎後手足厥逆，針肩井，立愈，頭項痛，五勞七傷臂痛，兩手不得向頭，若針深悶倒，急補足三里，淵液（避唐祖諱改泉液）腋下三寸宛宛中，舉臂得之。銅人禁灸，明堂針三分。主寒熱，馬刀瘍，胸滿無力，臂不舉，不宜灸，灸之令人生腫蝕，馬瘍，內潰者死，寒熱者生。
  status: draft
