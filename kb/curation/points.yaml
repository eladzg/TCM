- point_id: CV15
  channel_id: CH.CV
  name_pinyin: Jiūwěi
  name_zh: 鸠尾
  name_en: Dove Tail
  location: On the upper abdomen, on the anterior midline 1 B-cun below the xiphisternal junction.
  actions: Traditionally opens the chest, calms the spirit, transforms phlegm, and descends rebellious qi.
  indications: Reference uses include chest or epigastric pain, palpitations, anxiety, nausea, and reflux.; Secondary uses include seizure patterns, agitation, and throat obstruction sensations.
  needling_notes: 'depth: 0.4-0.6 cun oblique inferiorly, reduced according to liver and cardiac anatomy; moxibustion: Contraindicated'
  cautions: Deep insertion may injure the left liver lobe or an enlarged heart. Superior angling toward the heart is contraindicated.
  classical: 鳩尾（一名尾翳一名□骭）在兩歧骨下一寸，曰鳩尾者，言其骨垂下，如鳩尾形脈之別。銅人禁灸，灸之令人少心力，大妙手方針，不然，針取氣多，令人夭，針三分，留三呼，瀉五吸，肥人倍之，明堂灸三壯。素註不可刺灸。主意賁熱病，偏頭痛引目外眥，噫喘喉鳴，胸滿欬嘔，喉痹咽腫，水漿不下，癲癇狂走，不擇言語，心中氣悶，不喜聞人語，欬唾血，心驚悸，精神耗散，少年房勞，短氣少氣，又靈樞經云：膏之原出於鳩尾。
