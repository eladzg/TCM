- point_id: LR1
  channel_id: CH.LR
  name_pinyin: Dàdūn
  name_zh: 大敦
  name_en: Large Pile
  location: On the lateral side of the great toe, 0.1 F-cun proximal to the outer corner of the toenail.
  actions: Regulates Liver qi; clears damp-heat from the lower burner; restores consciousness; calms agitation.
  indications: Genital pain or swelling; difficult urination; heavy menstrual bleeding; hernia-type pain.; Loss of consciousness; seizure patterns; anxiety or insomnia.
  needling_notes: 'depth: 0.1–0.2 cun oblique or superficial pricking; moxibustion: A historical text quoted by the checked educational source describes moxibustion at LV-1 as contraindicated during pregnancy and postpartum. This historical caution is not presented as a separately verified modern prohibition; current use requires an independent contemporary safety assessment.'
  classical: 大敦足大指端，去爪甲如韭葉及三毛中，足厥陰肝脈所出，為井木。銅人針三分，留十呼，灸三壯。主五淋卒疝七疝，小便數遺，不禁，陰頭中痛，汗出，陰上入小腹，陰偏大，腹臍中痛，悒悒不樂，病左取右，病右取左，腹脹腫病，小腹痛，中熱喜寐，尸厥，狀如死人，婦人血崩不止，陰挺出，陰中痛。
