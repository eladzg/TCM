  name_zh: 至阴
  name_en: Reaching Yin
  location: On the outer side of the little toe, 0.1 finger-cun behind the lateral corner of the toenail.
  actions: Traditionally clears the head and eyes and is used as a Jing-well point; obstetric moxibustion is a separate practice from needling.
  indications: Reference uses include headache, eye pain, nasal blockage, and little-toe pain; breech presentation belongs specifically to supervised BL-67 moxibustion evidence.; Secondary uses include urinary difficulty, retained placenta patterns, and little-toe pain.
  needling_notes: 'depth: 0.1-0.2 cun shallow perpendicular insertion or controlled prick; moxibustion: For breech presentation, use only within obstetric care after training; benefit is possible, but adverse-event evidence remains limited'
  cautions: Needling and moxibustion require separate cautions. BL-67 needling is traditionally avoided in pregnancy; reviewed needling studies found no objective obstetric harm. BL-67 moxibustion for breech may improve cephalic presentation, but adverse events were poorly reported and included contractions and burns, so it requires obstetric oversight.
