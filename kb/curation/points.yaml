  name_pinyin: Wàiqiū
  name_zh: 外丘
  name_en: Outer Hill
  location: On the fibular side of the lower leg, anterior to the fibula and 7 B-cun above the lateral malleolus.
  actions: Clears Gallbladder channel heat; relaxes the sinews; relieves acute pain.
  indications: Sudden lateral leg pain; neck pain; chest or hypochondriac discomfort.; Lower-limb weakness; skin disorders; agitation.
  needling_notes: 'depth: 1.0–1.5 cun perpendicular; moxibustion: Not established in checked sources.'
  classical: 外邱外踝上七寸，少陽所生。銅人針三分，灸三壯。主胸脹滿，膚痛，痿痺，頸項痛，惡風寒，猘犬傷，毒不出，發寒熱，速以三姓人可灸所嚙處及足少陽絡，癲疾，小兒龜胸。
