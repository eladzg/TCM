  classical: 復溜（一名冒陽一名伏白）足內踝上二寸，筋骨陷中，前傍骨是復溜，後傍筋是交信，二穴只隔一條筋，足少陰腎脈所行，為金經，腎虛補之。素註，針三分，留七呼，灸五壯，明堂灸七壯。主腸澼，腰脊內引痛，不得俛仰起坐，目視□□，善怒多言，舌乾胃熱，蟲動涎出，足痿不收履，胻寒不自曷，腹中雷鳴，腹脹如鼓，四肢腫，五種水病，青赤黃白黑，青取井，赤取榮，黃取俞，白取經，黑取合，血痔，泄後腫，五淋血淋，小便如散火，骨寒熱盜汗，汗注不止，齒齲，脈微細不見，或時無脈。
