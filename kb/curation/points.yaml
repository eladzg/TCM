- point_id: BL11
  channel_id: CH.BL
  name_pinyin: Dàzhù
  name_zh: 大杼
  name_en: Great Shuttle
  location: On the upper back, level with the lower edge of the T1 spinous process and 1.5 body-cun from the posterior midline.
  actions: Traditionally strengthens the bones, releases the exterior, and relaxes the upper back.
  indications: Reference uses include neck stiffness, upper-back pain, cough, and feverish exterior patterns.; Secondary uses include joint pain and reduced shoulder movement.
  needling_notes: 'depth: 0.5-0.7 cun oblique; individual thoracic anatomy and body build determine the safe limit; moxibustion: Applicable as non-scarring moxa'
  cautions: Regional WHO guidance warns that deep insertion on the back can injure lung or pleura. Point-specific teaching and thoracic depth studies support shallow oblique technique rather than deep perpendicular insertion.
  classical: 太杼項後第一椎下兩旁，相去脊一寸五分中，正坐取之，督脈別絡，手足太陰少陽之會。進經曰：骨會。大杼梳曰：骨病治此。袁氏曰：肩能負重，以骨會大杼也。銅人針五分，灸七壯，明堂禁灸，下經。素註，針三分，留七呼，灸七壯。資生云：非大急不灸。主膝痛不可屈伸，傷寒汗不出，腰脊痛，胸中鬱，熱甚不已，頭風振寒，項強不可俛仰，痎瘧頭旋，勞氣咳嗽，身熱目眩，腹痛僵仆，不能久立，煩滿裏急，身不安，筋攣癲疾，身踡急大。東垣曰：五臟氣亂，在於頭取之，天柱大杼，不補不瀉，以導氣而已。
