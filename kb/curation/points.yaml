  classical: 巨骨肩尖端上行，兩叉骨罅間陷中，手陽明陽蹻之會。銅人灸五壯，針一寸半，明堂灸三壯至七壯。素註禁針，針則倒懸，一食頃，乃得下針，針四分，瀉之勿補，針始出，得正臥，明堂灸三壯。主驚癇，破心吐血，臂膊痛，胸中有瘀血，肩臂不得屈伸。
