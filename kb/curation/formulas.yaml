    field: indications
    locator: 攻里之劑第四·大陷胸汤
    quote: 治傷寒下之早，表邪入里，心下满而硬痛，或重汗而复下之，不大便五六日，舌上燥渴，日晡潮熱，从心至小腹硬满，痛不可近；或無大熱，但头微汗出，脈沉，爲水结胸。
  indications: '傷寒論 條134：太陽病，脈浮而動數，浮則為風，數則為熱，動則為痛，數則為虛。頭痛發熱，微盜汗出，而反惡寒者，表未解也。醫反下之，動數變遲，膈內拒痛，胃中空虛，客氣動膈，短氣躁煩，心中懊憹，陽氣內陷，心下因硬，則為結胸，大陷胸湯主之。若不結胸，但頭汗出，餘處無汗，劑頸而還，小便不利，身必發黃。

    傷寒論 條135：傷寒六七日，結胞熱實，脈沉而緊，心下痛，按之石硬者，大陷胸湯主之。

    傷寒論 條136：傷寒十餘日，熱結在里，復往來寒熱者，與大柴胡湯；但結胸，無大熱者，此為水結在胸脅也，但頭微汗出者，大陷胸湯主之。

    傷寒論 條137：太陽病，重發汗而復下之，不大便五六日，舌上燥而渴，日哺所小有潮熱。從心下至少腹便滿而痛不可近者，大陷胸湯主之。

    傷寒論 條149：傷寒五六日，嘔而發熱者，柴胡湯證具。而以他藥下之，柴胡證仍在者，復與柴胡湯。此雖已下之，不為道，必蒸蒸而振，卻發熱汗出而解。若心下滿而硬痛者，此為結胸也，大陷胸湯主之；但滿而不痛者，此為痞，柴胡不中與之，宜半夏瀉心湯。

    醫方集解 攻里之劑第四·大陷胸汤：治傷寒下之早，表邪入里，心下满而硬痛，或重汗而复下之，不大便五六日，舌上燥渴，日晡潮熱，从心至小腹硬满，痛不可近；或無大熱，但头微汗出，脈沉，爲水结胸。'
