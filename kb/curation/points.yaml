- point_id: LU11
  channel_id: CH.LU
  name_pinyin: Shàoshāng
  name_zh: 少商
  name_en: Lesser Metal
  location: On the radial side of the thumb's distal phalanx, 0.1 f-cun proximal-lateral to the radial corner of the thumbnail.
  actions: Clears intense Lung and throat heat; expels wind; restores alertness in traditional emergency use.
  indications: Severe sore throat; fever; cough; nosebleed.; Fainting or reduced consciousness; agitation; numbness at the thumb tip.
  needling_notes: 'depth: 0.1 cun shallow oblique; professional pricking technique may be used; moxibustion: Not established in checked point-specific sources.'
  cautions: Pricking to bleed is an invasive professional technique and should not be attempted as self-treatment.
  classical: 少商大指內側，去爪甲角如韭葉，肺脈所出，為井木，宜以三稜針刺之，微出血，泄諸臟熱，湊不宜灸。主頷腫喉閉煩心善噦心下滿，汗出而寒，欬逆，痎瘧振寒，腹滿唾沫，唇乾引飲，食不下，膨脹，手攣指痛，掌熱寒慄，鼓頷，喉中鳴，小兒乳鵝。唐刺史成君綽，忽頷腫，大如升，喉中閉塞，水粒不下，三日，甄權以三稜針刺之，微出血，立愈，瀉腸熱也。素注，留一呼，明堂灸三壯，甲乙灸一壯。
