  term_zh: 缓脉
  kind: pulse
  definition: A pulse with about 4 beats in one breath (60 bpm). The beats come and go slowly. It indicates dampness, weakness of the spleen and stomach, or low ability to energize the pulse due to qi deficiency.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 907 (缓脉), p. 91
