  term_en: Six yang pulse
  term_zh: 六阳脉
  kind: pulse
  definition: 'One of the normal pulses: constitutional surging and large on Cun, Guan and Chi positions of both hands.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 922 (六阳脉), p. 91
