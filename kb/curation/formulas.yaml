  classical: 右四味，杵為散，酒服一錢匕，日三服，夜一服。但苦痛，加芍藥；心下毒痛，倍加芎藭；心煩吐痛，不能食飲，加細辛一兩、半夏大者二十枚，服之後，更以醋漿水服之；若嘔，以醋漿水服之，後不解者，小麥汁服之；已後渴者，大麥粥服之。病雖愈，服之勿置。
