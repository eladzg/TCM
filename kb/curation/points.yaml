  classical: 鬲俞七椎下兩旁，相去脊各一寸五分，正坐取之。難經曰：血會鬲俞。疏曰：血病治此。蓋上則心俞，心生血，下則肝俞，肝藏血，故病鬲為血會。又足太陽多血，血乃水之象也。銅人針三分，留七呼，灸三壯。素問刺中鬲皆為傷中，其病難愈，不過一歲必死。主心痛，周痺，吐食翻胃，骨蒸，四肢怠惰，嗜臥，癖欬逆，嘔吐，鬲胃寒痰，食飲不下，熱病汗不出，身重常溫，不能食，食則心痛，身痛腫脹，□腹滿，自汗盜汗。
