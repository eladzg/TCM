  classical: 天樞（一名長谿一名穀門）去肓俞一寸，俠臍中兩旁各二寸陷中，乃大腸之募，銅人灸百壯，針五分，留十呼。千金云：魂魄之舍不可針。素註，針五分，留一呼。主奔助泄瀉，脹癌，赤白痢，水利不止，食不下，水腫脹，腹腸鳴，上氣沖胸，不能久立，久積冷氣，繞臍切痛，時上沖心，煩滿嘔吐，霍亂，冬月感寒泄利，瘧寒熱狂言，傷寒，飲水過多，腹脹氣喘，婦人女子癥瘕，血結成塊，漏下赤白，月事不時。
