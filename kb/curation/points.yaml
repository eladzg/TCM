- point_id: ST17
  channel_id: CH.ST
  name_pinyin: Rǔzhōng
  name_zh: 乳中
  name_en: Breast Center
  location: At the center of the nipple; in males this is usually at the fourth intercostal space.
  actions: Serves only as a proportional landmark for locating nearby chest and abdominal points.
  indications: No therapeutic needling indication; location reference only.; Used to establish the vertical nipple line in point-location study.
  needling_notes: 'depth: Do not needle; moxibustion: Prohibited'
  cautions: Needling and moxibustion of the nipple and areola are prohibited; ST-17 is a landmark only.
  classical: 乳中當乳中是方銅人微刺三分，禁灸，灸則生蝕瘡，瘡中有濃血，清汁可治，瘡中有息肉，若蝕瘡者死。素問云：刺乳上，中乳房為腫根蝕。丹溪曰：乳房，陽明胃所經，乳頭厥陰肝所屬，乳子之母，不知調養，忿怒所逆，鬱悶所遏，厚味所釀，以致厥陰之氣不行，窗不得通，汁不得出。陽明之血沸騰，熱甚化膿，亦有所乳之子，膈有滯痰，口氣焮熱，含乳而睡，熱氣所吹，遂生結核。初起時，便須忍痛，探令稍軟，吮令汁透，自可消散，失此不治，必成癰瘣。若加以艾火兩三壯，其效尤捷，粗工，便用針刀，卒惹拙病。若不得夫與舅姑，憂怒鬱悶，脾氣消沮，肝氣橫逆，遂成結核，如棋子，不痛不痒，十數年後為瘡陷，名曰奶岩。以瘡形如嵌凹，似岩穴也。不可治矣。若於始生之際，能消息病根，使心清神安，然後醫治，庶有可安之理。
