  classical: 神門（一名銳中一名中都）掌後銳骨端陷中，手少陰心脈所注，為俞土，心實瀉之。銅人針三，留七呼，灸七壯。主瘧，心煩甚，欲得冷飲，惡寒，則欲處溫中，咽乾不嗜食，心痛數噫，恐悸，少氣不足，手臂寒，面赤喜笑，掌中熱而□，目黃□痛，喘逆身熱，狂悲狂笑，嘔血吐血，振寒上氣，遺溺失音，心性癡呆，健忘，心積伏梁，大小人五癇。東垣曰：胃氣下溜，五臟氣皆亂，其為病互相出見，氣在於心者，取之手少陰之俞神門，同精導氣，以復其本位。靈樞經曰：少陰無俞，心不病乎其外，經病而臟不病，故獨取其經，於掌後脫骨之端，心者，五臟六腑之大主，精神之所舍，其臟堅固，邪不能容，容邪則身死。故諸邪皆在心之包絡，包絡者，心主之脈也。
