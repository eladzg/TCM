- manifestation_id: MAN.MAI_ZHENG_HE_CAN
  term_en: Comprehensive analysis on pulse and symptoms
  term_zh: 脉症合参
  kind: pulse
  definition: A comprehensive analysis on the pulse and symptoms in diagnosing medical conditions. Sometimes the pulse is consistent with the symptoms, for example, a superficial, rapid pulse in a yang heat pattern or a thready, weak pulse in a deficiency pattern. Sometimes, the pulse is not consistent with the symptoms, for example, a deep, thready pulse in a yang heat pattern or a surging, large pulse in a deficiency pattern.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 870 (脉症合参), p. 85
- manifestation_id: MAN.SHE_MAI_CONG_ZHENG
  term_en: Precedence of symptoms over the pulse
  term_zh: 舍脉从症
  kind: pulse
  definition: When there is an inconsistency between the pulse and symptoms, sometimes the treatment strategy is more based on symptoms than the pulse if symptoms manifest the pathological nature.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 871 (舍脉从症), p. 85
- manifestation_id: MAN.SHE_ZHENG_CONG_MAI
  term_en: Precedence of the pulse over symptoms
  term_zh: 舍症从脉
  kind: pulse
  definition: When there is an inconsistency between the pulse and symptoms, sometimes the treatment strategy is more based on the pulse than symptoms if the pulse manifests the pathological nature.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 872 (舍症从脉), p. 85
- manifestation_id: MAN.MAI_WU_WEI_QI
  term_en: Pulse bereft of stomach qi
  term_zh: 脉无胃气
  kind: pulse
  definition: A pulse that has lost its usual rhythm, frequency and evenness, manifesting as wiry, tight, hard or scattered, rootless and irregular. It is often a life-threatening sign, indicating an exhaustion of stomach qi and vital qi failure of the five zang organs.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 873 (脉无胃气), p. 85
- manifestation_id: MAN.MAI_CONG_SI_SHI
  term_en: Correspondence between the pulse and the four seasons
  term_zh: 脉从四时
  kind: pulse
  definition: Physiological variations of normal pulses in four seasons. These include a mild wiry pulse in warm spring, a mild surging pulse in hot summer, a mild superficial pulse in cool autumn and a mild deep pulse in cold winter. The inconsistency or contradiction between the pulse and seasons indicates an abnormal body condition.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 874 (脉从四时), p. 87
- manifestation_id: MAN.CHUN_MAI_RU_XIAN
  term_en: Wiry pulse in spring
  term_zh: 春脉如弦
  kind: pulse
  definition: In spring, yang qi ascends, everything comes out of hibernation and stretches in all directions, and qi and blood within the body starts to flow outward. Hence, the pulse is wiry and straight.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 875 (春脉如弦), p. 87
- manifestation_id: MAN.XIA_MAI_RU_GOU
  term_en: Hooked pulse in summer
  term_zh: 夏脉如钩
  kind: pulse
  definition: In summer, yang qi flourishes and everything grows. As a result, the pulse is surging, large, and forceful, like roaring waves that crash onto the shore powerfully and slowly fade away.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 876 (夏脉如钩), p. 87
- manifestation_id: MAN.QIU_MAI_RU_FU
  term_en: Superficial pulse in autumn
  term_zh: 秋脉如浮
  kind: pulse
  definition: In autumn, yang qi starts to constrict and the pulsation decreases. As a result, the pulse is mild, superficial and comes in a rush and becomes scattered.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 877 (秋脉如浮), p. 87
- manifestation_id: MAN.DONG_MAI_RU_YING
  term_en: Deep pulse in winter
  term_zh: 冬脉如营
  kind: pulse
  definition: In winter, yang qi hides inside, and the skin pore is closed. As a result, the pulse is deep.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 878 (冬脉如营), p. 87
- manifestation_id: MAN.YANG_WEI_YIN_XIAN
  term_en: Feeble yang and wiry yin
  term_zh: 阳微阴弦
  kind: sign
  definition: Feeble yang results from yang qi deficiency of the upper jiao. Wiry yin results from excess yin cold in the lower jiao. Yin cold obstructing chest yang may cause chest bi-impediment or cardiac pain.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 879 (阳微阴弦), p. 87
- manifestation_id: MAN.GE_YANG_GUAN_YIN
  term_en: Rejected yang and blocked yin
  term_zh: 格阳关阴
  kind: sign
  definition: When the carotid pulsation feels four times stronger than normal, it is called rejected yang. It results from the three yang meridians (with overflow of qi and blood) rejecting the three yin meridians. When the radial pulsation is felt four times stronger than normal, it is called blocked yang. It results from the three yin meridians (with overflow of qi and blood) rejecting the three yang meridians. These conditions are also referred to as blockage between the upper and lower bodies. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 880 (格阳关阴), p. 87
- manifestation_id: MAN.WAI_GUAN_NEI_GE
  term_en: External blockage and internal rejection
  term_zh: 外关内格
  kind: sign
  definition: Refers to radial pulsation felt at Yuji (LU 10), indicating that yang qi is blocked outside, whereas yin qi is rejected inside.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 881 (外关内格), p. 87
- manifestation_id: MAN.FU_ZHONG_CHEN
  term_en: Floating, medium and deep
  term_zh: 浮、中、沉
  kind: sign
  definition: Three levels in feeling the pulse by using light, moderate and heavy powers respectively.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 882 (浮、中、沉), p. 87
- manifestation_id: MAN.CUN_GUAN_CHI
  term_en: Cun, Guan and Chi
  term_zh: 寸关尺
  kind: sign
  definition: The three sections over the radial artery for feeling the pulse. Specifically, the Guan position is central to the styloid process at the wrist, where the tip of the physician’s middle finger is placed; the Chi position is next to it on the distal aspect where the tip of the physicians’index finger is placed; and the Cun position is on the proximal aspect where the tip of the physicians’ring finger is placed.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 883 (寸关尺), p. 87
- manifestation_id: MAN.CUN_MAI
  term_en: The Cun pulsation
  term_zh: 寸脉
  kind: sign
  definition: 'One of the three positions at the Cunkou area: the pulsation of the radial artery felt at the radial styloid process.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 884 (寸脉), p. 87
- manifestation_id: MAN.GUAN_MAI
  term_en: The Guan pulsation
  term_zh: 关脉
  kind: sign
  definition: 'One of the three positions at the Cunkou area: the pulsation of the radial artery felt at the ulnar side of the radial styloid process.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 885 (关脉), p. 87
- manifestation_id: MAN.CHI_MAI
  term_en: The Chi pulsation
  term_zh: 尺脉
  kind: sign
  definition: 'One of the three positions at the Cunkou area: the pulsation of the radial artery felt at the cubital side of the radial styloid process.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 886 (尺脉), p. 87
- manifestation_id: MAN.DAN_AN
  term_en: Pressing with one finger
  term_zh: 单按
  kind: sign
  definition: A pulse diagnosis method to feel the pulse on one hand with just one finger to differentiate the conditions of Cun, Guan and Chi pulses. For example, to lift the index and ring fingers while feeling the Guan position with the middle finger.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 887 (单按), p. 87
- manifestation_id: MAN.PING_MAI
  term_en: Normal pulse
  term_zh: 平脉
  kind: pulse
  definition: 'A pulse that can be felt at all three regions, with a frequency of 4–5 beats (60–75 beats per minute (bpm)) in one breath. It is neither superficial nor deep. It is relaxed, smooth, soft, forceful and rhythmic. It is marked by the three essential elements: stomach qi, spirit and root.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 888 (平脉), p. 87
- manifestation_id: MAN.FU_MAI
  term_en: Floating pulse
  term_zh: 浮脉
  kind: pulse
  definition: A pulse that can be easily felt with gentle touch but become insufficient or weak when pressing down. Often indicates an exterior pattern or yang qi deficiency.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 889 (浮脉), p. 87
- manifestation_id: MAN.CHEN_MAI
  term_en: Deep pulse
  term_zh: 沉脉
  kind: pulse
  definition: A pulse that is difficult to feel with light or moderate pressure but can be felt on heavy pressure. It indicates an interior pattern. Specifically, a deep, forceful pulse indicates an interior excess pattern; whereas a deep, weak pulse indicates an interior deficiency pattern.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 890 (沉脉), p. 89
- manifestation_id: MAN.SHU_MAI
  term_en: Rapid pulse
  term_zh: 数脉
  kind: pulse
  definition: A pulse with more than 5 beats in one breath (>75 bpm). It indicates a heat pattern. Specifically, a rapid, forceful pulse indicates an excess heat pattern; whereas a rapid, weak pulse indicates a deficiency heat pattern.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 892 (数脉), p. 89
- manifestation_id: MAN.HONG_MAI
  term_en: Surging pulse
  term_zh: 洪脉
  kind: pulse
  definition: A pulse that is broad, large and forceful like roaring waves that crash onto the shore powerfully and slowly fade away. Often indicates an excess heat pattern.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 893 (洪脉), p. 89
- manifestation_id: MAN.DA_MAI
  term_en: Large pulse
  term_zh: 大脉
  kind: pulse
  definition: A pulse that is broad and can be felt on all three fingers. It indicates pathogenic factors prevailing over anti-pathogenic qi. A large, forceful pulse indicates an excess heat pattern; whereas a large, weak pulse indicates a deficiency pattern or loss of qi.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 894 (大脉), p. 89
- manifestation_id: MAN.WEI_MAI
  term_en: Feeble pulse
  term_zh: 微脉
  kind: pulse
  definition: A pulse that is extremely thin, soft and barely palpable. It may be felt and then sometimes is lost. It indicates deficiency of yin, yang, qi and blood.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 895 (微脉), p. 89
- manifestation_id: MAN.XI_MAI
  term_en: Thready pulse
  term_zh: 细脉
  kind: pulse
