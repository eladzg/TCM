  classical: 曲泉膝股上內側輔骨下，大筋上，小筋下陷中，屈膝橫紋頭取之，足厥陰肝脈所入，為合水，肝虛則補之。銅人針六分，留十呼，灸三壯。主□疝陰股痛，小便難，腹□肢滿，癃閉少氣，泄利，四肢不舉，實則身目眩痛，汗不出，目□□，膝關痛，筋攣不可屈伸，發狂，□血下血，喘呼小腹痛，引咽喉，房勞失精，身體極痛，泄水下痢膿血，陰腫，陰莖痛，胻腫，膝脛冷疼，女子血瘕，按之如湯浸股肉，小腹腫，陰挺出，陰癢。
