  classical: 伏兔膝上六寸起肉，正跪坐而取之，以左右各三指按捺。有肉起，如免之狀，因以此名。此事難知，定癰疽死，地方有九，伏兔居一。劉宗厚曰：脈絡所會也。主膝冷不得溫，風勞痺逆，狂邪，手攣縮，身癮□，腹脹少氣，頭重腳氣，婦人八部諸疾，銅人針五分，禁灸。
