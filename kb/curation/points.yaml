  name_pinyin: Fēngfǔ
  name_zh: 风府
  name_en: Wind Palace
  location: At the back of the neck, directly below the external occipital protuberance, in the depression between the trapezius muscles.
  actions: Traditionally expels wind, clears the head and senses, and calms internal wind.
  indications: Reference uses include occipital headache, neck stiffness, dizziness, speech difficulty, and nasal blockage.; Secondary uses include seizure patterns, altered consciousness, and agitation.
  needling_notes: 'depth: Specialist-only, anatomy-dependent insertion; never direct deeply or superiorly toward the medulla; moxibustion: Not established: checked point sources report caution and prohibition'
  cautions: The medulla oblongata lies deep to GV-16. MRI research shows that tissue depth varies with BMI and sex, so no single fixed depth is safe for every person; deep or superior insertion is prohibited.
  classical: 風府（一名舌根）項後入髮際一寸，大筋內宛宛中，疾言其肉立起，言休立下，足太陽督脈陽維之會。銅人針三分，禁灸，灸之使人失音，明堂針四分，留三呼。素註針四分。主中風，舌緩不語，振寒汗出，身重惡寒，頭痛，項急不得回顧，偏風半身不遂鼻□，咽喉腫痛，傷寒狂走，欲自殺，目妄視，頭中百病，馬黃黃疽。瘧論曰：邪客於風府循膂而下，衛氣一日夜大會於風府，明日日下一節，故其作晏，每至於風府，則腠理開，腠理開則邪氣入，邪氣入則病作，以此日作，稍益晏也。其出於風府，日出一節二十五日，下至□骨，二十六日入於脊，內故日作益晏也。昔魏武帝患風傷項急，華陀治此穴得效。
