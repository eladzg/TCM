- point_id: LU9
  channel_id: CH.LU
  name_pinyin: Tàiyuān
  name_zh: 太渊
  name_en: Great Abyss
  location: At the radial side of the palmar wrist crease, between the radial styloid and scaphoid, in the depression ulnar to the abductor pollicis longus tendon and over the radial artery.
  actions: Strengthens Lung qi and yin; transforms phlegm; supports the gathering qi; benefits the pulse and vessels.
  indications: Chronic weak cough; wheezing with deficiency; copious phlegm; shortness of breath.; Weak or irregular pulse; wrist pain; hiccups; cold or weak limbs.
  needling_notes: 'depth: 0.3-0.5 cun perpendicular; moxibustion: Not established in checked point-specific sources; avoid direct moxibustion over the radial artery.'
  cautions: This point lies over the radial artery. The vessel must be identified and avoided.
  classical: 太淵（一名大泉避唐祖諱）掌後內側橫紋頭，動脈中，肺脈所注為俞土，肺虛補之。難經曰：脈會太淵。疏曰：脈病治此，平旦寅時，氣血從此始。故曰寸口者，脈之大要會，手太陰之動脈也。灸二壯，針二分，留三呼。主胸痺逆氣，善噦嘔，飲水咳嗽，煩悶不得眠，肺脹膨，腎內廉痛，目生白翳眼痛赤，乍寒熱，缺盆中引痛，掌中熱，數欠，肩背痛，寒喘不得息，噫氣上逆，心痛，脈濇，咳血嘔血，振寒，咽乾，狂言口□，溺色變，卒遺矢無度。
