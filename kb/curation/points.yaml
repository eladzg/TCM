  classical: 廉泉（一名舌片）頸下結喉上中央，仰面取之，陰維任脈之會。素註低針取之，針一寸，留七呼。銅人灸三壯，針三分，得氣即瀉，明堂針二分。主咳嗽上氣，喘急，嘔沫，舌下腫難言，舌根縮急不食，舌縱涎出，口瘡。
