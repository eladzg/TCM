  classical: 偏歷腕中後三寸，手陽明絡脈，別走太陰，銅人針三分，留七呼，灸三壯，明堂灸五壯。主肩膊肘腕痠痛，瞇目□□，齒痛鼻□，寒熱瘧，癲疾多言，咽喉乾，喉痺，耳鳴，風汗不出，利小便，實則齟聾，瀉之，虛則齒寒痺鬲，補之。
