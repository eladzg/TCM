  needling_notes: 'depth: 0.3–0.5 cun perpendicular; moxibustion: Not established in checked sources.'
  classical: 臨泣足小指次指本節後陷中，去俠谿一寸五分，足少陽所注為俞木，甲乙針二分留五呼，灸三壯。主胸中滿缺盆中，及腋下馬刀瘍廔，善齒頰，天牖中腫淫濼胻痠，目眩，枕骨合顱痛，洒淅振寒，心痛，周痺，痛，無常處，厥逆氣喘不能行，□瘧日發，婦人月事不利，季□支滿乳癰。地五會足小指次指本節後陷中，去俠谿一寸，銅人針一分，禁灸。主腋痛，內損唾血，足外無膏澤，乳癰。
