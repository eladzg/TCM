  indications: '傷寒論 條71：太陽病，發汗後，大汗出，胃中乾，煩躁不得眠，欲得飲水者，少少與飲之，令胃氣和則愈。若脈浮，小便不利，微熱消渴者，五苓散主之。

    傷寒論 條72：發汗已，脈浮數，煩渴者，五苓散主之。

    傷寒論 條73：傷寒，汗出而渴者，五苓散主之。不渴者，茯苓甘草湯主之。

    傷寒論 條74：中風發熱，六七日不解而煩，有表裡證，渴欲飲水，水入則吐者，名曰水逆，五苓散主之。

    傷寒論 條141：病在陽，應以汗解之，反以冷水氵巽之，若灌之，其熱被劫，不得去，彌更益煩，肉上粟起，意欲飲水，反不渴者，服文蛤散；若不差者，與五苓散。寒實結胸，無熱證者，與三物小陷胸湯，白散亦可服。

    傷寒論 條156：本以下之，故心下痞，與瀉心湯；痞不解，其人渴而日燥，煩，小便不利者，五苓散主之。

    傷寒論 條244：太陽病，寸緩關浮尺弱，其人發熱汗出，復惡寒，不嘔，但心下痞者，此以醫下之也。如其不下者，病人不惡寒而渴者，此轉屬陽明也。小便數者，大便必硬，不更衣十日，無所苦也。渴欲飲水，少少與之，但以法救之；渴者，宜五苓散。

    傷寒論 條386：霍亂，頭痛發熱，身疼痛，熱多欲飲水者，五苓散主之，寒多不用水者，理中丸主之。'
