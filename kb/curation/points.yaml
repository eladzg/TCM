  classical: 曲池肘下輔骨，屈肘橫紋頭陷中，以手拱胸取之，手陽明大腸脈所入，為合土。素註，針五分，留七呼，銅人針七分，得氣先瀉後補，灸三壯，明堂曰灸七壯，至二百壯，且停十餘日更灸，止二百壯。主繞踝風，手臂紅腫，肘中痛，偏風，半身不遂，惡風邪氣，泣出善忘，風癮□，喉痺不能言，胸中煩滿，臂膊疼痛，筋緩促物不得，挽引不開，屈伸難，風痺肘細無力，傷寒餘熱不盡，皮膚乾燥，瘈瘲癲疾，舉體痛痒如虫嚙，皮脫作瘡，皮膚痂疥，婦人經脈不通。
