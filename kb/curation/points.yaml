  channel_id: CH.LU
  name_pinyin: Chǐzé
  name_zh: 尺泽
  name_en: Cubit Marsh
  location: At the cubital crease, in the depression immediately lateral to the biceps brachii tendon.
  actions: Clears Lung heat; redirects Lung qi downward; assists fluid movement; relaxes the elbow channel.
  indications: Cough; wheezing; coughing blood; sore throat; chest congestion.; Acute vomiting or diarrhea; urinary difficulty; elbow or forearm spasm and pain.
