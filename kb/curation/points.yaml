  classical: 丘墟足外踝下，從前陷中骨縫中，去臨泣三寸，又俠谿穴中量上，外踝骨前五寸，足少陽所過為原，膽虛實皆拔之。銅人灸三壯，素註，針五分，留七呼。主胸□滿痛，不得息，久瘧振寒，腋下腫，痿厥坐不能起，髀樞中痛，目生翳膜，腿胻痠，轉筋卒疝，小腹堅，寒熱頸腫，腰胯痛，太息。
