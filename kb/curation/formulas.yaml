    quote: 治三阴傷寒，身痛腹痛，下利清谷，恶寒不渴，四肢厥冷；或反不恶寒，面赤烦躁，里寒外熱；或干呕，或咽痛，脈沉微细欲绝
  indications: '傷寒論 條29：傷寒，脈浮，自汗出，小便數，心煩，微惡寒，腳攣急。反與桂枝欲攻其表，此誤也。得之便厥，咽中乾，煩躁吐逆者，作甘草乾薑湯與之，以復其陽。若厥愈足溫者，更作芍藥甘草湯與之，其腳即伸；若胃氣不和，譫語者，少與調胃承氣湯，若重發汗，復加燒針者，四逆湯主之。

    傷寒論 條91：傷寒，醫下之，續得下利清谷不止，身疼痛者，急當救里。後身疼痛，清便自調者，急當救表。救里，宜四逆湯；救表，宜桂枝湯。

    傷寒論 條225：脈浮而遲，表熱里寒，下利清谷者，四逆湯主之。

    傷寒論 條324：少陰病，飲食入口則吐，心中溫溫欲吐，復不能吐，始得之，手足寒，脈弦遲者，此胸中實，不可下也，當吐之；若膈上有寒飲，乾嘔者，不可吐也。當溫之，宜四逆湯。

    傷寒論 條353：大汗出，熱不去，內拘急，四肢疼，又下利厥逆而惡寒者，四逆湯主之。

    傷寒論 條354：大汗，若大下利而厥冷者，四逆湯主之。

    傷寒論 條372：下利腹脹滿，身體疼痛者，先溫其里，乃攻其表。溫里，宜四逆湯；攻表，宜桂枝湯。

    傷寒論 條377：嘔而脈弱，小便複利，身有微熱，見厥者難治。四逆湯主之。

    傷寒論 條388：吐利汗出，發熱惡寒，四肢拘急，手足厥冷者，四逆湯主之。

    傷寒論 條389：既吐且利，小便復利而大汗出，下利清穀，內寒外熱，脈微欲絕者，四逆湯主之。

    醫方集解 祛寒之劑第十·四逆汤：治三阴傷寒，身痛腹痛，下利清谷，恶寒不渴，四肢厥冷；或反不恶寒，面赤烦躁，里寒外熱；或干呕，或咽痛，脈沉微细欲绝'
