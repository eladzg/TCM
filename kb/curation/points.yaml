  classical: □會上星後一寸陷中。銅人灸二七壯，至七七壯，初灸不痛，病去即痛，痛止灸，若是鼻塞，灸至四日漸退，七日頓愈，針二分，留三呼，得氣即瀉。八歲以下不可針，緣□門未合，刺之恐傷其骨，令人夭。素註針四分。主腦虛冷，或飲酒過多，腦疼如破，□血面赤，暴腫，頭皮腫，生白屑風，頭眩顏青，目眩，鼻塞不聞香，驚悸，目戴上不識人。
