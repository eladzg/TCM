  classical: 承漿（一名懸漿）唇稜下陷中，開口取之，大腸脈胃脈督脈任脈之會。素註針二分，留五呼，灸三壯。銅人灸七壯，止七七壯，明堂針三分，得氣即瀉，留三呼，徐徐引氣而出，日灸七壯，過七七，停四日，五日後灸七七壯，若一向不灸，恐足陽明脈斷，其病不愈，停息復灸，令血脈通宣，其病立愈。主偏風，半身不遂，口眼喎斜，面腫，消渴，口齒疳蝕生瘡，暴瘖不能言。
