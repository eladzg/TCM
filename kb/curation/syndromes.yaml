- syndrome_id: SYN.EP.RE
  name_en: Heat pattern
  name_pinyin: rè zhèng
  name_zh: 热证
  category: Patterns according to the eight principles
  presentation: Characterized by fever, a red face, thirst, constipation and yellow or red urine. It is sub-categorized into patterns of exterior heat, interior heat, deficiency heat and excess heat. Often results from contracting pathogenic heat or hyperactivity of yang due to yin deficiency.
  tongue: Alternatively, malar flush, night sweats, feverish sensations in the palms, soles and chest, a dry, red tongue and a thready, rapid pulse may be present.
