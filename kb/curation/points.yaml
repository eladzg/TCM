  channel_id: CH.GB
  name_pinyin: Yángfǔ
  name_zh: 阳辅
  name_en: Yang Aid
  location: On the fibular side of the lower leg, anterior to the fibula and 4 B-cun above the lateral malleolus.
  actions: Clears Gallbladder fire; spreads channel qi; relieves pain along the lateral body.
  indications: Migraine; eye pain; bitter taste; lateral chest or leg pain.; Neck swelling; fever patterns; ankle weakness.
  needling_notes: 'depth: 1.0–1.5 cun perpendicular; moxibustion: Not established in checked sources.'
  classical: 陽輔（一名分肉）足外踝上四寸，輔骨前絕骨端三分，去邱墟七寸，足少陽所行，為經火，膽實瀉之。素註，針三分，又曰針七分，留十呼。銅人灸三壯，針五分，留七呼。主腰溶溶如坐水中，膝下浮腫筋攣，百節痠疼，實無所知，諸節盡痛，痛無常處，腋下腫痿，喉痺，馬刀挾癭，膝胻痠，風痺不仁，厥逆，口苦，太息，心□痛，面塵，頭角頷痛，目銳眥痛，缺盆中腫痛，汗出振寒瘧，胸中□肋髀膝外，至絕骨外踝前痛，善潔，面青。
