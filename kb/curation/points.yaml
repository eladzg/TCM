  classical: 湧泉（一名地衝）足心陷中，屈足捲指宛宛中，白肉際，跪取之，足少陰腎水所出為井木，實則瀉之。銅人針五分，無令出血，灸三壯，明堂灸不及針。素註針三分，留三呼。主尸厥而黑如炭色，欬吐有血，渴而喘，坐欲起，目□□無所見，善恐惕惕，如人將捕之，舌乾咽腫，上氣嗌乾，煩心，心痛，黃疽腸澼，股內後廉痛痿厥，嗜臥善悲欠，小腸急痛，泄而下重，足脛寒而逆，腰痛，大便難，心中結，熱風□風，癇心病，飢不嗜食，咳嗽身熱，喉閉舌急，失音，卒心痛，喉痺，胸□滿悶，頸痛目眩，五指端盡痛，足不踐地，足不熱，男子如蠱，女子如辰，婦人無子，轉胞不得尿。千金翼云：主喜喘，脊□相引，忽忽喜忘，陰痺腹脹，腰痛，不欲食，喘逆，足下冷至膝，咽中痛，不可納食，瘖不能言，小便不利，小腹痛，風入腸中，癲病，使臍痛，鼻□不止，五疝熱病，先腰痠，喜渴，數引飲，身項痛而寒且痠，足熱，不欲言，頭痛癲癲然，少氣，寒厥，霍亂，轉筋腎積賁豚，漢濟北王阿母，病患熱厥，足熱，淳于意刺足心，立愈。
  status: draft
