  term_zh: 斜飞脉
  kind: pulse
  definition: 'A physiological variation of a normal pulse: the changes of the anatomic position of the radial artery shifts the pulse normally at the Cunkou region to the dorsum of the hand from the Chi position.'
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 918 (斜飞脉), p. 91
- manifestation_id: MAN.FU_YANG_MAI
