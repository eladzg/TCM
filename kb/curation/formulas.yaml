    dose_original: 十四個（擘）
  - herb_id: HERB.DAN_DOU_CHI
    dose_original: 四合（綿裹）
  classical: 上二味，以水四個，先煮梔子得二分半；內豉，煮取一升半，去滓，分為二服，溫進一服（得吐者，止後服）。
