  classical: 太谿（一名呂細）足內踝後五分，跟骨上動脈陷中，男子婦人病，有此脈則生，無則死，足少陰腎脈所注，為俞土。素註，針三分，留七呼，灸三壯。主久瘧欬逆，心痛如錐刺，心脈沈手足寒至節，喘息者死，嘔吐痰實，口中如膠，善噫，寒疝，熱病汗不出，默默嗜臥，溺黃消痺，大便難，咽腫唾血，□癖寒熱，欬嗽不嗜食，腹□痛，瘦瘠，傷寒手足厥冷。東垣曰：成痿者，以導濕熱，引胃氣出行陽道，不令濕土剋腎水，其穴在太谿，流注賦云：牙齒痛堪治。
