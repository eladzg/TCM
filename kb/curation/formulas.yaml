  indications: '傷寒論 條208：陽明病，脈遲雖汗出，不惡寒者，其身必重，短氣，腹滿而喘；有潮熱者，此外欲解，可攻里也。手足濈然汗出者，此大便已硬也，大承氣湯主之。若汗多，微發熱惡寒者，外未解也，其熱不潮，未可與承氣湯，若腹大滿不通者，可與小承氣湯微和胃氣，勿令至大泄下。

    傷寒論 條209：陽明病，潮熱，大便微硬者，可與大承氣湯，不硬者，不可與之。若不大便六七，恐有燥屎，欲知之法，少與小承氣湯，湯入腹中，轉矢氣者，此有燥屎也，乃可攻之；若不轉矢氣者，此但初頭硬，後必溏，不可攻之，攻之必脹滿不能食也。欲飲水者，與水則噦。其後發熱者，必大便複復硬而少也，以小承氣湯和之。不轉矢氣者，慎不可攻也。

    傷寒論 條213：陽明病，其人多汗，以津液外出，胃中燥，大便必硬，硬則譫語，小承氣湯主之。若一服譫語止者，更莫復服。

    傷寒論 條214：陽明病，譫語，發潮熱，脈滑而疾者，小承氣湯主之。因與承氣湯一升，腹中轉氣者，更服一升。若不轉氣者，勿更與之；明日又不大便，脈反微澀者，里虛也，為難治，不可更與承氣湯也。

    傷寒論 條250：太陽病，若吐，若下、若發汗後，微煩，小便數，大便因硬者，與小承氣湯和之愈。

    傷寒論 條374：下利，譫語者，有燥屎也，宜小承氣湯。'
