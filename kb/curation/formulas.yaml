  - source_id: GUT-SHANGHAN
    field: classical
    locator: 辨太陽病脈證並治（上）第五, 調胃承氣湯方
  indications: '傷寒論 條29：傷寒，脈浮，自汗出，小便數，心煩，微惡寒，腳攣急。反與桂枝欲攻其表，此誤也。得之便厥，咽中乾，煩躁吐逆者，作甘草乾薑湯與之，以復其陽。若厥愈足溫者，更作芍藥甘草湯與之，其腳即伸；若胃氣不和，譫語者，少與調胃承氣湯，若重發汗，復加燒針者，四逆湯主之。

    傷寒論 條70：發汗後，惡寒者，虛故也；不惡寒，但熱者，實也。當和胃氣，與調胃承氣湯。

    傷寒論 條94：太陽病未解，脈陰陽俱停，必先振慄汗出而解。但陽脈微者，先汗出而解；但陰脈微者，下之而解。若欲下之，宜調胃承氣湯。

    傷寒論 條105：傷寒十三日，過經譫語者，以有熱也，當以湯下之。若小便利者，大便當硬，而反下利，脈調和者，知醫以丸藥下之，非其治也。若自下利者，脈當微厥；今反和者，此為內實也。調胃承氣湯主之。

    傷寒論 條123：太陽病，過經十餘日，心下溫溫欲吐，而胸中痛，大便反溏，腹微滿，鬱郁微煩，先此時自極吐下者，與調胃承氣湯。若不爾者，不可與。但欲嘔，胸中痛，微溏者，此非柴胡湯徵，以嘔，故知極吐下也。

    傷寒論 條207：陽明病，不吐不下，心煩者，可與調胃承氣湯。

    傷寒論 條248：太陽病三日，發汗不解，蒸蒸發熱者，屬胃也。調胃承氣湯主之。

    傷寒論 條249：傷寒吐後，腹脹滿者，與調胃承氣湯。'
