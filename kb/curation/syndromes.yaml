  name_pinyin: pí qì xià xiàn zhèng
  name_zh: 脾气下陷证
  category: Patterns of the spleen system
  presentation: Characterized by a bearing-down sensation in the abdomen that aggravates after eating food. Frequent urges to defaecate with a bearing-down sensation of the anus, persistent diarrhoea, rectal prolapse, prolapsed uterus or cloudy urine may be present. Associated symptoms may include shortness of breath, fatigue, lassitude, reluctance to talk, dizziness, blurred vision, a pale, lustreless face, poor appetite and loose stools. This pattern often develops from severe spleen qi deficiency and occurs when spleen qi fails to ascend.
