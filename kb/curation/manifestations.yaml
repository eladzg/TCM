  term_zh: 代脉
  kind: pulse
  definition: A pulse that arrives fast, and stops regularly for a relatively longer period of time. It indicates qi deficiency of the zang organs, fear or traumatic injuries. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 915 (代脉), p. 91
