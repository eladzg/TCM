  cautions: The lung lies deep to this region. Do not direct a needle deeply or medially; a qualified practitioner should use a shallow lateral or transverse approach.
  classical: 雲門巨骨下，俠氣戶旁二寸中，動脈應手，舉臂取之，去胸中行各六寸。素注針七分，銅人針三分，灸五壯。主傷寒四肢熱不已，欬逆喘不得息，胸□短氣，氣上沖心，胸中煩滿，□徹背痛，喉痺肩痛，臂不舉，癭氣。
