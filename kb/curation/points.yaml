  name_pinyin: Chéngjiāng
  name_zh: 承浆
  name_en: Container of Fluids
  location: On the face, in the depression at the center of the groove between the lower lip and the chin.
  actions: Traditionally benefits the mouth and face, dispels wind, and relieves local pain.
