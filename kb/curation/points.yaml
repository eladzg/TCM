  channel_id: CH.LR
  name_pinyin: Zhāngmén
  name_zh: 章门
  name_en: Camphorwood Gate
  location: On the lateral abdomen, immediately inferior to the free end of the eleventh rib.
  actions: Harmonizes the Liver and Spleen; moves abdominal qi; supports transformation and transport.
  indications: Abdominal distention or pain; poor appetite; loose stools; hypochondriac discomfort.; Vomiting; fatigue; lumbar pain; palpable abdominal tension.
  needling_notes: 'depth: No universal safe depth is established; the checked point source lists 0.8–1.0 cun, but side-specific organ anatomy must determine a shallow non-visceral trajectory.; moxibustion: Not established in checked sources.'
  cautions: LV-13 is on the lateral abdomen below the free end of the eleventh rib. Deep insertion in this region can injure abdominal solid organs; assess individual anatomy and avoid a visceral trajectory.
  classical: 章門（一名長平一名□□）大橫外，直季□肋端，□臍上二寸，兩旁六寸，側臥，屈上足，伸下足，舉臂取之。又曰：肘尖盡處是穴，脾之募，足少陽厥陰之會。難經曰：臟會章門。疏曰：臟病治此。銅人針六分，灸百壯，明堂日灸七壯，止五百壯。素註，針八分，留六呼，灸三壯。主腸鳴盈盈然，食不化，□痛不得臥，煩熱口乾，不嗜食，胸□痛，支滿喘息，心痛而嘔吐逆，飲食卻出，腰痛不得轉側，腰脊冷疼，溺多白濁，傷飽，身黃瘦，賁豚積聚，腹腫如鼓，脊強，四肢懈惰，善恐，少氣厥逆，肩臂不舉。東垣曰：氣在於腸胃者，取之太陰陽明，不下。取三里章門中腕，魏士珪妻徐病疝，自臍下上至於心，皆脹滿，嘔逆煩悶，不進飲食。滑伯仁曰：此寒在下焦，為灸章門氣海。
