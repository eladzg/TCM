- point_id: CV17
  channel_id: CH.CV
  name_pinyin: Dànzhōng
  name_zh: 膻中
  name_en: Chest Center
  location: On the anterior midline of the thorax, level with the fourth intercostal space.
  actions: Traditionally regulates qi, opens the chest, benefits the breasts, and calms respiratory constraint.
  indications: Reference uses include chest tightness, cough, wheezing, shortness of breath, and breast pain or reduced lactation.; Secondary uses include palpitations, anxiety, hiccup, and difficulty swallowing.
  needling_notes: 'depth: 0.3-0.5 cun subcutaneous or transverse; moxibustion: Applicable according to the checked CV-17 point source'
  cautions: Use transverse needling only. A congenital sternal foramen may be present beneath CV-17, so deep perpendicular insertion can pass through the sternum and endanger thoracic structures.
  classical: 膻中（一名元見）玉堂下一寸六分，橫量兩乳中陷中，仰而取之，足太陰少陰，手太陽少陽之會。難經曰：氣會膻中。疏曰：氣病治此，灸五壯，明堂灸七壯止二七壯，禁針。主上氣短氣，欬逆噎氣，鬲氣喉鳴，喘咳不下食，胸中如塞，心胸痛，風痛咳嗽，肺癰吐膿，嘔吐涎沫，婦人乳汁少。
