  name_pinyin: Zúlínqì
  name_zh: 足临泣
  name_en: Foot Falling Tears
  location: On the top of the foot, just distal to the bases of the fourth and fifth metatarsals and lateral to the fifth extensor tendon.
  actions: Spreads Liver qi; clears Gallbladder heat; regulates the Girdling vessel; benefits the breast and eyes.
