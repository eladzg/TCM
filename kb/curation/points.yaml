  classical: 三間（一名少谷）食指本節後內側陷中，手陽明大腸脈所注，為俞木，銅人針三分，留三呼，灸三壯。主喉痺咽中如梗，下齒齟痛，嗜臥，胸腹滿，腸鳴洞泄，寒熱瘧，唇焦口乾，氣喘，目眥急痛，吐舌，戾頸，善驚多唾，急食不通傷寒氣熱，身寒結水。東垣曰：氣在於臂，取之先去血，脈後深取，手陽明之榮俞，二間三間。
