  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 925 (人迎脉), p. 91
- manifestation_id: MAN.GUAI_MAI
  term_en: Strange pulse
  term_zh: 怪脉
  kind: pulse
  definition: A pulse that has no root (stomach qi). Often occurs in later stage of critical conditions, indicating qi exhaustion of zang–fu organs and collapse of stomach qi.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 926 (怪脉), p. 93
- manifestation_id: MAN.YUE_JING_MAI
  term_en: Menstruation pulse
  term_zh: 月经脉
  kind: pulse
  definition: A pulse (usually slippery) often seen in healthy menstruating women. It indicates harmony between qi and blood during the period.
