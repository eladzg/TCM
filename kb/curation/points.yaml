- point_id: BL43
  channel_id: CH.BL
  name_pinyin: Gāohuāng
  name_zh: 膏肓
  name_en: Vitals
  location: On the upper back, level with the lower edge of the T4 spinous process and 3 body-cun from the posterior midline.
  actions: Traditionally nourishes deficiency, supports Lung and Kidney qi, and calms the spirit.
  indications: Reference uses include chronic cough, breathlessness, night sweating, fatigue, and poor appetite in deficiency patterns.; Secondary uses include poor memory, seminal emission, and shoulder-blade pain.
  needling_notes: 'depth: 0.3-0.5 cun oblique; individual thoracic anatomy determines the safe limit; moxibustion: Applicable as non-scarring moxa; this point is traditionally associated with moxa'
  cautions: Regional WHO guidance warns of lung and pleural injury from excessive back needling. Point-specific anatomy places this point over the thoracic cage; avoid deep perpendicular insertion.
  classical: 膏肓俞四椎下一分，一椎下二分，兩旁相去脊各三寸，正坐取之，正坐取脊，伸兩手，以臂著膝前令端直，手大指與膝頭齊，以物支肘，毋令搖動取之。銅人灸百壯，多至五百壯，當覺礱礱然，似水流之伏，亦當有所下，若無停痰宿飲，則無所下也。如病人已困，不能正坐，當令側臥，挽上臂，令取穴灸之。又當灸臍下氣海，丹田，關元，中極，四穴中取一穴，又灸足三里，以引火氣實下。主無所不療，羸瘦虛損，傳尸骨蒸，夢中失精，上氣欬逆，發狂，健忘痰病，左傳成公十年，晉候疾病，求醫於秦，秦使醫緩（秦醫名緩）為之，未至。公夢疾為二豎子，曰：彼良醫也。懼傷我，焉逃之，其一曰：居肓之上，膏之下，若我何？醫至曰：疾不可為也。在肓之上，膏之下，攻之不可，達之不及，藥不至焉，不可為也？公曰：良醫也。厚為之禮而歸之。孫思邈曰：特人拙不能得此穴，所以宿□難遣，若用心方便，求得灸之，疾無不愈。按此二穴，世皆以此為起死回生之妙穴，殊不知病有淺深，而醫有難易，淺者針灸，可保十全，深者亦未易為，猵鶾云：病有六不治。經云：色脈不順，而莫針也。肓鬲也。心下為膏。又曰：凝者為脂，釋者為膏。又曰：膏連心脂膏也。人年二旬後，方可灸此二穴，仍灸三里二穴，引火氣下行，以固其本。若未出幼而灸之，恐火氣盛，上焦作熱，每見醫家不分老少，又多不針瀉三里，以致虛火上炎，是不經口授而妄作也。豈能瘳其疾哉，患者灸此，必針三里或氣海，更清心絕慾，參閱前後各經調攝，何患乎疾之不瘳也。
