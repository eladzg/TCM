    dose_original: 等分
  - herb_id: HERB.FU_LING
    dose_original: 等分
  - herb_id: HERB.MU_DAN_PI
    dose_original: 等分
  - herb_id: HERB.TAO_REN
    dose_original: 等分
  - herb_id: HERB.BAI_SHAO_YAO
    dose_original: 等分
  classical: 右五味，末之，煉蜜和丸如兔屎大，每日食前服一丸，不知，加至三丸。
