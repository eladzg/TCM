  location: On the upper back, level with the lower edge of the T3 spinous process and 1.5 body-cun from the posterior midline.
  actions: Traditionally regulates Lung qi, supports defensive qi, and clears Lung heat.
  indications: Reference uses include cough, wheeze, shortness of breath, and recurrent exterior illness.; Secondary uses include night sweating, upper-back pain, and skin disorders.
