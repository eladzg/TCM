    quote: 治腹中不和而痛。仲景用治误表发厥，脚挛吐逆，與干姜甘草汤以复其陽
  indications: '傷寒論 條29：傷寒，脈浮，自汗出，小便數，心煩，微惡寒，腳攣急。反與桂枝欲攻其表，此誤也。得之便厥，咽中乾，煩躁吐逆者，作甘草乾薑湯與之，以復其陽。若厥愈足溫者，更作芍藥甘草湯與之，其腳即伸；若胃氣不和，譫語者，少與調胃承氣湯，若重發汗，復加燒針者，四逆湯主之。

    傷寒論 條30：問曰：證象陽旦，按法治之而增劇，厥逆，咽中乾，兩脛拘急而譫語。師曰：言夜半手足當溫，兩腳當伸。後如師言。何以知此？答曰：寸口脈浮而大，浮為風，大為虛，風則生微熱，虛則兩腔攣，病形象桂枝，因加附子參其間，增桂令汗出，附子溫經，亡陽故也。厥逆，咽中乾，煩躁，陽明內結，譫語煩亂，更飲甘草乾薑湯。夜半陽氣還，兩足當熱，脛尚微拘急，重與芍藥甘草湯，爾乃腔伸。以承氣湯微溏，則止其譫語，故知病可愈。

    醫方集解 和解之劑第六·芍藥甘草汤：治腹中不和而痛。仲景用治误表发厥，脚挛吐逆，與干姜甘草汤以复其陽'
  composition:
