   syn_he: ["ידיים קרות", "רגליים קרות", "כפות רגליים קרות", "אצבעות קרות"],
   en: ['cold (limbs|extremities)', 'cold hands', 'cold (hands/)?feet', 'cold (hands|feet)']}
- {id: FT.FEELS_HOT, group: cold_heat, screen: true, tags: [heat],
   q_he: "האם חם לך יותר מלאחרים, או שאת/ה מעדיף/ה מקום קריר?",
   label_he: "תחושת חום / העדפת קור",
   syn_he: ["חם לי", "מרגיש חם", "מרגישה חם", "שונא חום", "שונאת חום", "מזיע מהר"],
   en: ['aversion to heat', 'heat intolerance', 'preference for cold', 'feverish sensation(?!s? in the palms)']}
- {id: FT.FEVER, group: cold_heat, tags: [heat],
   q_he: "האם היה לך חום (טמפרטורה גבוהה) בימים האחרונים?",
   label_he: "חום (טמפרטורה)",
   syn_he: ["חום גבוה", "קדחת", "טמפרטורה", "היה לי חום", "יש לי חום"],
   en: ['(?<!tidal )(?<!low-grade )(?<!afternoon )\bfever\b(?! (that aggravates )?in the afternoon)']}
- {id: FT.FIVE_PALM_HEAT, group: cold_heat, tags: [heat, def],
   q_he: "האם יש לך תחושת חום בכפות הידיים, בכפות הרגליים או בחזה, בעיקר בערב?",
   label_he: "חום בכפות ידיים ורגליים",
   syn_he: ["חום בכפות", "כפות ידיים חמות", "כפות רגליים חמות", "שורף בכפות"],
   en: ['feverish sensations? in the palms', 'heat in the (palms|five centres)', 'five[- ]cent(re|er) heat']}
- {id: FT.HOT_FLUSHES, group: cold_heat, tags: [heat, def],
   q_he: "האם יש לך גלי חום או סומק בלחיים, בעיקר אחר הצהריים או בערב?",
   label_he: "גלי חום / סומק בלחיים",
   syn_he: ["גלי חום", "גל חום", "הסמקה", "סומק"],
   en: ['hot flush(es)?', 'tidal fever', 'afternoon fever', 'low-grade fever', 'malar flush', 'flushed cheeks']}
- {id: FT.ALTERNATING, group: cold_heat, tags: [],
   q_he: "האם יש לך התחלפות בין צמרמורת לחום?",
   label_he: "התחלפות קור וחום",
   syn_he: ["פעם קר לי ופעם חם", "קר וחם לסירוגין"],
   en: ['alternating (fever and )?chills', 'alternating fever', 'alternating chills']}
- {id: FT.RED_FACE, group: cold_heat, tags: [heat],
   q_he: "האם הפנים שלך נוטות להיות אדומות או סמוקות?",
   label_he: "פנים אדומות",
   syn_he: ["פנים אדומות", "פרצוף אדום", "פנים סמוקות"],
   en: ['red face', 'flushed face', 'facial (flushing|redness)', 'red complexion']}
- {id: FT.PALE_FACE, group: cold_heat, tags: [def],
