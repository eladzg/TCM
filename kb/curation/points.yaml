- point_id: GB20
  channel_id: CH.GB
  name_pinyin: Fēngchí
  name_zh: 风池
  name_en: Wind Pool
  location: Below the occipital bone, in the hollow between the upper attachments of sternocleidomastoid and trapezius, level with GV-16.
  actions: Expels external wind; clears the head and senses; benefits the neck; settles internal wind.
  indications: Occipital headache; dizziness or vertigo; stiff neck; eye or ear symptoms.; Nasal congestion; insomnia; facial pain; febrile illness patterns.
  needling_notes: 'depth: No universal safe numeric depth is established; select direction and depth from individual posterior-neck anatomy. The checked 0.5–0.8 cun study protocol is not a general safety standard.; moxibustion: Not established in checked point source; heat near hair requires strict burn and fire precautions.'
  cautions: GB-20 has been involved in reports of subarachnoid haemorrhage, with excessively deep posterior-neck insertion suspected in serious injuries. Use only controlled, anatomy-specific direction and depth by a trained practitioner.
  classical: 風池耳後顳□後，腦空下髮際陷中，按之引於耳中，手足少陽陽維之會。素註針四分，明堂針三分。銅人針七分，留七呼，灸七壯，甲乙針一寸二分。患大風者，先補後瀉，少可患者，以經取之，留五呼，瀉七吸，灸不及針，日七壯，至百壯。主洒淅寒熱，傷寒溫病汗不出，目眩，苦遍正頭痛，□瘧，頸項如拔，痛不得回顧，目淚出，欠氣多，鼻鼽□，目內眥赤痛，氣發耳塞，目不明，腰背俱痛，腰傴僂引，頸筋無力不收，大風中風氣塞，涎上不語，昏危癭氣。
