- point_id: LU1
  channel_id: CH.LU
  name_pinyin: Zhōngfǔ
  name_zh: 中府
  name_en: Central Palace
  location: On the upper anterior chest, level with the first intercostal space and 6 B-cun lateral to the anterior midline; it lies 1 B-cun below LU-2.
  actions: Directs rebellious Lung qi downward; opens the chest; clears heat affecting the Lung.
  indications: Cough; wheezing; chest pain.; Shoulder or back pain; abdominal distention.
  needling_notes: 'depth: Superficial oblique or transverse insertion, limited by individual thoracic anatomy; safe depth may be as little as 10-20 mm; moxibustion: Not established in checked point-specific sources.'
  cautions: This point overlies the lung region. Deep perpendicular insertion can cause pneumothorax; needling requires controlled oblique or transverse technique by a qualified practitioner.
  classical: 中府（一名膺俞）雲門下一寸六分，乳上三肋間，動脈應手陷中，去胸中行各六寸，肺之募，（募猶結募也言經氣聚此）手足太陰二脈之會。針三分，留五呼，灸五壯。主腹脹，四肢腫，食不下，喘氣胸滿，肩背痛，嘔□欬逆上氣，肺系急，肺寒，胸悚悚，膽熱嘔逆，欬唾濁涕，風汗出，皮痛而腫，少氣，不得臥，傷中熱，飛尸遁注，癭瘤。
