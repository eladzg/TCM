  classical: 上廉（一名上巨虛）三里下三寸，兩筋骨鏬中，舉足取之，銅人灸三壯，針三分，甄權隨年為壯，明堂針八分，得氣即瀉，灸日七壯。主臟氣不足，偏風腳氣，腰腿手足不仁，腳脛痠痛，屈伸難，不久立，風水膝腫，骨髓冷痛，大腸冷，食不化，餮泄勞瘵，夾臍腹兩□病，腸中切痛雷鳴，氣上衝胸，喘息不能行，不能久立，傷寒胃中熱。東垣曰：脾胃虛弱，濕痿汗泄妨食，三里氣街出血，不愈，於上廉出血。
