  classical: 委中（一名血□）膕中央約紋，動脈陷中，令人面挺伏地，臥取之，足太陽膀胱脈所入，為合土。素註針五分，留七呼。銅人針八分，留三呼，瀉七吸，甲乙針五分，禁灸。素問，刺委中大脈，令人仆脫色。主膝痛，及拇指腰俠脊沉沉然，遺溺，腰重不能舉，小腹堅滿體風痺，髀樞痛，可出血，痼□皆愈，傷寒四肢熱，熱病汗不出，取其經血立愈，委中者，血□也。大風髮眉墮落，刺之出血。
