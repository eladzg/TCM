  channel_id: CH.LR
  name_pinyin: Qīmén
  name_zh: 期门
  name_en: Cycle Gate
  location: On the anterior chest, in the sixth intercostal space and 4 B-cun lateral to the anterior midline.
  actions: Harmonizes the Liver and Stomach; regulates Liver qi; moves blood.
  indications: Hypochondriac or chest pain; nausea or vomiting; abdominal distention; breast discomfort.; Hiccups; acid regurgitation; emotional constraint; cough.
  needling_notes: 'depth: 0.5–0.8 cun oblique or subcutaneous along the intercostal space; never deep or perpendicular.; moxibustion: Not established in checked sources.'
  cautions: LV-14 is an anterior thoracic point overlying pleural, pulmonary, hepatic and major vascular structures. A fatal aortic haemorrhage was reported after 4 cm insertion at LR-14, and deep needling has also been linked to abdominal organ perforation; use only shallow oblique or subcutaneous technique.
  classical: 期門直乳二肋端，不容旁一寸五分，又云：乳旁一寸半，直下又一寸半，肝之募，足厥陰太陰陰維之會。銅人針四分，灸五壯。主胸中煩熱賁豚上下，目青而嘔，霍亂泄利，腹堅硬，大喘不得坐臥，□下積氣，傷寒心切痛，喜嘔酸食飲不下，食後吐水，胸□痛，支滿，男子婦人血結胸滿，赤面火燥，口乾消渴。胸中痛不可忍，傷寒過經不解，熱入血室，男子則陽明而傷，下血譫語。婦人月水適來，邪乘虛而入，及產後餘疾，一婦人患熱入血室。許學士云：小柴胡已遲，當刺期門，針之，如言而愈，太陽與少陽併病，頭項強痛或眩，如結胸，心下痞硬者，當刺大椎第二行肝俞肺俞，慎不可發汗，發汗則譫語，五六日譫語不止，當刺期門。
