- point_id: CV14
  channel_id: CH.CV
  name_pinyin: Jùquè
  name_zh: 巨阙
  name_en: Great Palace
  location: On the upper abdomen, 6 B-cun above the center of the umbilicus on the anterior midline.
  actions: Traditionally regulates the Heart, calms the spirit, opens the chest, and harmonizes the Stomach.
  indications: Reference uses include palpitations, chest discomfort, anxiety, insomnia, epigastric pain, and reflux.; Secondary uses include poor memory, nausea, and seizure patterns.
  needling_notes: 'depth: 0.5-1.0 cun oblique inferiorly, reduced according to liver and cardiac anatomy; moxibustion: Contraindicated'
  cautions: Deep insertion may injure the left lobe of the liver or an enlarged heart. Never angle the needle superiorly toward the heart.
  classical: 巨闕鳩尾下一寸，心之募。銅人針六分，留七呼，得氣即瀉，灸七壯，止七七壯。主上氣咳逆，胸滿短氣，背痛胸痛痞塞，數種心痛，冷痛，蛔蟲痛，蠱毒，貓鬼，胸中痰飲，先心痛，先吐，霍亂不識人，驚悸，腹脹暴痛，慌惚不止，吐逆不食，傷寒煩心，喜嘔發狂，少氣，腹痛，黃疸，急疸，急疫咳嗽，狐疝小腹脹，噫煩熱，鬲中不利，五臟氣相干，卒心痛，尸厥，妊娠子上衝心昏悶，刺巨闕下針。令人立甦不悶，次補合谷，瀉三陰交，胎應針而落，如子手掬心，生下手有針痕頂毋心，向前，人中有針痕，向後，枕骨有針痕，是驗。按十四經發揮云：凡人心下有膈膜，前齊鳩尾，後齊十一椎，周圍著脊。所以遮隔濁氣，不使上薰心肺，是心在膈上也。難產之婦。若子上衝，至膈則止，況兒腹中又有衣胞裹之，豈能破膈掬心哉，心為一身之主，神明出焉，不容小有所犯，豈有被衝掬而不死哉。蓋以其上衝近心。故云爾，如胃脘痛曰心痛之類是也。學者不可以辭害意。
  status: draft
