  name_pinyin: xià jiāo shī rè zhèng
  name_zh: 下焦湿热证
  category: Sanjiao patterns
  presentation: Characterized by urinary dribbling with a painful urination, loose stools with a strong odour, and lower abdominal distension and pain. Alternatively, urine retention, constipation, yellow, white and smelly vaginal discharge, fever and thirst may be present.
