  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 908 (革脉), p. 91
- manifestation_id: MAN.LAO_MAI
  term_en: Firm pulse
  term_zh: 牢脉
  kind: pulse
  definition: A pulse that feels deep, excessive, string-taut and long. It is indistinct on light or moderate pressure but stable on heavy pressure. It indicates internal cold, perhaps hernia and abdominal masses.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 909 (牢脉), p. 91
- manifestation_id: MAN.RUO_MAI
  term_en: Weak pulse
  term_zh: 弱脉
  kind: pulse
  definition: A pulse that feels thready, soft, deep and weak. It indicates deficiency of qi and blood.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 910 (弱脉), p. 91
