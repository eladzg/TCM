- point_id: ST30
  channel_id: CH.ST
  name_pinyin: Qìchōng
  name_zh: 气冲
  name_en: Penetrating Qi
  location: In the groin, level with the upper border of the pubic symphysis, 2 B-cun lateral to the anterior midline and over the femoral artery.
  actions: Regulates the lower burner and Penetrating vessel; settles counterflow qi in the abdomen.
  indications: Groin or lower abdominal pain; hernia-type pain; menstrual irregularity.; Genital swelling; erectile difficulty; agitation with upward-rushing qi.
  needling_notes: 'depth: 0.5-1.0 cun perpendicular with strict vessel avoidance; moxibustion: Not established in checked point-specific sources; avoid direct moxibustion over the femoral artery and avoid lower-abdominal moxibustion during pregnancy.'
  cautions: The femoral artery lies beneath this point and must be avoided. As a lower abdominal and groin point, it also requires pregnancy-specific assessment.
  classical: 氣衝（一名氣衝）歸來下一寸，去中行各二寸，動脈應手宛宛中，衝脈所起，銅人人灸七壯，炷如大，麥針素問刺中脈血不出，為腫鼠僕，明堂針三分，留七呼，氣至即瀉，灸三壯。主腹滿，不得正臥，癩疝，大腸中熱，身熱腹痛，大氣石水，陰痿莖痛，兩丸騫痛，小腹奔助，腹有逆氣，上攻心腹，脹滿上搶心，痛不得息。腰痛不得俛仰，淫濼，傷寒胃中熱，婦人無子，小腸痛，月水不利，娠子上衝心，生難，胞衣不出。東垣曰：脾胃虛弱，感濕成痿，汗大泄，妨食，三里氣街，以三稜針出血。又曰：吐血多不愈，以三稜針於氣街出血立愈。
