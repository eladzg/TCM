  term_en: Racing pulse
  term_zh: 疾脉
  kind: pulse
  definition: A pulse that arrives swiftly and has a faster rate than a rapid pulse. It indicates acute febrile conditions, exhaustion of yin and impending exhaustion of Yuan-primordial qi.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 916 (疾脉), p. 91
