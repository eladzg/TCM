  classical: 神庭直鼻上，入髮際五分，足太陽督脈之會。素註灸三壯。銅人灸二七壯，至七七壯，禁針，針則發狂，目失睛。主登高而歌，棄衣而走，角弓反張，吐舌，癲疾，風癇，目上視不識人，頭風目眩，鼻出清涕不止，目淚出，驚悸不得安寢，嘔吐煩滿，寒熱頭痛，喘渴。岐伯曰：凡欲療風，勿令灸多，緣風性輕，多即傷，惟宜灸七壯，至三七壯止。張子和曰：目腫目翳，針神庭，上星，□會，前項，翳者可使立退，腫者可使立消。
