  channel_id: CH.LR
  name_pinyin: Xíngjiān
  name_zh: 行间
  name_en: Moving Between
  location: On the top of the foot between the first and second toes, just proximal to the web margin at the red-white skin border.
  actions: Drains Liver fire; clears heat from the lower burner; settles internal wind; moves Liver qi.
  indications: Irritability; headache; red eyes; genital itching or painful urination.; Heavy menstruation; insomnia; bitter taste; foot pain.
  needling_notes: 'depth: 0.5–0.8 cun oblique; moxibustion: Not established in checked sources.'
  classical: 行間足大指縫間，動脈應手陷中，足厥陰肝脈所溜，為榮火，肝實則瀉之。素註，針三分，銅人灸三壯，針六分，留十呼。主嘔逆洞泄，遺溺癃閉，消渴嗜飲，善怒，四肢滿，轉筋，胸□痛，小腹腫，欬逆嘔血，莖中痛腰，疼不可俯仰，腹中脹，小腸氣，肝心痛，色蒼蒼如死狀，終日不得息，口喎癲疾，短氣，四肢逆冷，嗌乾煩渴，瞑不欲視，目中淚出，太息，便溺難，七疝寒疝，中風，肝積肥氣，發痎瘧，婦人小腹腫，面塵脫色，經血過多不止，崩中，小兒急驚風。
