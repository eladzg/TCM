  name_pinyin: Hégǔ
  name_zh: 合谷
  name_en: Union Valley
  location: On the back of the hand, beside the radial aspect of the midpoint of the second metacarpal bone.
  actions: Releases exterior patterns; disperses wind; regulates the face and sensory openings; moves qi and relieves pain.
  indications: Headache; toothache; facial pain; nasal obstruction; sore throat.; Fever with chills; constipation; menstrual pain; delayed labour under specialist care.
  needling_notes: 'depth: 0.5–1 cun perpendicular; moxibustion: Applicable, but avoid during pregnancy unless used by a suitably qualified clinician for a specific obstetric purpose.'
  cautions: 'Pregnancy: traditionally avoided except for a specific obstetric indication under qualified clinical care; current evidence does not establish that LI-4 reliably induces labour or miscarriage.'
  classical: 合谷（一名虎口）手大指次指歧骨間陷中，手陽明大腸脈所過，為原，虛實皆拔之，銅入針三分，留六呼，灸三壯。主傷寒大渴，脈浮在表，發熱惡寒，頭痛脊強，無汗，寒熱瘧，鼻□不止，熱病汗不出，目視不明，生白翳，頭痛下齒齟，耳聾，喉痺，面腫，唇吻不收，瘖不能言，口噤不開，偏風，風□，痂疥，偏正頭痛，腰脊內引痛。小兒單乳鷘，按合谷，婦人妊娠，可瀉不可補，補即墮胎。詳見足太陰脾經，三陰交下。
