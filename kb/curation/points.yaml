  classical: 下廉（一名下巨虛）上廉下三寸，兩筋骨鏬中，蹲地舉足取之，銅人針八分，灸三壯，素註針三壯，素註針三分，明堂針六分，得氣即瀉，甲乙灸日七七壯。主小腸氣不足，面灰顏色，偏風腿痿，足不履地，熱風冷痺不遂，風濕痺，喉痺，腳氣不足，沉重，唇乾，涎出不覺，不得出汗，毛髮焦，內脫，傷寒，胃中熱，不嗜食，泄膿血，胸□小腹控睾而痛，時窘之後，當耳前熱。若寒甚，若獨肩上熱甚，及小指次指間熱痛，暴驚狂，言語非常，女子乳癰，足跗不收，跟痛。
