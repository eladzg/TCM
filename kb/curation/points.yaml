  classical: 肩□（一名中肩井一名偏肩）膊骨頭肩端上，兩骨罅間陷者宛宛中，舉臂取之，有空，手陽明陽蹻之會。銅人灸七壯，至二七壯。以差為度，若灸偏風，灸七七壯。不宜多，恐手臂細，若風病，筋骨無力，灸不差，灸不畏，細刺即泄，肩臂熱氣，明堂針八分，留三呼，瀉五吸，灸不及針。以平手取其穴，灸七壯，增至二七壯。素註，針一寸，灸五壯。又云：針六分，留六呼。主中風手足不隨，偏風，風瘓，風痿，風病半耳不遂，熱風，肩中熱，頭不可回顧，肩臂疼痛臂無力，手不能回頭，攣急，風熱癮□，顏色枯焦，勞氣泄精，傷寒熱不已，四肢熱，諸癭氣。唐魯州刺史庫狄嶔，風痺不能挽弓，甌權針肩□，針進即可射。（□音魚）（瘓音湍上聲）
