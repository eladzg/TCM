  classical: 少海（一名曲節）肘內廉節後，大骨外，去肘端五分，屈肘向頭得之，手少陰心脈所入為合水。銅人針三分，灸三壯。甄權云：不宜灸，針五分，甲乙針二分，留三呼，瀉五吸，宜灸。素註，灸五壯。資生云：數說不同，要之非大急不灸。主寒熱齒齟痛，目眩發狂，嘔吐涎沫，項不得回顧，肘攣腋□下痛，四肢不得舉，齒，寒風頭痛，氣逆噫噦，瘰□心疼，手顫健忘。
