# Interview feature lexicon (DRAFT, awaiting clinician review).
#
# Each feature is one yes/no finding the interview can collect. It links to WHO 2022 patterns
# by English text match (`en`, regular expressions, case-insensitive) against the pattern's
# presentation (symptoms), tongue or pulse text. tools/interview/build_interview.py derives the
# pattern-feature links from these patterns; every derived link gets the same placeholder weight
# (see `defaults` below) until the clinician sets real weights.
#
#   id        FT.<NAME> for symptoms, TG.<NAME> tongue, PL.<NAME> pulse
#   group     interview section (order of the screening phase follows `groups`)
#   q_he      the question shown to the patient (symptoms only; tongue/pulse are entered by the clinician)
#   label_he  short label for the clinician report
#   syn_he    Hebrew words that mark the finding in the patient's own free text (substring match)
#   en        regexes matched against the WHO text; a match preceded by "absence of", "no", "without"
#             or "lack of" is ignored, so negative findings need their own feature
#   tags      eight-principle leanings used only to summarise the picture (heat, cold, def, excess,
#             exterior, interior, damp, dry)
#   screen    asked in the opening screening phase for every patient
#   sex       F or M: asked only for that sex

defaults:
  weight: 1.0            # PLACEHOLDER: uniform weight for every derived link, to be calibrated by the clinician
  denied_penalty: 0.5    # PLACEHOLDER: how much a finding the patient denies counts against a pattern

groups:
  cold_heat: חום וקור
  sweat: הזעה
  thirst_taste: צמא וטעם בפה
  digestion: תיאבון ועיכול
  stool: יציאות
  urine: שתן
  energy: אנרגיה ונשימה
  sleep_mind: שינה ורגש
  head: ראש וחושים
  chest: חזה וריאות
  pain: כאב ושלד-שריר
  skin: עור
  gyn: מחזור ופוריות
  male: פוריות גבר
  tongue: לשון (מטפל)
  pulse: דופק (מטפל)

features:
# --- cold and heat ---
- {id: FT.AVERSION_COLD, group: cold_heat, screen: true, tags: [cold],
   q_he: "האם קר לך יותר מלאנשים אחרים, או שקשה לך להתחמם?",
   label_he: "רגישות לקור / צמרמורות",
   syn_he: ["קר לי", "קפוא", "צמרמורת", "צמרמורות", "רגיש לקור", "רגישה לקור", "מתחמם", "מתחממת"],
   en: ['aversion to (wind[ /-]?)?cold', 'cold intolerance', 'intolerance (of|to) cold', '\bchills\b', 'aversion to wind']}
- {id: FT.COLD_LIMBS, group: cold_heat, tags: [cold, def],
   q_he: "האם הידיים או הרגליים שלך קרות בדרך כלל?",
