  classical: 魚際大指本節後內側，白內際陷中。又云：散脈中，肺脈所溜為榮火，針二分，留二呼，禁灸。主酒病，惡風寒，虛熱，舌上黃，身熱頭痛，咳嗽噦，傷寒，汗不出，痺走胸背，痛不得息，目眩心煩，少氣腹痛，不下食，肘攣肢滿，喉中乾燥，寒慄鼓頷，欬引尻痛，溺出，嘔血，心痺悲恐，乳癰。東垣曰：胃氣下溜，五臟氣亂，皆在於肺者，取之手太陰魚際，足少陰俞。
