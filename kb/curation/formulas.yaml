  indications: '傷寒論 條12：太陽中巳風，陽浮而陰弱。陽浮者，熱自發；陰弱者，汗自出。嗇嗇惡寒，淅淅惡風，翕翕發熱，鼻鳴乾嘔者，桂枝湯主之。

    傷寒論 條13：太陽病，頭痛發熱，汗出惡風，桂枝湯主之。

    傷寒論 條15：太陽病，下之後，其氣上沖者，可與桂枝湯，方用前法，若不上沖者，不得與之。

    傷寒論 條19：凡服桂枝湯吐者，其後必吐膿血也。

    傷寒論 條24：太陽病，初服桂枝湯，反煩不解者，先刺風池、風府，卻與桂枝湯則愈。

    傷寒論 條25：取桂枝湯，大汗出，脈洪大者，與桂枝湯，如前法，若形似瘧，一日再發者，汗出必解，宜桂枝二麻黃一湯。

    傷寒論 條42：太陽病，外證未解，脈浮弱者，當以汗解，宜桂枝湯。

    傷寒論 條44：太陽病，外證未解，不可下也，下之為逆。欲解外者，宜桂枝湯。

    傷寒論 條45：太陽病，先發汗，不解，而復下之，脈浮者不愈，浮為在外，而反下之，故令不愈。今脈浮，故知在外，當須解外則愈，宜桂枝湯。

    傷寒論 條54：病人藏無他病，時發熱、自汗出而不愈者，此衛氣不和也，先其時發汗則愈，宜桂枝湯。

    傷寒論 條56：傷寒，不大便六七日，頭痛有熱者，與承氣湯，其小便清者，知不在里，仍在表也，當鬚髮汗；若頭痛者，必衄，宜桂枝湯。

    傷寒論 條57：傷寒發汗，已解。半日許復煩，脈浮數者，可更發汗，宜桂枝湯。

    傷寒論 條91：傷寒，醫下之，續得下利清谷不止，身疼痛者，急當救里。後身疼痛，清便自調者，急當救表。救里，宜四逆湯；救表，宜桂枝湯。

    傷寒論 條95：太陽病，發熱汗出者，此為榮弱衛強，故使汗出，欲救邪風者，宜桂枝湯。

    傷寒論 條164：傷寒大下後，複發汗，心下痞，惡寒者，表未解也，不可攻痞，當先解表，表解乃可攻痞。解表，宜桂枝湯，攻痞，宜大黃黃連瀉心湯。

    傷寒論 條234：陽明病，脈遲，汗出多，極惡寒者，表未解也，可發汗，宜桂枝湯。

    傷寒論 條240：病人煩熱，汗出則解，又如癥狀，日晡所發熱者，屬陽明也。脈實者，宜下之；脈浮虛者，宜發汗。下之，與大承氣湯，發汗，宜桂枝湯。

    傷寒論 條276：太陰病，脈浮者，可發汗，宜桂枝湯。

    傷寒論 條372：下利腹脹滿，身體疼痛者，先溫其里，乃攻其表。溫里，宜四逆湯；攻表，宜桂枝湯。

    傷寒論 條387：吐利止而身痛不休者，當消息和解其外，宜桂枝湯小和之。'
