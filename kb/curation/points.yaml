  classical: 三里膝下三寸，胻骨外廉，大筋內宛宛中，兩筋內分間，舉足取之，極重按之，則跗上動脈止矣，足陽明胃脈所入，為合土。素註，刺一寸，灸三壯，銅人灸三壯，針五分，明堂針八分，留十呼，瀉七吸，日灸七壯，止百壯，十金灸五百壯，少亦一二百壯。主胃中寒，心腹脹滿，腸鳴，臟氣虛憊，真氣不足，腹痛食不下，大便不通，心悶不已，卒心痛，腹有逆氣上攻，腰痛不得俛仰，小腸氣，水氣，蠱毒，鬼擊□癖，四肢滿，膝胻痠痛，目不明，產婦血暈，秦承祖云：諸病皆治。華陀云：主五勞嬴瘦，七傷虛乏，胸中瘀血，乳癰。千金翼云：主腹中寒脹滿，腸中雷鳴，氣上沖胸，喘不能久立腹痛，胸腹中瘀血，小腸脹，皮腫，陰氣不足小腹堅，傷寒熱不已，熱病汗不出，喜嘔口苦，壯熱身反折，口噤，鼓含腫痛，不可回顧，口□，乳腫，喉痺不能言，胃氣不足，久泄利，食不化，□下支滿，不能久立，膝痿寒熱，中消穀苦饑，腹熱，身煩狂言，乳癰，喜噫，惡聞食臭，狂歌妄笑，恐怒大罵，霍亂遺尿，失氣，陽厥，悽悽惡寒頭眩，小便不利，喜□，腳氣。外臺秘要云：人年三十已上，若不灸三里，令人氣上沖目。東垣曰：飲食失節，及勞役形質，陰火乘於坤土之中，致穀氣，榮氣，清氣，胃氣，元氣不得上升，滋於六腑之陽氣，是五陽之氣，先絕於外，外者天也。下流入於坤土陰火之中，皆由喜怒悲憂恐，為五賊所傷，而後胃氣不行，勞役飲食不節繼之，則元氣乃傷，當於三里穴中推而揚之，以伸元氣。又曰：氣在於腸胃者，取之足太陰陽明，不下者，取之三里。又曰：氣逆霍亂者，取三里，氣下乃止，不下復治。又曰：胃脘當心而痛，上支兩□，膈噎不通，飲食不下，取三里以補之。又曰：六淫客邪，及上熱下寒，筋骨皮肉血脈之病，針取於胃之谷，（三里穴）大危。又曰：有人年少氣弱，常於三里氣海灸之，節次約五七十壯，至年老熱厥頭痛。雖大寒，猶喜風寒，痛愈，惡煖處及煙火，皆灸之過也。
