  term_zh: 趺阳脉
  kind: pulse
  definition: A pulse located at the anterior tibial artery of the dorsum of the foot. It is also known as surging yang (Chongyang) pulse. It is used to indicate the sufficiency of the qi and blood of spleen and stomach.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 919 (趺阳脉), p. 91
- manifestation_id: MAN.GOU_MAI
  term_en: Hooked pulse
  term_zh: 钩脉
  kind: pulse
  definition: A pulse that feels firm, surging and large. It comes powerfully and fades away slowly. It is normal in summer.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 920 (钩脉), p. 91
- manifestation_id: MAN.LI_JING_MAI
  term_en: Abnormal frequency pulse
  term_zh: 离经脉
  kind: pulse
