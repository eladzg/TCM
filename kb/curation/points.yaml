  classical: 然谷（一名龍淵）足內踝前起大骨下陷中。一云：內踝前，在下一寸，別於足太陰之□，足少陰腎脈所溜，為榮。，銅人灸三壯，針三分，留五呼，不宜見血，令人立飢欲食，刺足下布絡中脈，血不出為腫。主咽內腫，不能內唾，時不能出唾，心恐懼，如人將捕，涎出喘呼少氣，足跗踵，不得履地，寒疝小腹脹，上搶胸□，欬唾血，喉痺，淋瀝白濁，胻痠不能久立，足一寒一熱，舌縱煩滿，消渴自汗，盜汗出，痿厥，洞泄，心痛如錐刺，墜墮惡血，留內腹中，男子精泄，婦人無子，陰挺出，月事不調，陰痿，初生小兒，臍風口噤。
