  classical: 水溝（一名人中）鼻柱下溝中央，近鼻孔陷中，督脈手足陽明之會。素註針三分，留六呼，灸三壯。銅人針四分，留五呼，得氣即瀉，灸不及針，日灸三壯，明堂日灸三壯，至二百壯，下經灸五壯。主消渴，飲水無度，水氣遍身腫，失笑無時，癲癇，語不識尊卑，乍哭乍喜，中風口噤，牙關不開，面腫唇動，狀如蟲行，卒中惡，鬼擊，喘渴，目不可視，黃疽，馬黃，瘟疫，通身黃，口喎□，灸不及針，艾炷小雀糞大水，面腫針此一穴，出水盡，即愈。
