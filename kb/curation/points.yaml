  classical: 京骨足外側大骨下，赤白肉際陷中，按而得之，小指本節後大骨，名京骨。其穴在骨下，足太陽脈所過為原，膀胱虛實皆拔之。銅人針三分，留七呼，灸七壯，明堂灸五壯。素註，三壯。主頭痛如破，腰痛不可屈伸，身後側痛，目內眥赤爛白翳，俠內眥反白，目眩，發瘧寒熱，喜驚，不飲食，筋攣，足胻髀樞痛，頸項強，腰背不可俯仰，傴僂鼻□不止，心痛目眩。
