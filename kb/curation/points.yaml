  classical: 石門（一名利機一名精露一名丹田一名命門）臍下二寸，三焦募也。銅人灸二七壯，止一百壯，甲乙針八分，留三呼，得氣即瀉，千金針五分，下經灸七壯。素註針六分，留七呼，婦人禁針禁灸，犯之絕子。主傷寒小便不利，泄利不禁，小腹絞痛，陰囊入小腹，賁豚搶心，腹痛堅硬，卒疝繞臍，氣淋，血淋，小便黃，嘔，吐，血不食穀，穀不化，水腫水氣行皮膚，小腸敦敦然氣滿，婦人因產惡露不止，結成塊崩中下。
