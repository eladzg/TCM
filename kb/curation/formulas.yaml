    quote: 治傷寒中风少陽證，往来寒熱，胸胁痞满，默默不欲食，心烦喜呕；或腹中痛，或胁下痛，或渴，或咳，或利，或悸，小便不利，口苦耳聋，脈弦；或汗後余熱不解；及春月時嗽，疟发寒熱，妇人傷寒熱入血室。
  indications: '傷寒論 條37：太陽病，十日已去，脈浮細而嗜卧者，外已解也。設胸滿脅痛者，與小柴胡湯，脈但浮者，與麻黃湯。

    傷寒論 條96：傷寒五六日，中風，往來寒熱，胸脅苦滿，嘿嘿不欲飲食，心煩喜嘔，或胸中煩而不嘔，或渴，或腹中痛，或脅下痞硬，或心下悸、小便不利，或不渴、身有微熱，或咳者，小柴胡湯主之。

    傷寒論 條97：血弱氣盡，腠理開，邪氣因入，與正氣相搏，結於脅下。正邪分爭，往來寒熱，休作有時，嘿嘿不欲飲食，藏府相連，其痛必下，邪高痛下，故使嘔也，小柴胡湯主之。服柴胡湯已，渴者屬陽明，以法治之。

    傷寒論 條99：傷寒四五日，身熱惡風，頸項強，脅下滿，手足溫而渴者，小柴胡湯主之。

    傷寒論 條100：傷寒，陽脈澀，陰脈弦，法當腹中急痛，先與小建中湯，不差者，小柴胡湯主之。

    傷寒論 條103：太陽病，過經十餘日，反二三下之，後四五日，柴胡證仍在者，先與小柴胡湯；嘔不止，心下急，鬱郁微煩者，為未解也，與大柴胡湯下之則愈。

    傷寒論 條104：傷寒十三日，不解，胸脅滿而嘔，日晡所發潮熱，已而微利，此本柴胡證，下之以不得利，今反利者，知醫以丸藥下之，此非其治也。潮熱者，實也。先宜服小柴胡湯以解外，後以柴胡加芒硝湯主之。

    傷寒論 條144：婦人中風七八日，續得寒熱，發作有時，經水適斷者，此為熱入血室。其血必結，故使如瘧狀，發作有時，小柴胡湯主之。

    傷寒論 條148：傷寒五六日，頭汗出，微惡寒，手足冷，心下滿，口不欲食，大便硬，脈細者，此為陽微結，必有表，復有裏也。脈沉，亦在裏也。汗出，為陽微。僅令純陰結，不得復有外證，悉入在裏，此為半在裏半在外也。脈雖沉緊，不得為少陰病。所以然者，陰不得有汗，今頭汗出，故知非少陰也。可與小柴胡湯。設不了了者，得屎而解。

    傷寒論 條229：陽明病，發潮熱，大便溏，小便自可，胸脅滿不去者，與小柴胡湯。

    傷寒論 條230：陽明病，脅下硬滿，不大便而嘔，舌上白胎者，可與小柴胡湯。上焦得通，津液得下，胃氣因和，身濈然汗出而解。

    傷寒論 條231：陽明中風，脈弦浮大，而短氣，腹都滿，脅下及心痛，久按之氣不通，鼻乾，不得汗，嗜卧，一身及目悉黃，小便難，有潮熱，時時噦，耳前後腫。刺之小差，外不解。病過十日，脈續浮者，與小柴胡湯。

    傷寒論 條266：本太陽病不解，轉入少陽者，脅下硬滿，乾嘔不能食，往來寒熱。尚未吐下，脈沉緊者，與小柴胡湯。

    傷寒論 條379：嘔而發熱者，小柴胡湯主之。

    傷寒論 條394：傷寒差以後，更發熱，小柴胡湯主之。脈浮者，以汗解之；脈沉實者，以下解之。

    醫方集解 和解之劑第六·小柴胡汤：治傷寒中风少陽證，往来寒熱，胸胁痞满，默默不欲食，心烦喜呕；或腹中痛，或胁下痛，或渴，或咳，或利，或悸，小便不利，口苦耳聋，脈弦；或汗後余熱不解；及春月時嗽，疟发寒熱，妇人傷寒熱入血室。'
