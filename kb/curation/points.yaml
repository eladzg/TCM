  name_pinyin: Jiānyú
  name_zh: 肩髃
  name_en: Shoulder Bone
  location: At the shoulder, in the deeper anterior hollow formed between the lateral acromion and the greater tubercle when the arm is abducted.
  actions: Benefits the shoulder joint; disperses wind-damp obstruction; restores movement along the arm channel.
  indications: Shoulder pain; restricted abduction; weakness of the arm; post-stroke upper-limb impairment.; Numbness of the arm; localized shoulder swelling; itchy skin eruptions in traditional pattern treatment.
