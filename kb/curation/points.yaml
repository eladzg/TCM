  classical: 關元臍下三寸，小腸之募，足三陰任脈之會，下紀者，關元也。素註針一寸二分，留十呼，灸七壯。又云：針二寸。銅人針八分，留三呼，瀉五吸，灸百壯，止三百壯，明堂娠婦禁針，若針而落胎，胎多不出，針外崑崙立出。主積冷虛乏，臍下絞痛，流入陰中，發作無時，冷氣結塊痛，寒氣入腹痛，失精白濁，溺血七疝，風眩頭痛，轉脬，閉塞，小便不通，黃赤勞熱，石淋五淋，泄利，賁豚搶心，臍下結血狀如覆杯，婦人帶下，月經不通，絕嗣不生，胞門閉塞，崩漏下血，產後惡露不止。
