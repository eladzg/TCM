  needling_notes: 'depth: 1.0-1.5 cun perpendicular only after the bladder is emptied and anatomy is assessed; moxibustion: Applicable outside pregnancy at CV-3; abdominal moxibustion is contraindicated during pregnancy'
  cautions: CV-3 is a lower-abdominal point traditionally avoided before 37 weeks of pregnancy; deep insertion can also penetrate a full bladder. Evidence reviews have not shown that the point itself causes adverse pregnancy outcomes, so use requires individualized obstetric risk assessment rather than routine treatment.
  classical: 中極（一名玉泉一名氣原）關元下一寸臍下四寸，膀胱之募，足三陰任脈之會。銅人針八分，留十呼，得氣即瀉，灸百壯，至三百壯止，明堂灸不及針，日三七壯，下經灸五壯。主冷氣積聚，時上衝心，腹中熱，臍下結塊，賁豚搶心，陰汗水腫，陽氣虛憊，小便頻數，失精絕子，痛瘕，婦人產後惡露不行，胎衣不下，月事不調，血結成塊，子門腫痛不端，小腹苦寒陰癢，而熱陰痛，恍惚尸厥，飢不能食，臨經行房，羸瘦寒熱，轉脬不得尿，婦人斷緒，四度針，即有子。（脬音拋）
