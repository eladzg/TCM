  channel_id: CH.LI
  name_pinyin: Jùgǔ
  name_zh: 巨骨
  name_en: Great Bone
  location: On top of the shoulder, in the depression between the acromial end of the clavicle and the spine of the scapula.
  actions: Opens the shoulder channel; relieves pain and stiffness; supports movement of the arm.
  indications: Top-of-shoulder pain; limited shoulder movement; upper-arm weakness; localized shoulder swelling.; Neck stiffness; pain extending toward the scapula; reduced ability to raise the arm.
  needling_notes: 'depth: 0.5–0.7 cun perpendicular; moxibustion: Applicable with standard burn precautions.'
