  classical: 上七味，以水一斗二升，煮取六升，去滓，再煎取三升，溫服一升，日三服。若胸中煩而不嘔者，去半夏、人參，加栝蔞實一枚；若渴者，去半夏，加人參合前成四兩半、栝蔞根四兩，若腹中痛者，去黃芩，加芍藥三兩；若脅下痞硬者，去大棗，加牡蠣四兩；若心下悸、小便不利者，去黃芩，加茯苓四兩；若不渴、外有微熱者，去人參，加桂枝三兩，溫服微汗愈；若咳者，去人參、大棗、生薑，加五味子半升、乾薑二兩。
