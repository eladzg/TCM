  indications: '傷寒論 條35：太陽病，頭痛發熱，身疼腰痛，骨節疼痛，惡風無汗而喘者，麻黃湯主之。

    傷寒論 條36：太陽與陽明合病，喘而胸滿者，不可下，宜麻黃湯。

    傷寒論 條37：太陽病，十日已去，脈浮細而嗜卧者，外已解也。設胸滿脅痛者，與小柴胡湯，脈但浮者，與麻黃湯。

    傷寒論 條46：太陽病，脈浮緊，無汗，發熱，身疼痛，八九日不解，表證仍在，此當發其汗。到藥已微除，其人發煩，目瞑，劇者必衄，衄乃解。所以然者，陽氣重故也。麻黃湯主之。

    傷寒論 條51：脈浮者，病在表，可發汗，宜麻黃湯。

    傷寒論 條52：脈浮而數者，可發汗，宜麻黃湯。

    傷寒論 條55：傷寒，脈浮緊，不發汗，因致衄者，麻黃湯主之。

    傷寒論 條232：脈但浮，無餘證者，與麻黃湯；若不盡，腹滿加噦著，不治。

    傷寒論 條235：陽明病，脈浮，無汗而喘者，發汗則愈，宜麻黃湯。'
