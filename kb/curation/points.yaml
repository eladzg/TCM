- point_id: BL1
  channel_id: CH.BL
  name_pinyin: Jīngmíng
  name_zh: 睛明
  name_en: Bright Eyes
  location: At the medial orbit, in the hollow just above and toward the nose from the inner corner of the eye.
  actions: Traditionally clears wind and heat and supports visual function.
  indications: Reference uses include red or painful eyes, blurred vision, excessive tearing, and night blindness.; Secondary uses include itching around the eye and difficulty opening the eyelids.
  needling_notes: 'depth: 0.3-0.7 cun slowly along the medial orbital wall; specialist-only technique without vigorous manipulation; moxibustion: Contraindicated at this point'
  cautions: The point lies beside the eyeball. WHO specifically identifies BL-1 as requiring special skill, and ophthalmology reports document hemorrhage, globe injury, and lasting visual harm after periocular needling.
  classical: 睛明（一名淚孔）目內眥，明堂云：內眥頭外一寸宛宛中，手足太陽，足陽明陰蹻陽蹻五脈之會。針一分半，留三呼，雀目者，可灸留針，然後速出針。主目□□遠視不明，惡風淚出，憎寒痛，目眩，內眥赤痛，□□無見，眥癢活膚白翳，大眥攀睛，努肉侵睛，雀目瞳子生瘴，小兒疳眼，大人氣眼冷淚。按東垣曰：刺太陽陽明出血，則目愈明。蓋此經多血少氣，故目翳與赤痛。從內眥起者，刺睛明攢竹，以宣泄太陽之熱，然睛明刺一分半，攢竹刺一分三分，為適淺深之宜，今翳家刺攢竹，臥針直抵睛明，不補不瀉，而又久留針，非古人意也。
