- point_id: CV22
  channel_id: CH.CV
  name_pinyin: Tiāntū
  name_zh: 天突
  name_en: Celestial Prominence
  location: At the front of the neck, in the center of the suprasternal fossa on the anterior midline.
  actions: Traditionally descends Lung qi, transforms phlegm, opens the throat, and eases wheezing.
  indications: Reference uses include cough, wheezing, sore throat, sudden voice loss, and difficulty swallowing.; Secondary uses include goiter patterns, hiccup, and chest fullness.
  needling_notes: 'depth: Specialist-only; depth and direction must be selected from individual suprasternal, airway, vascular, and thoracic anatomy; moxibustion: Not established in checked safety sources for this vulnerable anterior neck point'
  cautions: CV-22 is directly in front of the trachea and close to major vessels and upper thoracic structures. WHO identifies it as potentially dangerous; no procedural direction is provided here because specialist anatomy and supervision are required.
  classical: 天突（一名天瞿）在頸結喉下一寸宛宛中，陰維任脈之會。銅人灸五分，留三呼，得氣即瀉，灸亦得，不及針，若下針，當直下不低手，即五臟之氣，傷人短壽，明堂灸五壯，針一分。素註針一寸，留七呼，灸三壯。主面皮熱，上氣欬逆，氣暴喘，咽腫咽冷，聲破，喉中生瘡，喉猜猜喀膿血，瘖不能言，身寒熱頸腫，哮喘。喉中翕翕如水雞聲，胸中氣梗梗，俠舌縫青脈舌下急，心與背相控而痛，五噎黃疸，醋心多睡，嘔吐，癭瘤。許氏曰：此穴一針四效。凡下針後良久，先脾磨食，覺針動為一效，次針破病根，腹中作聲為二效，次覺流入膀胱為三效，後覺氣流行，入腰後腎堂中為四效矣！
