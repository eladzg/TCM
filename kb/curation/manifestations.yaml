  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 896 (细脉), p. 89
- manifestation_id: MAN.SAN_MAI
  term_en: Scattered pulse
  term_zh: 散脉
  kind: pulse
  definition: A pulse that feels superficial without root. With light pressure, it is irregularly and chaotic. With heavy pressure, it is impalpable. It indicates critical conditions with dispersion of Yuan- primordial qi.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 897 (散脉), p. 89
- manifestation_id: MAN.XU_MAI
  term_en: Deficient pulse
  term_zh: 虚脉
  kind: pulse
  definition: A pulse that is weak at all three regions, with emptiness feeling when pressed with force. It indicates a deficiency pattern. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 898 (虚脉), p. 89
- manifestation_id: MAN.SHI_MAI
  term_en: Excess pulse
  term_zh: 实脉
  kind: pulse
  definition: A pulse that is forceful at all three regions using different pressure. It indicates an excess pattern.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 899 (实脉), p. 89
- manifestation_id: MAN.HUA_MAI
  term_en: Slippery pulse
  term_zh: 滑脉
  kind: pulse
  definition: A pulse that feels smooth like pearls rolling on a dish. Beats come and go fluently and smoothly, feeling slick to the fingers. It indicates phlegm- fluid retention, indigestion and excess heat. Physiologically, it can be considered as a normal pulse. It can also be seen in healthy people or women during pregnancy, indicating abundant and harmonious qi and blood.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 900 (滑脉), p. 89
- manifestation_id: MAN.SE_MAI
  term_en: Hesitant pulse
  term_zh: 涩脉
  kind: pulse
  definition: A pulse that feels stagnant and obstructive, like a knife scraping bamboo. It indicates consumption of essence, blood/fluids insufficiency, or qi stagnation and blood stasis.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 901 (涩脉), p. 89
- manifestation_id: MAN.ZHANG_MAI
  term_en: Long pulse
  term_zh: 长脉
  kind: pulse
  definition: A pulse that can be felt beyond the Cun, Guan and Chi positions. It is straight from head to tail. It is straight and long like a pole. It indicates yang excess with internal heat.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 902 (长脉), p. 89
- manifestation_id: MAN.DUAN_MAI
  term_en: Short pulse
  term_zh: 短脉
  kind: pulse
  definition: A pulse that cannot reach its location or range. It can be felt most clearly at the Guan position, more indistinct at the Cun and the Chi positions. A short, forceful pulse indicates qi stagnation; whereas a short, weak pulse indicates qi deficiency.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 903 (短脉), p. 89
- manifestation_id: MAN.XIAN_MAI
  term_en: Wiry pulse
  term_zh: 弦脉
  kind: pulse
  definition: A pulse that feels straight, long and tense, like the feeling of pressing a tight string of a musical instrument. It indicates liver/gallbladder problems, pain, wind, or phlegm-fluid retention.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 904 (弦脉), p. 89
- manifestation_id: MAN.KOU_MAI
  term_en: Hollow pulse
  term_zh: 芤脉
  kind: pulse
  definition: A pulse that feels superficial, large but empty in the centre, like a scallion (spring onion) stalk. It could be due to a sudden loss of blood and/or fluid causing the emptiness, resulting in severe yin deficiency and subsequent massive dispersion of yang.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 905 (芤脉), p. 89
- manifestation_id: MAN.JIN_MAI
  term_en: Tight pulse
  term_zh: 紧脉
  kind: pulse
  definition: A pulse that feels like pulling a twisted rope. It indicates a cold pattern, pain pattern or indigestion.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 906 (紧脉), p. 89
- manifestation_id: MAN.HUAN_MAI
