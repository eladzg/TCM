  term_en: Soft pulse
  term_zh: 濡脉
  kind: pulse
  definition: A pulse that is superficial, thready and can be felt with light pressure but indistinct upon heavy pressure. It indicates loss of yin blood or dampness.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 911 (濡脉), p. 91
