  classical: 上五味，咀三味，以水七升，微火煮取三升，去滓，適寒溫，服一升。服已須臾，啜熱稀粥一升餘，以助藥力。溫覆令一時許，遍身漐漐微似有汗者益佳，不可令如水流漓，病必不除。若一服汗出病差，停後服，不必盡劑。若不汗，更取依前法，又不汗，後服小促其間，半日許，令三取盡。若病重者，一日一夜服，周時觀之，服一劑盡，病證猶在者，更作服。若不汗出，乃服至二、三劑。禁生冷、粘滑、肉麵、五辛、酒酪、臭惡等物。
