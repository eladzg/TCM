  indications: '傷寒論 條26：服桂枝湯，大汗出後，大煩渴不解，脈洪大者，白虎加人參湯主之。

    傷寒論 條168：傷寒，若吐、若下後，七八日不解，熱結在里，表裡俱熱，時時惡風，大渴，舌上乾燥而煩，欲飲水數升者，白虎加人參湯主之。

    傷寒論 條169：傷寒，無大熱，口燥渴，心煩，背微惡寒者，白虎加人參湯主之。

    傷寒論 條170：傷寒，脈浮，發熱無汗，其表小解，不可與白虎湯，渴欲飲水無表證者，白虎加人參湯主之。

    傷寒論 條222：若渴欲飲水，口乾舌燥者，白虎加人參湯主之。

    金匱要略 篇2.26：太陽中熱者，暍是也。汗出惡寒，身熱而渴，白虎加人參湯主之。

    金匱要略 篇13.13：渴欲飲水，口乾舌燥者，白虎加人參湯主之。'
