    quote: 治太陽中风，脈浮紧，身疼痛，发熱恶寒，不汗出而烦躁。又治傷寒脈浮數，身不痛但重，乍有轻時
  indications: '傷寒論 條38：太陽中風，脈浮緊，發熱惡寒，身疼痛，不汗出而煩躁者，大青龍湯主之。若脈微弱，汗出惡風者，不可服之，服之則厥逆，筋惕肉目閏，此為逆也。

    醫方集解 发表之劑第二·大青龙汤：治太陽中风，脈浮紧，身疼痛，发熱恶寒，不汗出而烦躁。又治傷寒脈浮數，身不痛但重，乍有轻時'
