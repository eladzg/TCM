    quote: 治太陽病六七日，表證仍在，脈微而沉，反不结胸
  indications: '傷寒論 條124：太陽病六七日，表證仍在，脈微而沉，反不結胸，其人發狂者，以熱在下焦，少腹當硬滿。小便自利者，下血乃愈。所以然者，以太陽隨經，瘀熱在里故也，抵當湯主之。

    傷寒論 條125：太陽病，身黃，脈沉結，少腹硬，小便不利者，為無血也；小便自利，其人如狂者，血證諦也，抵當湯主之。太陽病六七日，表證仍在，脈微而沉，反不結胸，其人發狂者，以熱在下焦，少腹當硬滿。小便自利者，下血乃愈。所以然者，以太陽隨經，瘀熱在里故也，抵當湯主之。

    傷寒論 條237：陽明證，其人喜忘者，必有蓄血。所以然者，本有久瘀血，故令喜忘。屎雖硬，大便反易，其色必黑者，宜抵當湯下之。

    傷寒論 條257：病人無表裡證，發熱七八日，雖脈浮數者，可下之。假令已下，脈數不解，合熱則消谷善飢，至六七日不大便者，有瘀血，宜抵當湯。

    醫方集解 理血之劑第八·抵当汤：治太陽病六七日，表證仍在，脈微而沉，反不结胸'
