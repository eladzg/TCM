  cautions: CV-6 is a lower-abdominal point traditionally avoided before 37 weeks of pregnancy. Deep insertion can enter the peritoneal cavity; use in pregnancy requires a qualified clinician's individualized risk assessment, despite the lack of demonstrated point-specific harm in published reviews.
  classical: 氣海（一名脖胦一名下肓）臍下一寸半宛宛中，男之生氣之海。銅人針八分，得氣即瀉，瀉後宜補之，可灸百壯，明堂灸七壯。主傷寒飲水過多，腹脹腫，氣喘，心下痛，冷病，面赤，臟虛氣憊，真氣不足，一切氣疾久不差，肌體羸瘦，四肢力弱，賁豚七疝，小腸膀胱腎餘，癥瘕結塊，狀如覆杯，腹暴脹，按之不下，臍下冷痛，中惡，脫陽欲死，陰症卵縮，四肢厥冷，大便不通，小便赤，卒心痛，婦人臨經行房，嬴瘦崩中，赤白帶下，月事不調，產後惡露不止，繞臍□痛，閃著腰疼，小兒遺尿，浦江鄭義宗患泄下，昏仆，目上視，溲注汗泄，脈大，此陰虛陽暴絕，得之病後酒色，丹溪為灸氣海漸甦，服人參膏數斤愈。
