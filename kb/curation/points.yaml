  channel_id: CH.KI
  name_pinyin: Fùliū
  name_zh: 复溜
  name_en: Returning Current
  location: On the posteromedial lower leg, immediately anterior to the Achilles tendon and 2 cun above the medial malleolus.
  actions: Strengthens Kidney qi; regulates sweating; promotes fluid movement; supports the lower back.
  indications: Oedema; night sweating; absence of sweating during fever; lumbar weakness.; Diarrhoea; abdominal swelling; numbness or pain of the lower leg.
