  name_en: Bright Light
  location: On the fibular side of the lower leg, anterior to the fibula and 5 B-cun above the lateral malleolus.
  actions: Benefits the eyes; spreads Liver qi; activates the paired Liver-Gallbladder relationship.
  indications: Blurred vision; eye pain or itching; night blindness in traditional references.; Lateral leg pain; breast discomfort; headache.
