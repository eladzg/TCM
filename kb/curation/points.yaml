  channel_id: CH.LR
  name_pinyin: Tàichōng
  name_zh: 太冲
  name_en: Great Surge
  location: On the dorsum of the foot between the first and second metatarsals, in the hollow just distal to their bases and over the dorsalis pedis artery.
  actions: Spreads Liver qi; subdues Liver yang; nourishes Liver blood and yin; clears the head and eyes.
  indications: Headache; dizziness; irritability; menstrual pain; hypochondriac discomfort.; Eye redness; insomnia; digestive upset from constraint; foot pain.
  needling_notes: 'depth: 0.5–0.8 cun perpendicular only after palpating and avoiding the dorsalis pedis artery; moxibustion: Not established in checked point source; direct or scarring moxibustion over a major vessel is avoided.'
  cautions: LV-3 overlies the dorsalis pedis artery, which must be palpated and avoided. WHO also identifies LV-3 as a point that may provoke hypotension or fainting; first-time or vulnerable patients should be treated lying down with gentle stimulation and monitoring.
  classical: 太衝足大指本節後二寸，或云一寸半，內間動脈應手陷中，足厥陰肝脈所注，為俞土。素問女子二七，太衝脈盛，月事以時下，故能有子，又診病人太衝脈有無，可以決死生。銅人針三分，留十呼，灸三壯。主心痛脈弦，馬黃瘟疫，肩腫吻傷，虛勞浮腫，腰引小腹痛，兩丸騫縮，溏泄遺溺，陰痛，面目蒼色，胸□支滿，足寒肝心痛，蒼然如死狀，終日不休息，大便難，便血，小便淋，小腸疝氣痛，疻疝，小便不利，嘔血嘔逆，發寒嗌乾，善渴，肘腫，內踝前痛，淫濼胻痠，腋下馬刀瘍廔，唇腫，女子漏下不止，小兒卒疝。
