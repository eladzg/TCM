  indications: '傷寒論 條208：陽明病，脈遲雖汗出，不惡寒者，其身必重，短氣，腹滿而喘；有潮熱者，此外欲解，可攻里也。手足濈然汗出者，此大便已硬也，大承氣湯主之。若汗多，微發熱惡寒者，外未解也，其熱不潮，未可與承氣湯，若腹大滿不通者，可與小承氣湯微和胃氣，勿令至大泄下。

    傷寒論 條209：陽明病，潮熱，大便微硬者，可與大承氣湯，不硬者，不可與之。若不大便六七，恐有燥屎，欲知之法，少與小承氣湯，湯入腹中，轉矢氣者，此有燥屎也，乃可攻之；若不轉矢氣者，此但初頭硬，後必溏，不可攻之，攻之必脹滿不能食也。欲飲水者，與水則噦。其後發熱者，必大便複復硬而少也，以小承氣湯和之。不轉矢氣者，慎不可攻也。

    傷寒論 條212：傷寒，若吐若下後，不解，不大便五六日，上至十餘日，日晡所發潮熱，不惡寒，獨語如見鬼狀。若劇者，發則不識人，循衣摸床，傷而不安，微喘直視，脈弦者生，澀者死，微者，但發熱譫語者，大承氣湯主之。若一服利，則止後服。

    傷寒論 條215：陽明病，譫語，有潮熱，反不能食者，胃中必有燥屎五六枚也，若能食者，但硬耳，宜大承氣湯下之。

    傷寒論 條220：二陽並病，太陽證罷，但發潮熱，手足漐漐汗出，大便難而譫語者，下之則愈，宜大承氣湯。

    傷寒論 條238：陽明病，下之，心中懊農而煩，胃中有燥屎者，可攻。腹微滿，初頭硬，後必溏，不可攻之。若有燥屎者，宜大承氣湯。

    傷寒論 條240：病人煩熱，汗出則解，又如癥狀，日晡所發熱者，屬陽明也。脈實者，宜下之；脈浮虛者，宜發汗。下之，與大承氣湯，發汗，宜桂枝湯。

    傷寒論 條241：大下後，六七日不大便，煩不解，腹滿痛者，此有燥屎也。所以然者，本有宿食故也。宜大承氣湯。

    傷寒論 條251：得病二三日，脈弱，無太陽柴胡證，煩躁，心下硬，至四五日，雖能食，以小承氣湯少少與微和之，令小安，至六日，與承氣湯一升。若不大便六七日，小便少者，雖不能食，但初頭硬，後必清，未定成硬，攻之必溏。須小便利，屎定硬，乃可攻之。宜大承氣湯。

    傷寒論 條252：傷寒六七日，目中不了了，睛不和，無表裡證，大便難，身微熱者，此為實也。急下之，宜大承氣湯。

    傷寒論 條253：陽明病，發熱汗多者，急下之，宜大承氣湯。

    傷寒論 條254：發汗不解，腹滿痛者，急下之，宜大承氣湯。

    傷寒論 條255：腹滿不減，減不足言，當下之，宜大承氣湯。

    傷寒論 條256：陽明少陽合病，必下利。其脈不負者，為順也。負者，失也，互相剋賊，名為負也。脈滑而數者，有宿食也，當下之，宜大承氣湯。

    傷寒論 條320：少陰病，得之二三日，口燥咽乾者，急下之，宜大承氣湯。

    傷寒論 條321：少陰病，自利清水，色純青，心下必痛，口乾燥者，急下之，宜大承氣湯。

    傷寒論 條322：少陰病，六七日，腹脹不大便者，急下之，宜大承氣湯。

    金匱要略 篇2.13：痙為病。胸滿口噤，臥不著席，腳攣急，必齘齒，可與大承氣湯。

    金匱要略 篇11.13：脾中風者，翕翕發熱，形如醉人，腹中煩重，皮目瞤瞤而短氣。

    金匱要略 篇11.22：問曰：人病有宿食，何以別之？師曰：寸口脈浮而大，按之反澀，尺中亦微而澀，故知有宿食，大承氣湯主之。

    金匱要略 篇11.23：脈數而滑者，實也，此有宿食，下之愈，宜大承氣湯。

    金匱要略 篇11.24：下利不欲食者，有宿食也，當下之，宜大承氣湯。

    金匱要略 篇17.39：下利，三部脈皆平，按之心下堅者，急下之，宜大承氣湯。

    金匱要略 篇17.40：下利脈遲而滑者、實也、利未欲止，急下之，宜大承氣湯。

    金匱要略 篇17.41：下利脈反滑者，當有所去，下乃愈，宜大承氣湯。

    金匱要略 篇17.42：下利已差，至其年月日時復發者，以病不盡故也。當下之，宜大承氣湯。

    金匱要略 篇21.3：病解能食，七八日更發熱者，此為胃實，大承氣湯主之。

    金匱要略 篇21.7：產後七八日，無太陽證，少腹堅痛，此惡露不盡；不大便，煩躁發熱、切脈微實，再倍發熱，日晡時煩躁者，不食，食則譫語，至夜即愈，宜大承氣湯主之。熱在裏，結在膀胱也。'
