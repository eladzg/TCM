  indications: '傷寒論 條76：發汗後，水藥不構入口，為逆，若更發汗，必吐下不止。發汗吐下後，虛煩不得眠，若劇者，必反覆顛倒，心中懊儂，梔子豉湯主之；若少氣者。梔子甘草豉湯主之。若嘔者，梔子生薑豉湯主之。

    傷寒論 條77：發汗，若下之，而煩熱，胸中窒者，梔子豉湯主之。

    傷寒論 條78：傷寒五六日，大下之後，身熱不去，心中結痛者，未欲解也，梔子豉湯主之。

    傷寒論 條221：陽明病，脈浮而緊，咽燥口苦，腹滿而喘，發熱汗出，不惡寒，反惡熱，身重。若發汗則躁，心憒憒反譫語，若加溫針，必怵惕，煩躁不得眠，若下之，則胃中空虛，客氣動膈，心中懊農。舌上胎者。梔子豉湯主之。

    傷寒論 條228：陽明病下之，其外有熱，手足溫，不結胸，心中澳農，飢不能食，但頭汗出者，梔子豉湯主之。

    傷寒論 條375：下利後，更煩，按之心下濡者，為虛煩也，宜梔子豉湯。'
