  classical: 肺俞第三椎下兩旁，相去脊各一寸五分，千金對乳，引繩度之，甄權以搭手，左收右，右取左，當中指末是，正坐取之，甲乙針三分，留七呼，得氣即泄，甄權灸百壯，明堂灸三壯，素問刺中肺，三日死，其動為欬。主癭氣黃疸，勞瘵，口舌乾，勞熱上氣，腰脊強痛，寒熱喘滿，虛煩，傳尸骨蒸，肺痿，咳嗽肉痛，皮癢，嘔吐支滿，不嗜食，狂走，欲自殺，背僂，肺中風偃臥，胸滿短氣，瞀悶汗出，百毒病，食後吐水，小兒龜背。仲景曰：太陽與少陽併病，頭項強痛，或眩冒時如結，胸心下痞硬者，當刺太陽肺俞肝俞。
