  name_pinyin: Liánquán
  name_zh: 廉泉
  name_en: Corner Spring
  location: At the front of the neck, on the anterior midline in the depression above the hyoid bone and above the upper border of the thyroid cartilage.
  actions: Traditionally benefits the tongue and throat, regulates speech, and clears phlegm.
  indications: Reference uses include tongue stiffness, speech difficulty, sore throat, voice loss, and difficulty swallowing.; Secondary uses include excessive salivation, dry mouth, and throat swelling.
  needling_notes: 'depth: Specialist-only, anatomy-dependent needling; a fixed cun range is not presented because vessels and glands in the sublingual space vary by individual; moxibustion: Not established: checked point sources report applicable, caution, and prohibition'
