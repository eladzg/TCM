<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ראיון אינטייק TCM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; a chat for the patient, a worksheet for the clinician, switched by two tabs. */
:root {
  --paper: #f4f6f5;
  --surface: #ffffff;
  --ink: #1d2a28;
  --muted: #5b6b68;
  --line: #d6dfdc;
  --jade: #2b6a5c;
  --jade-soft: #e2efeb;
  --patient: #eef1f8;
  --cinnabar: #b23a2a;
  --cinnabar-soft: #f8e6e2;
  --amber: #8a5a00;
  --amber-soft: #f6ecd6;
  --font-display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a19; --surface: #1c2422; --ink: #e4ebe9; --muted: #9aaba7; --line: #2f3b38;
    --jade: #7cc2b0; --jade-soft: #21332f; --patient: #222a36; --cinnabar: #f08a78; --cinnabar-soft: #3a2320;
    --amber: #e3b866; --amber-soft: #352c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a19; --surface: #1c2422; --ink: #e4ebe9; --muted: #9aaba7; --line: #2f3b38;
  --jade: #7cc2b0; --jade-soft: #21332f; --patient: #222a36; --cinnabar: #f08a78; --cinnabar-soft: #3a2320;
  --amber: #e3b866; --amber-soft: #352c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .92rem; margin: 2px 0 0; }
.draft { display: inline-block; font-size: .75rem; letter-spacing: .04em; color: var(--amber); background: var(--amber-soft); border-radius: 4px; padding: 1px 8px; font-weight: 600; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
nav.tabs button { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--jade); border-bottom-color: var(--jade); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
.msg.sys { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-start-start-radius: 4px; }
.msg.pt { background: var(--patient); justify-self: end; border-start-end-radius: 4px; }
.msg.alert { background: var(--cinnabar-soft); color: var(--cinnabar); border: 1px solid var(--cinnabar); font-weight: 600; justify-self: stretch; max-width: none; }
.msg .meta { display: block; font-size: .78rem; color: var(--muted); margin-top: 4px; }
.understood { display: flex; flex-wrap: wrap; gap: 6px; justify-self: end; max-width: 88%; }
.chip { font-size: .8rem; border-radius: 999px; padding: 2px 10px; background: var(--jade-soft); color: var(--jade); }
.chip.neg { background: var(--surface); color: var(--muted); border: 1px dashed var(--line); text-decoration: line-through; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label.opt { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
label.opt:has(input:checked) { border-color: var(--jade); background: var(--jade-soft); }
input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--jade); background: var(--jade); color: var(--surface); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--jade); }
.btn.no { border-color: var(--muted); background: transparent; color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.answers { display: flex; flex-wrap: wrap; gap: 8px; }
.progress { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.composer { display: grid; gap: 8px; }

/* clinician */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.3rem; margin: 6px 0 0; }
h3 { font-size: 1rem; margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label.opt { font-size: .9rem; padding: 4px 9px; }
.flags { display: grid; gap: 6px; }
.flag { border-radius: 8px; padding: 8px 12px; font-size: .92rem; }
.flag.red { background: var(--cinnabar-soft); color: var(--cinnabar); }
.flag.amber { background: var(--amber-soft); color: var(--amber); }
.flag.info { background: var(--jade-soft); color: var(--ink); }
.flag code { font-family: var(--font-mono); font-size: .78rem; }
.summary { font-size: 1.02rem; }
.ep { display: flex; flex-wrap: wrap; gap: 8px; }
.ep span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: .9rem; }
.dx { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.dx.primary { border-color: var(--jade); }
.dx-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.dx-name { font-weight: 700; font-size: 1.05rem; }
.dx-name .zh { font-weight: 400; color: var(--muted); margin-inline-start: 6px; }
.score { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--jade-soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--jade); }
.ev { margin: 0; padding-inline-start: 18px; font-size: .9rem; }
.ev li { margin: 2px 0; }
.ev .en { color: var(--muted); direction: ltr; unicode-bidi: isolate; font-size: .84rem; }
.ev.contra li { color: var(--cinnabar); }
details summary { cursor: pointer; color: var(--jade); font-size: .9rem; }
.src { direction: ltr; text-align: left; font-size: .85rem; color: var(--muted); background: var(--paper); border-radius: 8px; padding: 8px 10px; }
.id { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
pre.json { direction: ltr; text-align: left; max-height: 360px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: .75rem; }
.empty { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .msg { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .4; } } }
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1>ראיון אינטייק TCM</h1>
      <p class="sub">אב-טיפוס: ראיון מטופל בעברית והצעת תבניות מתוך מאגר WHO 2022. <span class="draft">טיוטה · משקלות זמניים</span></p>
    </div>
    <button class="btn ghost" id="demo" type="button">מילוי מקרה לדוגמה</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-patient" aria-selected="true" type="button">ראיון המטופל</button>
    <button role="tab" id="tab-clin" aria-selected="false" type="button">סיכום למטפל</button>
  </nav>
  <section id="view-patient">
    <div class="chat" id="chat" aria-live="polite"></div>
  </section>
  <section id="view-clin" hidden></section>
</div>
<script src="kb.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
