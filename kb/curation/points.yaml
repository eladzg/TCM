- point_id: SP6
  channel_id: CH.SP
  name_pinyin: Sānyīnjiāo
  name_zh: 三阴交
  name_en: Three Yin Intersection
  location: On the medial leg, immediately posterior to the medial border of the tibia, 3 cun above the prominence of the medial malleolus.
  actions: Strengthens the Spleen; resolves dampness; regulates menstruation and the lower burner; calms the spirit.
  indications: Menstrual irregularity; pelvic discomfort; digestive weakness; urinary difficulty; insomnia.; Medial leg pain; oedema; dizziness associated with blood deficiency.
  needling_notes: 'depth: 1.0–1.5 cun perpendicular; moxibustion: Listed as applicable in the checked moxibustion reference; pregnancy use requires specialist clinical judgment'
  cautions: Traditionally contraindicated during pregnancy because it is used to influence the uterus and labour. Pregnancy evidence is mixed, so this point should not be presented for self-treatment.
  classical: 三陰交內踝上三寸，骨下陷中，足太陰少陰厥陰之會。銅人針三分，灸三壯。主脾胃虛弱，心腹脹滿，不思飲食，痺痛身重，四肢不舉，腹脹腸鳴，溏泄，食不化，癖腹寒，膝內廉痛，小便不利，陰莖痛，足痿不能行，疝氣，小便遺，膽虛，食後吐水，夢遺失精，霍亂手足逆冷，呵欠，頰車蹉開，張口不合，男子陰莖痛，元臟發痛，臍下痛不可忍，小兒客忤，婦人臨經行房，羸瘦癥瘕，漏血不止，月水不止，□娠胎動橫生，產後惡露不行，去血過多，血崩暈，不省人事。如經脈塞閉不通，瀉之立通，經脈虛耗不行者，補之，經脈益盛則通。按宋太子出苑，逢妊婦，診曰女。徐文伯曰：一男一女，太子性急欲視。文伯瀉三陰交，補合谷，胎應針而下，果如文伯之診。後世遂以三陰交合谷為妊婦禁針。然文伯瀉三陰交，補合谷而墮胎。今獨不可補三陰交，瀉合谷而安胎乎！蓋三陰交，腎肝脾三脈之交會，主陰血，血當補，不當瀉，合谷為大腸之原，大腸為肺之腑，主氣當補。文伯瀉三陰交，以補合谷，補合谷，是血衰氣旺也。今補三陰交，瀉合谷，是血旺氣衰矣！故劉元賓亦曰：血衰氣旺，定無妊，血旺氣衰，應有體。
