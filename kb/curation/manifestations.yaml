  term_zh: 促脉
  kind: pulse
  definition: A pulse that arrives as urgent and forceful but irregularly interrupted. It indicates excess heat, stagnation of qi, blood, phlegm-fluid retention or swelling/pain.
  status: draft
  sources:
  - source_id: WHO-ISTTCM-2022
    field: definition
    locator: WGM2 913 (促脉), p. 91
