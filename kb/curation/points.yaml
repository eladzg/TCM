  classical: 尺澤肘中約紋上，動脈中，屈肘橫紋，筋骨鏬陷中，手太陰肺脈所入，為合水，肺實瀉之，針三分，留三呼，灸五壯。主肩臂痛，汗出中風，小便數，善嚏，悲哭，寒熱風痺，臑肘攣，手臂不舉，喉痺上氣，嘔吐口乾，欬嗽唾濁，痎瘧，四肢腹腫，心疼臂痛，短氣，肺膨脹，心煩悶，少氣，勞熱，喘滿，腰脊強痛，小慢驚風。
