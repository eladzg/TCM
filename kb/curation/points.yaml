  classical: 豐隆外踝上八寸，下胻外廉陷中，足陽明絡別走陰，銅人針三分，灸三壯，明堂灸七壯。主厥逆，大小便難，怠惰，腿膝痠，屈伸難，胸痛如刺，腹若刀切痛，風痰痛，風逆，四肢腫，足青，身寒濕，喉痺不能言，登高而歌，棄衣而走，見鬼好笑，氣逆則喉痺卒瘖，實則顛狂，瀉之，虛則足不收脛枯，補之。
