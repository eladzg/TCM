- point_id: ST1
  channel_id: CH.ST
  name_pinyin: Chéngqì
  name_zh: 承泣
  name_en: Tear Container
  location: On the face, directly below the pupil, between the eyeball and the infraorbital margin.
  actions: Dispels wind and heat from the eye region; benefits vision; checks excessive tearing.
  indications: Red, swollen, or painful eyes; excessive tearing; impaired night vision.; Eyelid twitching; facial muscle spasm or weakness.
  needling_notes: 'depth: No insertion in general practice; use a non-insertion technique unless advanced eye-orbit training and an applicable professional standard explicitly permit otherwise; moxibustion: Not recommended'
  cautions: This point is inside the eye orbit. A government safety guideline generally contraindicates insertion here and favors non-insertion techniques because the eyeball and orbital vessels are vulnerable.
  classical: 承泣目下七分，直瞳子陷中，足陽明陽蹻脈任脈之會，銅人灸三壯，禁針。針之令人目鳥色，明堂針四分半，不宜灸，灸後令人目下大如拳，息肉日加如桃，至三十日定不見物。資生云：當不灸不釷。東垣曰：魏邦彥夫人目翳綠色，從下侵上者，自陽明來也。主目冷淚出上觀，瞳子氧，遠視□□，昏夜無見，目□動，與項口相引，口眼喎斜，口不能言，面葉葉牽動。眼赤痛，耳鳴耳聾。（□音純）
