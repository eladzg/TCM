<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ראיון אינטייק TCM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; a chat for the patient, a worksheet for the clinician, switched by two tabs. */
:root {
  --paper: #f4f6f5;
  --surface: #ffffff;
  --ink: #1d2a28;
  --muted: #5b6b68;
  --line: #d6dfdc;
  --jade: #2b6a5c;
  --jade-soft: #e2efeb;
  --patient: #eef1f8;
  --cinnabar: #b23a2a;
  --cinnabar-soft: #f8e6e2;
  --amber: #8a5a00;
  --amber-soft: #f6ecd6;
  --font-display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a19; --surface: #1c2422; --ink: #e4ebe9; --muted: #9aaba7; --line: #2f3b38;
    --jade: #7cc2b0; --jade-soft: #21332f; --patient: #222a36; --cinnabar: #f08a78; --cinnabar-soft: #3a2320;
    --amber: #e3b866; --amber-soft: #352c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a19; --surface: #1c2422; --ink: #e4ebe9; --muted: #9aaba7; --line: #2f3b38;
  --jade: #7cc2b0; --jade-soft: #21332f; --patient: #222a36; --cinnabar: #f08a78; --cinnabar-soft: #3a2320;
  --amber: #e3b866; --amber-soft: #352c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .92rem; margin: 2px 0 0; }
.draft { display: inline-block; font-size: .75rem; letter-spacing: .04em; color: var(--amber); background: var(--amber-soft); border-radius: 4px; padding: 1px 8px; font-weight: 600; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
nav.tabs button { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--jade); border-bottom-color: var(--jade); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
.msg.sys { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-start-start-radius: 4px; }
.msg.pt { background: var(--patient); justify-self: end; border-start-end-radius: 4px; }
.msg.alert { background: var(--cinnabar-soft); color: var(--cinnabar); border: 1px solid var(--cinnabar); font-weight: 600; justify-self: stretch; max-width: none; }
.msg .meta { display: block; font-size: .78rem; color: var(--muted); margin-top: 4px; }
.understood { display: flex; flex-wrap: wrap; gap: 6px; justify-self: end; max-width: 88%; }
.chip { font-size: .8rem; border-radius: 999px; padding: 2px 10px; background: var(--jade-soft); color: var(--jade); }
.chip.neg { background: var(--surface); color: var(--muted); border: 1px dashed var(--line); text-decoration: line-through; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label.opt { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
label.opt:has(input:checked) { border-color: var(--jade); background: var(--jade-soft); }
input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--jade); background: var(--jade); color: var(--surface); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--jade); }
.btn.no { border-color: var(--muted); background: transparent; color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.answers { display: flex; flex-wrap: wrap; gap: 8px; }
.progress { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.composer { display: grid; gap: 8px; }

/* clinician */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.3rem; margin: 6px 0 0; }
h3 { font-size: 1rem; margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label.opt { font-size: .9rem; padding: 4px 9px; }
.flags { display: grid; gap: 6px; }
.flag { border-radius: 8px; padding: 8px 12px; font-size: .92rem; }
.flag.red { background: var(--cinnabar-soft); color: var(--cinnabar); }
.flag.amber { background: var(--amber-soft); color: var(--amber); }
.flag.info { background: var(--jade-soft); color: var(--ink); }
.flag code { font-family: var(--font-mono); font-size: .78rem; }
.summary { font-size: 1.02rem; }
.ep { display: flex; flex-wrap: wrap; gap: 8px; }
.ep span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: .9rem; }
.dx { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.dx.primary { border-color: var(--jade); }
.dx-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.dx-name { font-weight: 700; font-size: 1.05rem; }
.dx-name .zh { font-weight: 400; color: var(--muted); margin-inline-start: 6px; }
.score { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--jade-soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--jade); }
.ev { margin: 0; padding-inline-start: 18px; font-size: .9rem; }
.ev li { margin: 2px 0; }
.ev .en { color: var(--muted); direction: ltr; unicode-bidi: isolate; font-size: .84rem; }
.ev.contra li { color: var(--cinnabar); }
details summary { cursor: pointer; color: var(--jade); font-size: .9rem; }
.src { direction: ltr; text-align: left; font-size: .85rem; color: var(--muted); background: var(--paper); border-radius: 8px; padding: 8px 10px; }
.id { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
pre.json { direction: ltr; text-align: left; max-height: 360px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: .75rem; }
.empty { color: var(--muted); }

/* voice */
.voicebar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--jade); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.voicebar[hidden] { display: none; }
.voice-status { flex: 1; min-width: 10em; font-weight: 600; }
.orb { width: 18px; height: 18px; border-radius: 50%; background: var(--muted); flex: none; transition: transform .12s linear, background-color .2s; }
.orb.listening { background: var(--jade); }
.orb.speaking { background: var(--amber); }
.voice-note { font-size: .85rem; color: var(--muted); margin: 0; }
.mic-help { border-color: var(--cinnabar); margin-bottom: 12px; }
.mic-help h3 { color: var(--cinnabar); }
.mic-help a.btn { text-decoration: none; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .msg { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .4; } } }
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1>ראיון אינטייק TCM</h1>
      <p class="sub">אב-טיפוס: ראיון מטופל בעברית והצעת תבניות מתוך מאגר WHO 2022. <span class="draft">טיוטה · משקלות זמניים</span></p>
    </div>
    <div class="row">
      <button class="btn" id="voice-start" type="button">שיחה קולית</button>
      <button class="btn ghost" id="demo" type="button">מילוי מקרה לדוגמה</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-patient" aria-selected="true" type="button">ראיון המטופל</button>
    <button role="tab" id="tab-clin" aria-selected="false" type="button">סיכום למטפל</button>
  </nav>
  <section id="view-patient">
    <div class="voicebar" id="voicebar" hidden>
      <span class="orb" id="voice-orb" aria-hidden="true"></span>
      <span class="voice-status" id="voice-status" role="status">מתחבר…</span>
      <button class="btn no" id="voice-end" type="button">סיום השיחה</button>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
  </section>
  <section id="view-clin" hidden></section>
</div>

},{"f":"FT.LOOSE_STOOL","ev":"大便溏泄","src":["GB"],"gb_secondary":true},{"f":"FT.CLEAR_URINE","ev":"小便清长","src":["GB"],"gb_secondary":true},{"f":"FT.JOINT_PAIN","ev":"下肢酸楚","src":["GB"],"gb_secondary":true}]},{"id":"SYN.EP.SHANG_HAN_XIA_RE","en":"Upper cold with lower heat pattern","zh":"上寒下热证","py":"shàng hán xià rè zhèng","he":null,"cat":"Patterns according to the eight principles","text":"Characterized by cold retention in the upper body but heat retention in the lower body. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1007 (上寒下热证), p. 105","gb":"2.10.6","gbtext":"久咳痰喘，或胸痹心痛、胃寒痞痛等久病不愈；伴见大便燥结，小便赤涩，足肢红肿疼痛等上寒与下热征象同时并现","status":"draft","links":[{"f":"FT.SOB","ev":"久咳痰喘","src":["GB"]},{"f":"FT.COUGH","ev":"久咳痰喘","src":["GB"]},{"f":"FT.PHLEGM","ev":"久咳痰喘","src":["GB"]},{"f":"FT.CONSTIPATION","ev":"大便燥结","src":["GB"],"gb_secondary":true},{"f":"FT.YELLOW_URINE","ev":"小便赤涩","src":["GB"],"gb_secondary":true}]},{"id":"SYN.EP.BAN_BIAO_BAN_LI","en":"Neither exterior nor interior pattern","zh":"半表半里证","py":"bàn biǎo bàn lǐ zhèng","he":null,"cat":"Patterns according to the eight principles","text":"Characterized by alternating fever and aversion to cold, fullness in the chest and sub-costal area, vexation, vomiting, poor appetite, a bitter mouth, a dry throat and blurred vision. Often occurs when anti-pathogenic qi fights with pathogenic factors between the exterior and interior: exogenous pathogenic factors have not entered the interior or internal pathogenic factors have not reached the exterior.","tongue":"","pulse":"The pulse is wiry.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1008 (半表半里证), p. 105","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.AVERSION_COLD","ev":"Characterized by alternating fever and aversion to cold","src":["WHO"]},{"f":"FT.FEVER","ev":"Characterized by alternating fever and aversion to cold","src":["WHO"]},{"f":"FT.ALTERNATING","ev":"Characterized by alternatin ["GB"],"gb_secondary":true},{"f":"FT.THIRST","ev":"口渴","src":["GB"],"gb_secondary":true},{"f":"FT.CONSTIPATION","ev":"大便秘结","src":["GB"],"gb_secondary":true},{"f":"FT.YELLOW_URINE","ev":"小便黄赤","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.FENG_HAN_BIAO","en":"Wind cold exterior pattern","zh":"风寒表证","py":"fēng hán biǎo zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by severe aversion to cold, fever, absence of sweating, headache, and body aches. Alternatively, nasal obstruction, clear nasal discharge, and cough may be present. Often occurs when wind cold blocks the skin pores.","tongue":"The tongue coating is thin and white.","pulse":"The pulse is superficial and tense.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1020 (风寒表证), p. 107","gb":"3.2.4.1.1","gbtext":"恶寒重、发热轻，无汗，头身疼痛，舌苔白，脉浮或紧，指纹浮红；伴见鼻塞、声重，喷嚏，时流清涕，咳嗽，痰清稀、色白","status":"draft","links":[{"f":"FT.AVERSION_COLD","ev":"Characterized by severe aversion to cold","src":["WHO","GB"],"ev_zh":"恶寒重"},{"f":"FT.FEVER","ev":"fever","src":["WHO","GB"],"ev_zh":"发热轻"},{"f":"FT.NO_SWEAT","ev":"absence of sweating","src":["WHO","GB"],"ev_zh":"无汗"},{"f":"FT.NASAL","ev":"nasal obstruction","src":["WHO","GB"],"ev_zh":"鼻塞","gb_secondary":true},{"f":"FT.COUGH","ev":"and cough may be present","src":["WHO","GB"],"ev_zh":"咳嗽","gb_secondary":true},{"f":"FT.JOINT_PAIN","ev":"and body aches","src":["WHO"]},{"f":"TG.COAT_WHITE","ev":"The tongue coating is thin and white","src":["WHO","GB"],"ev_zh":"舌苔白"},{"f":"TG.COAT_THIN","ev":"The tongue coating is thin and white","src":["WHO"]},{"f":"PL.SUPERFICIAL","ev":"The pulse is superficial and tense","src":["WHO","GB"],"ev_zh":"脉浮或紧"},{"f":"PL.TIGHT","ev":"The pulse is superficial and tense","src":["WHO","GB"],"ev_zh":"脉浮或紧"},{"f":"FT.HEADACHE","ev":"头身疼痛","src":["GB"]},{"f":"FT.PHLEGM","ev":"痰清稀","src":["GB"],"gb_secondary":true},{"f":"FT.WHITE_PHLEGM","ev":"痰清稀","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.FENG_SHI_XI_BIAO","en":"Wind dampness attacking the exterior pattern","zh":"风湿袭表证","py":"fēng shī xí biǎo zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by body soreness/heaviness, headache with a heavy sensation, aversion to cold, fever that cannot be resolved by sweating, chest tightness, and absence of thirst. Often occurs when wind dampness attacks the surface of the body and obstructs the flow of Wei-defensive qi.","tongue":"The tongue coating is white, slippery or greasy.","pulse":"The pulse is soft and delayed.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1021 (风湿袭表证), p. 107","gb":"3.2.6.1.1","gbtext":"全身肌肉、关节酸楚困重，头晕胀痛，如箍似裹，舌苔白滑或腻，脉濡缓；伴见发热、汗出不解，胸闷，口不渴","status":"draft","links":[{"f":"FT.AVERSION_COLD","ev":"aversion to cold","src":["WHO"]},{"f":"FT.FEVER","ev":"fever that cannot be resolved by sweating","src":["WHO","GB"],"ev_zh":"发热","gb_secondary":true},{"f":"FT.NO_THIRST","ev":"and absence of thirst","src":["WHO","GB"],"ev_zh":"口不渴","gb_secondary":true},{"f":"FT.HEAVINESS","ev":"headache with a heavy sensation","src":["WHO","GB"],"ev_zh":"关节酸楚困重"},{"f":"FT.HEADACHE","ev":"headache with a heavy sensation","src":["WHO","GB"],"ev_zh":"头晕胀痛"},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO","GB"],"ev_zh":"胸闷","gb_secondary":true},{"f":"TG.COAT_WHITE","ev":"The tongue coating is white","src":["WHO","GB"],"ev_zh":"舌苔白滑或腻"},{"f":"TG.COAT_GREASY","ev":"slippery or greasy","src":["WHO","GB"],"ev_zh":"舌苔白滑或腻"},{"f":"TG.COAT_SLIPPERY","ev":"slippery or greasy","src":["WHO","GB"],"ev_zh":"舌苔白滑或腻"},{"f":"PL.SOFT","ev":"The pulse is soft and delayed","src":["WHO","GB"],"ev_zh":"脉濡缓"},{"f":"PL.SLACK","ev":"The pulse is soft and delayed","src":["WHO","GB"],"ev_zh":"脉濡缓"},{"f":"FT.JOINT_PAIN","ev":"关节酸楚困重","src":["GB"]},{"f":"FT.DIZZY","ev":"头晕胀痛","src":["GB"]},{"f":"FT.MOVING_PAIN","ev":"头晕胀痛","src":["GB"]}]},{"id":"SYN.ETI.FENG_DU_FAN_BIAO","en":"Wind toxin attacking the exterior pattern","zh":"风毒犯表证","py":"fēng dú fàn biǎo zhèng","he":null,"cat":"Patterns related to causati he":null,"cat":"Patterns related to causative factors","text":"Characterized by abdominal discomfort, poor appetite, a sticky, greasy taste in the mouth, thirst with little water intake, limb soreness/heaviness/ pain, dizziness and headache with a distending sensation. Alternatively, waves of fever in the afternoon, limb oedema, loose stools, and scanty urine may be present. Often occurs when summer heat and dampness obstruct the qi activities of the spleen and stomach.","tongue":"The tongue is pale and enlarged with a yellow, greasy coating.","pulse":"The pulse is slippery and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1035 (暑湿困脾证), p. 111","gb":"3.4.4.4.2","gbtext":"脘腹痞闷，不思饮食，口中黏腻，渴不多饮，头晕胀痛，肢体困倦，舌质偏胖，舌苔滑腻或黄，脉濡数或滑数；伴见潮热，浮肿，便溏，小便短赤","status":"draft","links":[{"f":"FT.THIRST","ev":"thirst with little water intake","src":["WHO"]},{"f":"FT.NO_THIRST","ev":"thirst with little water intake","src":["WHO","GB"],"ev_zh":"渴不多饮"},{"f":"FT.STICKY_MOUTH","ev":"greasy taste in the mouth","src":["WHO","GB"],"ev_zh":"口中黏腻"},{"f":"FT.POOR_APPETITE","ev":"poor appetite","src":["WHO","GB"],"ev_zh":"不思饮食"},{"f":"FT.LOOSE_STOOL","ev":"loose stools","src":["WHO","GB"],"ev_zh":"便溏","gb_secondary":true},{"f":"FT.SCANTY_URINE","ev":"and scanty urine may be present","src":["WHO","GB"],"ev_zh":"小便短赤","gb_secondary":true},{"f":"FT.OEDEMA","ev":"limb oedema","src":["WHO","GB"],"ev_zh":"浮肿","gb_secondary":true},{"f":"FT.HEADACHE","ev":"dizziness and headache with a distending sensation","src":["WHO","GB"],"ev_zh":"头晕胀痛"},{"f":"FT.HEADACHE_DISTENDING","ev":"dizziness and headache with a distending sensation","src":["WHO"]},{"f":"FT.DIZZY","ev":"dizziness and headache with a distending sensation","src":["WHO","GB"],"ev_zh":"头晕胀痛"},{"f":"TG.PALE","ev":"The tongue is pale and enlarged with a yellow","src":["WHO"]},{"f":"TG.ENLARGED","ev":"The tongue is pale and enlarged with a yellow","src":["WHO","GB"],"ev_zh":"舌质偏胖"},{"f":"TG.COAT_YELLOW","ev":"The tongue is pale and enlarged with a yellow","src":["WHO","GB"],"ev_zh":"舌苔滑腻或黄"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔滑腻或黄"},{"f":"PL.RAPID","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉濡数或滑数"},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉濡数或滑数"},{"f":"FT.MOVING_PAIN","ev":"头晕胀痛","src":["GB"]},{"f":"FT.FATIGUE","ev":"肢体困倦","src":["GB"]},{"f":"TG.COAT_SLIPPERY","ev":"舌苔滑腻或黄","src":["GB"]},{"f":"PL.SOFT","ev":"脉濡数或滑数","src":["GB"]},{"f":"FT.HOT_FLUSHES","ev":"潮热","src":["GB"],"gb_secondary":true},{"f":"FT.YELLOW_URINE","ev":"小便短赤","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.SHU_SHI_XI_BIAO","en":"Summer heat and dampness attacking the exterior pattern","zh":"暑湿袭表证","py":"shǔ shī xí biǎo zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by fever, mild aversion to wind cold, body heaviness, sweating/absence of sweating, and thirst. Often occurs when summer heat and dampness attack the surface of the body and affect the normal functioning of the Wei-defensive qi.","tongue":"The tongue is red with a yellow coating.","pulse":"The pulse is soft and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1036 (暑湿袭表证), p. 111","gb":"3.4.4.1","gbtext":"发热，微恶风寒，鼻塞、流涕，头晕胀痛；伴见皮肤疮疖，肌肉肿痛，骨节酸痛，舌质红，舌苔黄腻，脉濡数","status":"draft","links":[{"f":"FT.AVERSION_COLD","ev":"mild aversion to wind cold","src":["WHO","GB"],"ev_zh":"微恶风寒"},{"f":"FT.FEVER","ev":"Characterized by fever","src":["WHO","GB"],"ev_zh":"发热"},{"f":"FT.NO_SWEAT","ev":"sweating/absence of sweating","src":["WHO"]},{"f":"FT.HEAVINESS","ev":"body heaviness","src":["WHO"]},{"f":"TG.RED","ev":"The tongue is red with a yellow coating","src":["WHO","GB"],"ev_zh":"舌质红","gb_secondary":true},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow coating","src":["WHO","GB"],"ev_zh":"舌苔黄腻","gb_secondary":true},{"f":"PL.RAPID","ev":"The pulse is soft and rapid","src":["WHO","GB"],"ev_zh":"脉濡数","gb_secondary":true},{"f":"PL.SOFT","ev":"The pulse is soft and rapid","src":["WHO","GB"],"ev_zh":"脉濡数","gb_secondary":true},{"f":"FT.NASAL","ev":"鼻塞","src":["GB"]},{"f":"FT.HEADACHE","ev":"头晕胀痛","src":["GB"]},{"f":"FT.DIZZY","ev":"头晕胀痛","src":["GB"]},{"f":"FT.MOVING_PAIN","ev":"头晕胀痛","src":["GB"]},{"f":"FT.RASH","ev":"皮肤疮疖","src":["GB"],"gb_secondary":true},{"f":"FT.JOINT_PAIN","ev":"骨节酸痛","src":["GB"],"gb_secondary":true},{"f":"TG.COAT_GREASY","ev":"舌苔黄腻","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.SHU_RE_DONG_FENG","en":"Summer heat stirring wind pattern","zh":"暑热动风证","py":"shǔ rè dòng fēng zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by persistent high fever, unconsciousness, mania, delirium, and convulsions of the limbs. Alternatively, opisthotonus and trismus may be present. Often occurs when summer heat/dampness or pestilence stir the liver wind. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1037 (暑热动风证), p. 111","gb":"3.4.3.4.4","gbtext":"高热不退，烦躁，手足瘈疭，甚则角弓反张，牙关紧闭，舌质红绛，脉弦滑数，指纹青紫；伴见神昏、谵狂","status":"draft","links":[{"f":"FT.FEVER","ev":"Characterized by persistent high fever","src":["WHO","GB"],"ev_zh":"高热不退"},{"f":"FT.SPASM","ev":"and convulsions of the limbs","src":["WHO","GB"],"ev_zh":"甚则角弓反张"},{"f":"FT.RESTLESS","ev":"烦躁","src":["GB"]},{"f":"TG.RED","ev":"舌质红绛","src":["GB"]},{"f":"TG.DEEP_RED","ev":"舌质红绛","src":["GB"]},{"f":"PL.RAPID","ev":"脉弦滑数","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉弦滑数","src":["GB"]},{"f":"PL.WIRY","ev":"脉弦滑数","src":["GB"]}]},{"id":"SYN.ETI.SHU_HAO_QI_YIN","en":"Summer heat consuming qi and yin pattern","zh":"暑耗气阴证","py":"shǔ hào qì yīn zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by persistent high fever, thirst with a desire to drink water, dry skin, lassitude, and shortness of breath. Alternatively, gastric discomfort, abdominal distension, frequent vomiting, and diarrhoea may be present. Often occurs when summer heat or pestilence consumes qi and damages yin.","tongue":"The tongue is dry and red with a dry, yellow coating.","pulse":"The pulse is thready and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1038 (暑耗气阴证), p. 111","gb":"3.4.3.3.4","gbtext":"高热持续不退，口渴引饮，皮肤干瘪，神疲、气短，舌质红，舌苔黄燥，甚或无苔，脉细数；伴见干咳、无痰，脘闷，腹胀，呕吐，腹泻","status":"draft","links":[{"f":"FT.FEVER","ev":"Characterized by persistent high fever","src":["WHO","GB"],"ev_zh":"高热持续不退"},{"f":"FT.THIRST","ev":"thirst with a desire to drink water","src":["WHO","GB"],"ev_zh":"口渴引饮"},{"f":"FT.ABD_DIST","ev":"abdominal distension","src":["WHO","GB"],"ev_zh":"脘闷","gb_secondary":true},{"f":"FT.NAUSEA","ev":"frequent vomiting","src":["WHO","GB"],"ev_zh":"呕吐","gb_secondary":true},{"f":"FT.LOOSE_STOOL","ev":"and diarrhoea may be present","src":["WHO","GB"],"ev_zh":"腹泻","gb_secondary":true},{"f":"FT.FATIGUE","ev":"lassitude","src":["WHO","GB"],"ev_zh":"神疲"},{"f":"FT.SOB","ev":"and shortness of breath","src":["WHO","GB"],"ev_zh":"气短"},{"f":"FT.DRY_SKIN","ev":"dry skin","src":["WHO","GB"],"ev_zh":"皮肤干瘪"},{"f":"TG.RED","ev":"The tongue is dry and red with a dry","src":["WHO","GB"],"ev_zh":"舌质红"},{"f":"TG.COAT_YELLOW","ev":"yellow coating","src":["WHO","GB"],"ev_zh":"舌苔黄燥"},{"f":"TG.DRY","ev":"The tongue is dry and red with a dry","src":["WHO","GB"],"ev_zh":"舌苔黄燥"},{"f":"PL.RAPID","ev":"The pulse is thready and rapid","src":["WHO","GB"],"ev_zh":"脉细数"},{"f":"PL.THREADY","ev":"The pulse is thready and rapid","src":["WHO","GB"],"ev_zh":"脉细数"},{"f":"TG.COAT_SCANTY","ev":"甚或无苔","src":["GB"]},{"f":"FT.COUGH","ev":"干咳","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.SHI_SHANG_PI_YANG","en":"Dampness affecting spleen yang pattern","zh":"湿伤脾阳证","py":"shī shāng pí yáng zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by gastric discomfort, abdominal distension, a greasy taste in the mouth, nausea, vomiting, loss of sense of taste, absence of thirst, abdominal pain, loose stools, and head/body heaviness. Alternatively, dark, yellowish eyes and body skin may be present. Often occurs when retained dampness impairs spleen yang.","tongue":"The tongue is pale and enlarged with a white, greasy coating.","pulse":"The pulse is soft and delayed.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1039 (湿伤脾阳证), p. 111","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.NO_THIRST","ev":"absence of thirst","src":["WHO"]},{"f":"FT.STICKY_MOUTH","ev":"a greasy taste in the mouth","src":["WHO"]},{"f":"FT.ABD_DIST","ev":"abdominal distension","src":["WHO"]},{"f":"FT.NAUSEA","ev":"nausea","src":["WHO"]},{"f":"FT.LOOSE_STOOL","ev":"loose stools","src":["WHO"]},{"f":"FT.HEAVINESS","ev":"and head/body heaviness","src":["WHO"]},{"f":"FT.JAUNDICE","ev":"yellowish eyes and body skin may be present","src":["WHO"]},{"f":"TG.PALE","ev":"The tongue is pale and enlarged with a white","src":["WHO"]},{"f":"TG.ENLARGED","ev":"The tongue is pale and enlarged with a white","src":["WHO"]},{"f":"TG.COAT_WHITE","ev":"The tongue is pale and enlarged with a white","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO"]},{"f":"PL.SOFT","ev":"The pulse is soft and delayed","src":["WHO"]},{"f":"PL.SLACK","ev":"The pulse is soft and delayed","src":["WHO"]}]},{"id":"SYN.ETI.SHI_RE","en":"Damp heat pattern","zh":"湿热证","py":"shī rè zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by inhibited body fever, body heaviness, gastric discomfort, thirst with little water intake/absence of thirst, scanty, yellow urine and loose stools with a sensation of incomplete evacuation. Often occurs when damp binds with heat, resulting in difficulty clearing heat and resolving dampness.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is slippery and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1040 (湿热证), p. 111","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.FEVER","ev":"Characterized by inhibited body fever","src":["WHO"]},{"f":"FT.THIRST","ev":"thirst with little water intake/absence of thirst","src":["WHO"]},{"f":"FT.NO_THIRST","ev":"thirst with little water intake/absence of thirst","src":["WHO"]},{"f":"FT.ABD_DIST","ev":"gastric discomfort","src":["WHO"]},{"f":"FT.LOOSE_STOOL","ev":"yellow urine and loose stools with a sensation of incomplete evacuation","src":["WHO"]},{"f":"FT.HEAVINESS","ev":"body heaviness","src":["WHO"]},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO"]},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO"]},{"f":"PL.RAPID","ev":"The pulse is slippery and rapid","src":["WHO"]},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and rapid","src":["WHO"]}]},{"id":"SYN.ETI.SHI_RE_XIA_ZHU","en":"Damp heat downflow pattern","zh":"湿热下注证","py":"shī rè xià zhù zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by frequent, urgent, dribbling or painful urination. Alternatively, strong- smelling, loose stools, yellow, smelly vaginal discharge, eczema and itching of the external genitalia, and leg sores/ulcers may be present. Often occurs when damp heat flows downward to affect the intestines, urinary bladder, uterus, external genitalia, and legs.","tongue":"The tongue coating is yellow and greasy.","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1041 (湿热下注证), p. 111","gb":"3.5.4.2.6","gbtext":"腹胀掣痛，腹痛拒按，小便频急涩痛，或大便腥臭烂溏，带下黄臭，月经不调，或肛门、阴部湿疹、瘙痒，或下肢疮疡溃烂、滋水，舌苔黄腻，脉滑数或濡数","status":"draft","links":[{"f":"FT.LOOSE_STOOL","ev":"loose stools","src":["WHO"]},{"f":"FT.PAINFUL_URINE","ev":"dribbling or painful urination","src":["WHO","GB"],"ev_zh":"小便频急涩痛"},{"f":"FT.ITCH","ev":"eczema and itching of the external genitalia","src":["WHO","GB"],"ev_zh":"瘙痒"},{"f":"FT.RASH","ev":"eczema and itching of the external genitalia","src":["WHO","GB"],"ev_zh":"阴部湿疹"},{"f":"FT.DISCHARGE","ev":"smelly vaginal discharge","src":["WHO","GB"],"ev_zh":"带下黄臭"},{"f":"TG.COAT_YELLOW","ev":"The tongue coati ns related to causative factors","text":"Characterized by persistent low fever or fever at night, restlessness, thirst, constipation, yellow urine, and fatigue. Often occurs when pathogenic heat is not completely removed.","tongue":"The tongue is dry and red.","pulse":"The pulse is thready and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1062 (余热未清证), p. 115","gb":"3.1.1.3.1.1","gbtext":"夜热早凉，或低热不退，心烦，口渴，神疲、乏力，舌质红而少津，脉细数；伴见形体消瘦，大便干结，小便短赤","status":"draft","links":[{"f":"FT.FEVER","ev":"Characterized by persistent low fever or fever at night","src":["WHO"]},{"f":"FT.THIRST","ev":"thirst","src":["WHO","GB"],"ev_zh":"口渴"},{"f":"FT.CONSTIPATION","ev":"constipation","src":["WHO","GB"],"ev_zh":"大便干结","gb_secondary":true},{"f":"FT.YELLOW_URINE","ev":"yellow urine","src":["WHO","GB"],"ev_zh":"小便短赤","gb_secondary":true},{"f":"FT.FATIGUE","ev":"and fatigue","src":["WHO","GB"],"ev_zh":"神疲"},{"f":"FT.RESTLESS","ev":"restlessness","src":["WHO","GB"],"ev_zh":"心烦"},{"f":"TG.RED","ev":"The tongue is dry and red","src":["WHO","GB"],"ev_zh":"舌质红而少津"},{"f":"TG.DRY","ev":"The tongue is dry and red","src":["WHO","GB"],"ev_zh":"舌质红而少津"},{"f":"PL.RAPID","ev":"The pulse is thready and rapid","src":["WHO","GB"],"ev_zh":"脉细数"},{"f":"PL.THREADY","ev":"The pulse is thready and rapid","src":["WHO","GB"],"ev_zh":"脉细数"},{"f":"FT.HOT_FLUSHES","ev":"夜热早凉","src":["GB"]},{"f":"FT.WEIGHT_LOSS","ev":"形体消瘦","src":["GB"],"gb_secondary":true},{"f":"FT.SCANTY_URINE","ev":"小便短赤","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.NEI_BI_WAI_TUO","en":"Interior blockage and exterior collapse pattern","zh":"内闭外脱证","py":"nèi bì wài tuō zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by fever, cough, and panting. Alternatively, tenesmus, urine retention, constipation, cardiac or abdominal colic, a pale face, cold limbs, cold sweats, and faint breathing may be present. Often occurs when excessive pathogenic factors block the interior and anti-pathogenic qi becomes extremely deficient.","tongue":"","pulse":"The pulse is extremely feeble.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1063 (内闭外脱证), p. 115","gb":"10.3.2","gbtext":"面色苍白，四肢厥冷，冷汗淋漓，气息微弱，或循衣摸床，撮空理线，脉微欲绝；伴见发热、胸闷、喘促，或腹痛、下痢，里急后重，或二便不通，或心胸、脘腹绞痛","status":"draft","links":[{"f":"FT.COLD_LIMBS","ev":"cold limbs","src":["WHO","GB"],"ev_zh":"四肢厥冷"},{"f":"FT.FEVER","ev":"Characterized by fever","src":["WHO","GB"],"ev_zh":"发热","gb_secondary":true},{"f":"FT.PALE_FACE","ev":"a pale face","src":["WHO","GB"],"ev_zh":"面色苍白"},{"f":"FT.PROFUSE_SWEAT","ev":"cold sweats","src":["WHO","GB"],"ev_zh":"冷汗淋漓"},{"f":"FT.CONSTIPATION","ev":"constipation","src":["WHO"]},{"f":"FT.TENESMUS","ev":"tenesmus","src":["WHO","GB"],"ev_zh":"里急后重","gb_secondary":true},{"f":"FT.SCANTY_URINE","ev":"urine retention","src":["WHO"]},{"f":"FT.SOB","ev":"and panting","src":["WHO","GB"],"ev_zh":"喘促","gb_secondary":true},{"f":"FT.LOW_VOICE","ev":"and faint breathing may be present","src":["WHO"]},{"f":"FT.COUGH","ev":"cough","src":["WHO"]},{"f":"PL.WEAK","ev":"The pulse is extremely feeble","src":["WHO","GB"],"ev_zh":"脉微欲绝"},{"f":"FT.CHEST_TIGHT","ev":"胸闷","src":["GB"],"gb_secondary":true},{"f":"FT.ABD_PAIN","ev":"或腹痛","src":["GB"],"gb_secondary":true},{"f":"FT.LOOSE_STOOL","ev":"下痢","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.HAN_TAN","en":"Cold phlegm pattern","zh":"寒痰证","py":"hán tán zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by coughing with white phlegm, chest tightness, gastric stuffiness, panting, wheezing sounds, cold intolerance, and cold limbs. Often occurs when pathogenic cold binds with turbid phlegm.","tongue":"The tongue coating is white and greasy.","pulse":"The pulse is wiry, slippery or wiry and tense.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1064 (寒痰证), p. 115","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.AVERSION_COLD","ev":"cold intolerance","src":["WHO"]},{"f":"FT.COLD_LIMBS","ev":"and cold limbs","src":["WHO"]},{"f":"FT.ABD_DIST","ev":"gastric stuffiness","src":["WHO"]},{"f":"FT.SOB","ev":"panting","src":["WHO"]},{"f":"FT.COUGH","ev":"Characterized by coughing with white phlegm","src":["WHO"]},{"f":"FT.PHLEGM","ev":"Characterized by coughing with white phlegm","src":["WHO"]},{"f":"FT.WHITE_PHLEGM","ev":"Characterized by coughing with white phlegm","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO"]},{"f":"TG.COAT_WHITE","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"PL.SLIPPERY","ev":"slippery or wiry and tense","src":["WHO"]},{"f":"PL.WIRY","ev":"The pulse is wiry","src":["WHO"]},{"f":"PL.TIGHT","ev":"slippery or wiry and tense","src":["WHO"]}]},{"id":"SYN.ETI.RE_TAN","en":"Heat phlegm pattern","zh":"热痰证","py":"rè tán zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by coughing with yellow phlegm, fever and thirst. Often occurs when turbid phlegm binds with pathogenic heat.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is slippery and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1065 (热痰证), p. 117","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.FEVER","ev":"fever and thirst","src":["WHO"]},{"f":"FT.THIRST","ev":"fever and thirst","src":["WHO"]},{"f":"FT.COUGH","ev":"Characterized by coughing with yellow phlegm","src":["WHO"]},{"f":"FT.PHLEGM","ev":"Characterized by coughing with yellow phlegm","src":["WHO"]},{"f":"FT.YELLOW_PHLEGM","ev":"Characterized by coughing with yellow phlegm","src":["WHO"]},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO"]},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO"]},{"f":"PL.RAPID","ev":"The pulse is slippery and rapid","src":["WHO"]},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and rapid","src":["WHO"]}]},{"id":"SYN.ETI.SHI_TAN","en":"Damp phlegm pattern","zh":"湿痰证","py":"shī tán zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by cough with easy expectoration of profuse, sticky phlegm, limb heaviness, dizziness, tinnitus, chest stuffiness, and tightness, a low food intake, a greasy taste and a foreign body sensation in the throat. Often results from the internal build up of phlegm dampness.","tongue":"The tongue coating is white and greasy.","pulse":"The pulse is soft and slippery.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1066 (湿痰证), p. 117","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.STICKY_MOUTH","ev":"a greasy taste and a foreign body sensation in the throat","src":["WHO"]},{"f":"FT.POOR_APPETITE","ev":"a low food intake","src":["WHO"]},{"f":"FT.HEAVINESS","ev":"limb heaviness","src":["WHO"]},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO"]},{"f":"FT.TINNITUS","ev":"tinnitus","src":["WHO"]},{"f":"FT.COUGH","ev":"Characterized by cough with easy expectoration of profuse","src":["WHO"]},{"f":"FT.PHLEGM","ev":"sticky phlegm","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest stuffiness","src":["WHO"]},{"f":"TG.COAT_WHITE","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"PL.SLIPPERY","ev":"The pulse is soft and slippery","src":["WHO"]},{"f":"PL.SOFT","ev":"The pulse is soft and slippery","src":["WHO"]}]},{"id":"SYN.ETI.FENG_TAN","en":"Wind phlegm pattern","zh":"风痰证","py":"fēng tán zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by vomiting of foamy phlegm, chest tightness, dizziness, headache, eye distension/ pain, sound of phlegm in the throat, and deviation of the eyes and mouth border. Often occurs when external wind that carries turbid phlegm attacks the body or liver wind that carries turbid phlegm affects the body.","tongue":"The tongue coating is white and greasy.","pulse":"The pulse is wiry and slippery.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1067 (风痰证), p. 117","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.NAUSEA","ev":"Characterized by vomiting of foamy phlegm","src":["WHO"]},{"f":"FT.HEADACHE","ev":"headache","src":["WHO"]},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO"]},{"f":"FT.PHLEGM","ev":"Characterized by vomiting of foamy phlegm","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO"]},{"f":"TG.COAT_WHITE","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"The tongue coating is white and greasy","src":["WHO"]},{"f":"PL.SLIPPERY","ev":"The pulse is wiry and slippery","src":["WHO"]},{"f":"PL.WIRY","ev":"The pulse is wiry and slippery","src":["WHO"]}]},{"id":"SYN.ETI.ZAO_TAN","en":"Dry phlegm pattern","zh":"燥痰证","py":"zào tán zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by cough with difficult expectoration of sticky or blood-stained phlegm, chest tightness/pain, and a dry mouth and nose. Often results from internal build up of dry heat and turbid phlegm.","tongue":"The tongue is dry with a greasy coating.","pulse":"The pulse is hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1068 (燥痰证), p. 117","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.DRY_MOUTH","ev":"and a dry mouth and nose","src":["WHO"]},{"f":"FT.COUGH","ev":"Characterized by cough with difficult expectoration of sticky or blood-stained phlegm","src":["WHO"]},{"f":"FT.PHLEGM","ev":"Characterized by cough with difficult expectoration of sticky or blood-stained phlegm","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest tightness/pain","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"The tongue is dry with a greasy coating","src":["WHO"]},{"f":"TG.DRY","ev":"The tongue is dry with a greasy coating","src":["WHO"]},{"f":"PL.HESITANT","ev":"The pulse is hesitant","src":["WHO"]}]},{"id":"SYN.ETI.TAN_QI_HU_JIE","en":"Phlegm qi stagnation pattern","zh":"痰气互结证","py":"tán qì hù jié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by emotional depression, insomnia, dream-disturbed sleep, a foreign body sensation in the throat, fullness, and tightness in the sub- costal region and profuse phlegm. Often results from phlegm binding with qi. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语","tongue":"The tongue coating is white and greasy.","pulse":"The pulse is wiry and slippery.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1069 (痰气互结证), p. 117","gb":"3.9.1.1","gbtext":"精神抑郁，痰多，自觉咽中有物梗阻，咽之不下，吐之不出，不影响吞咽与进食，皮下或可扣及圆形质软或偏硬的肿块，推之可移，舌质或红，舌苔白腻，脉弦滑；伴见胸闷、胁痛、心烦、善太息","status":"draft","links":[{"f":"FT.INSOMNIA","ev":"insomnia","src":["WHO"]},{"f":"FT.DREAMS","ev":"dream-disturbed sleep","src":["WHO"]},{"f":"FT.LOW_MOOD","ev":"Characterized by emotional depression","src":["WHO","GB"],"ev_zh":"精神抑郁"},{"f":"FT.PHLEGM","ev":"and tightness in the sub- costal region and profuse phlegm","src":["WHO","GB"],"ev_zh":"痰多"},{"f":"FT.FLANK_PAIN","ev":"and tightness in the sub- costal region and profuse phlegm","src":["WHO","GB"],"ev_zh":"胁痛","gb_secondary":true},{"f":"TG.COAT_WHITE","ev":"The tongue coating is white and greasy","src":["WHO","GB"],"ev_zh":"舌苔白腻"},{"f":"TG.COAT_GREASY","ev":"The tongue coating is white and greasy","src":["WHO","GB"],"ev_zh":"舌苔白腻"},{"f":"PL.SLIPPERY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"},{"f":"PL.WIRY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"},{"f":"TG.RED","ev":"舌质或红","src":["GB"]},{"f":"FT.CHEST_TIGHT","ev":"胸闷","src":["GB"],"gb_secondary":true},{"f":"FT.RESTLESS","ev":"心烦","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_QI_ZU_GE","en":"Phlegm qi obstructing the diaphragm pattern","zh":"痰气阻膈证","py":"tán qì zǔ gé zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by diaphragm fullness and tightness, a sensation of food being stuck or held up, hiccups, and vomiting of phlegm or saliva and the sensation is alleviated after belching. Often occurs when turbid phlegm obstructs the flow of qi in the diaphragm.","tongue":"The tongue coating is greasy or slippery.","pulse":"The pulse is wiry.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1070 (痰气阻膈证), p. 117","gb":"3.9.1.4","gbtext":"胸膈痞满或痛，进食梗塞，甚则难以咽下，嗳气、呃逆，或食后即吐，泛吐痰涎，体重骤减，大便艰涩，形体日渐消瘦，舌质暗淡，舌苔薄腻，脉沉细或弦滑","status":"draft","links":[{"f":"FT.NAUSEA","ev":"and vomiting of phlegm or saliva and the sensation is alleviated after belching","src":["WHO"]},{"f":"FT.BELCHING","ev":"and vomiting of phlegm or saliva and the sensation is alleviated after belching","src":["WHO","GB"],"ev_zh":"嗳气"},{"f":"FT.PHLEGM","ev":"and vomiting of phlegm or saliva and the sensation is alleviated after belching","src":["WHO","GB"],"ev_zh":"泛吐痰涎"},{"f":"TG.COAT_GREASY","ev":"The tongue coating is greasy or slippery","src":["WHO","GB"],"ev_zh":"舌苔薄腻"},{"f":"TG.COAT_SLIPPERY","ev":"The tongue coating is greasy or slippery","src":["WHO"]},{"f":"PL.WIRY","ev":"The pulse is wiry","src":["WHO","GB"],"ev_zh":"脉沉细或弦滑"},{"f":"FT.ABD_DIST","ev":"胸膈痞满或痛","src":["GB"]},{"f":"FT.POSTMEAL_DIST","ev":"或食后即吐","src":["GB"]},{"f":"FT.WEIGHT_LOSS","ev":"形体日渐消瘦","src":["GB"]},{"f":"TG.PALE","ev":"舌质暗淡","src":["GB"]},{"f":"TG.PURPLE","ev":"舌质暗淡","src":["GB"]},{"f":"TG.COAT_THIN","ev":"舌苔薄腻","src":["GB"]},{"f":"PL.DEEP","ev":"脉沉细或弦滑","src":["GB"]},{"f":"PL.THREADY","ev":"脉沉细或弦滑","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉沉细或弦滑","src":["GB"]}]},{"id":"SYN.ETI.TAN_YU_HUA_RE","en":"Phlegm and blood stasis transformed heat pattern","zh":"痰瘀化热证","py":"tán yū huà rè zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by local swelling and hardness coupled with a burning sensation and stabbing pain, chest tightness, and expectoration of yellow phlegm that may contain blood. Often occurs when retained phlegm and blood stasis transform into heat.","tongue":"The tongue is dark red or with ecchymosis and a yellow, greasy coating.","pulse":"The pulse is wiry and hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1071 (痰瘀化热证), p. 117","gb":"3.9.9.2.1","gbtext":"局部肿块或臖核等红肿灼痛，甚或化脓，舌质暗红或有瘀点，舌苔黄腻，脉弦滑或数；伴见发热，胸胁满闷，胁下痞痛，痰黄或夹血块","status":"draft","links":[{"f":"FT.PHLEGM","ev":"and expectoration of yellow phlegm that may contain blood","src":["WHO","GB"],"ev_zh":"痰黄或夹血块","gb_secondary":true},{"f":"FT.YELLOW_PHLEGM","ev":"and expectoration of yellow phlegm that may contain blood","src":["WHO","GB"],"ev_zh":"痰黄或夹血块","gb_secondary":true},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO","GB"],"ev_zh":"胸胁满闷","gb_secondary":true},{"f":"FT.STABBING_PAIN","ev":"Characterized by local swelling and hardness coupled with a burning sensation and stabbing pain","src":["WHO"]},{"f":"TG.RED","ev":"The tongue is dark red or with ecchymosis and a yellow","src":["WHO","GB"],"ev_zh":"舌质暗红或有瘀点"},{"f":"TG.PURPLE","ev":"The tongue is dark red or with ecchymosis and a yellow","src":["WHO","GB"],"ev_zh":"舌质暗红或有瘀点"},{"f":"TG.COAT_YELLOW","ev":"The tongue is dark red or with ecchymosis and a yellow","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"PL.WIRY","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉弦滑或数"},{"f":"PL.HESITANT","ev":"The pulse is wiry and hesitant","src":["WHO"]},{"f":"PL.RAPID","ev":"脉弦滑或数","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉弦滑或数","src":["GB"]},{"f":"FT.FEVER","ev":"发热","src":["GB"],"gb_secondary":true},{"f":"FT.FLANK_PAIN","ev":"胸胁满闷","src":["GB"],"gb_secondary":true},{"f":"FT.MENS_CLOTS","ev":"痰黄或夹血块","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_YU_ZU_GE","en":"Phlegm and blood stasis obstructed the diaphragm pattern","zh":"痰瘀阻膈证","py":"tán yū zǔ gé zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by diaphragm stuffiness, tightness and stabbing pain, a sensation of food being stuck or blocked, and vomiting of phlegm or saliva. Often occurs when stagnant blood and turbid phlegm obstruct the diaphragm.","tongue":"The tongue is purple or with ecchymosis and a greasy coating.","pulse":"The pulse is hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1072 (痰瘀阻膈证), p. 117","gb":"3.9.9.1.7","gbtext":"胸膈痞闷、刺痛，进食作梗，甚则食入即吐，呕哕黏痰，舌质暗红或紫，或有瘀点、瘀斑，舌苔干腻或少苔，脉细涩；伴见形体羸瘦，肌肤甲错，面色晦暗，大便硬如羊屎，或便血","status":"draft","links":[{"f":"FT.NAUSEA","ev":"and vomiting of phlegm or saliva","src":["WHO","GB"],"ev_zh":"呕哕黏痰"},{"f":"FT.PHLEGM","ev":"and vomiting of phlegm or saliva","src":["WHO","GB"],"ev_zh":"呕哕黏痰"},{"f":"FT.STABBING_PAIN","ev":"tightness and stabbing pain","src":["WHO","GB"],"ev_zh":"刺痛"},{"f":"TG.PURPLE","ev":"The tongue is purple or with ecchymosis and a greasy coating","src":["WHO","GB"],"ev_zh":"舌质暗红或紫"},{"f":"TG.COAT_GREASY","ev":"The tongue is purple or with ecchymosis and a greasy coating","src":["WHO","GB"],"ev_zh":"舌苔干腻或少苔"},{"f":"PL.HESITANT","ev":"The pulse is hesitant","src":["WHO","GB"],"ev_zh":"脉细涩"},{"f":"FT.CHEST_TIGHT","ev":"胸膈痞闷","src":["GB"]},{"f":"TG.RED","ev":"舌质暗红或紫","src":["GB"]},{"f":"TG.COAT_SCANTY","ev":"舌苔干腻或少苔","src":["GB"]},{"f":"TG.DRY","ev":"舌苔干腻或少苔","src":["GB"]},{"f":"PL.THREADY","ev":"脉细涩","src":["GB"]},{"f":"FT.WEIGHT_LOSS","ev":"形体羸瘦","src":["GB"],"gb_secondary":true},{"f":"FT.DRY_SKIN","ev":"肌肤甲错","src":["GB"],"gb_secondary":true},{"f":"FT.CONSTIPATION","ev":"大便硬如羊屎","src":["GB"],"gb_secondary":true},{"f":"FT.BLOODY_STOOL","ev":"或便血","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_YU_HU_JIE","en":"Intertwined phlegm and blood stasis pattern","zh":"痰瘀互结证","py":"tán yū hù jié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by local lumps with stabbing pain, limb numbness or flaccidity, chest tightness, and profuse phlegm that may contain dark purple clots. Often occurs when turbid phlegm intertwines with stagnant blood.","tongue":"The tongue is dark purple or with ecchymosis and a greasy coating.","pulse":"The pulse is wiry and hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1073 (痰瘀互结证), p. 117","gb":"3.9.9.1.2","gbtext":"局部肿块、包块刺痛，或肢体麻木、痿废，颜面胸背等处泛发黑白粉刺，舌质暗红或紫，或有瘀点、瘀斑，舌苔腻，脉弦滑或涩；伴见胸膈或乳房疼痛，咳唾痰血，腹胀，经行腹痛，经血色紫黑，婚久不孕","status":"draft","links":[{"f":"FT.PHLEGM","ev":"and profuse phlegm that may contain dark purple clots","src":["WHO","GB"],"ev_zh":"咳唾痰血","gb_secondary":true},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO"]},{"f":"FT.NUMBNESS","ev":"limb numbness or flaccidity","src":["WHO","GB"],"ev_zh":"或肢体麻木"},{"f":"FT.STABBING_PAIN","ev":"Characterized by local lumps with stabbing pain","src":["WHO","GB"],"ev_zh":"包块刺痛"},{"f":"FT.MENS_CLOTS","ev":"and profuse phlegm that may contain dark purple clots","src":["WHO"]},{"f":"TG.PURPLE","ev":"The tongue is dark purple or with ecchymosis and a greasy coating","src":["WHO","GB"],"ev_zh":"舌质暗红或紫"},{"f":"TG.COAT_GREASY","ev":"The tongue is dark purple or with ecchymosis and a greasy coating","src":["WHO","GB"],"ev_zh":"舌苔腻"},{"f":"PL.WIRY","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉弦滑或涩"},{"f":"PL.HESITANT","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉弦滑或涩"},{"f":"TG.RED","ev":"舌质暗红或紫","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉弦滑或涩","src":["GB"]},{"f":"FT.COUGH","ev":"咳唾痰血","src":["GB"],"gb_secondary":true},{"f":"FT.ABD_DIST","ev":"腹胀","src":["GB"],"gb_secondary":true},{"f":"FT.ABD_PAIN","ev":"经行腹痛","src":["GB"],"gb_secondary":true},{"f":"FT.MENS_PAIN","ev":"经行腹痛","src":["GB"],"gb_secondary":true},{"f":"FT.INFERTILITY_F","ev":"婚久不孕","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_RE_QI_ZHI","en":"Phlegm heat stagnated qi pattern","zh":"痰热气滞证","py":"tán rè qì zhì zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by restlessness, irritability, distension and tightness in the subcostal region, a burning wandering pain, coughing, panting, expectoration of yellow phlegm, fever, and thirst. Often occurs when phlegm heat obstructs the flow of qi.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is wiry and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1074 (痰热气滞证), p. 117","gb":"3.9.5.1.1.2","gbtext":"胸肋闷胀或局部隆起，按压疼痛，或走窜灼痛，心烦、易怒，舌质红，舌苔黄腻，脉弦数；伴见发热，咳喘，咯痰黄稠，口渴","status":"draft","links":[{"f":"FT.FEVER","ev":"fever","src":["WHO","GB"],"ev_zh":"发热","gb_secondary":true},{"f":"FT.THIRST","ev":"and thirst","src":["WHO","GB"],"ev_zh":"口渴","gb_secondary":true},{"f":"FT.SOB","ev":"panting","src":["WHO","GB"],"ev_zh":"咳喘","gb_secondary":true},{"f":"FT.RESTLESS","ev":"Characterized by restlessness","src":["WHO","GB"],"ev_zh":"心烦"},{"f":"FT.IRRITABLE","ev":"irritability","src":["WHO","GB"],"ev_zh":"易怒"},{"f":"FT.COUGH","ev":"coughing","src":["WHO","GB"],"ev_zh":"咳喘","gb_secondary":true},{"f":"FT.PHLEGM","ev":"expectoration of yellow phlegm","src":["WHO","GB"],"ev_zh":"咯痰黄稠","gb_secondary":true},{"f":"FT.YELLOW_PHLEGM","ev":"expectoration of yellow phlegm","src":["WHO","GB"],"ev_zh":"咯痰黄稠","gb_secondary":true},{"f":"FT.FLANK_PAIN","ev":"distension and tightness in the subcostal region","src":["WHO"]},{"f":"FT.MOVING_PAIN","ev":"a burning wandering pain","src":["WHO","GB"],"ev_zh":"或走窜灼痛"},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌质红"},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"PL.RAPID","ev":"The pulse is wiry and rapid","src":["WHO","GB"],"ev_zh":"脉弦数"},{"f":"PL.WIRY","ev":"The pulse is wiry and rapid","src":["WHO","GB"],"ev_zh":"脉弦数"},{"f":"FT.CHEST_TIGHT","ev":"胸肋闷胀或局部隆起","src":["GB"]}]},{"id":"SYN.ETI.TAN_HUO_BI_QIAO","en":"Phlegm fire blocked the heart spirit pattern","zh":"痰火闭窍证","py":"tán huǒ bì qiào zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by fever, thirst, a red face, rapid breathing, restlessness, mania, unconsciousness, delirium, sound of phlegm in the throat, constipation and yellow urine. Often occurs when intertwined fire heat and turbid phlegm blocks the heart mind.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is slippery and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1075 (痰火闭窍证), p. 119","gb":"3.9.6.2.4.2","gbtext":"突然昏仆，不省人事，鼻鼾、痰鸣，或躁扰发狂，肢体强直、痉挛，舌质红绛或深绛，舌苔黄腻或焦褐，脉沉滑数；伴见发热，面红、目赤，口干、唇燥，大便秘结","status":"draft","links":[{"f":"FT.FEVER","ev":"Characterized by fever","src":["WHO","GB"],"ev_zh":"发热","gb_secondary":true},{"f":"FT.RED_FACE","ev":"a red face","src":["WHO","GB"],"ev_zh":"面红","gb_secondary":true},{"f":"FT.THIRST","ev":"thirst","src":["WHO"]},{"f":"FT.CONSTIPATION","ev":"constipation and yellow urine","src":["WHO","GB"],"ev_zh":"大便秘结","gb_secondary":true},{"f":"FT.YELLOW_URINE","ev":"constipation and yellow urine","src":["WHO"]},{"f":"FT.SOB","ev":"rapid breathing","src":["WHO"]},{"f":"FT.RESTLESS","ev":"restlessness","src":["WHO","GB"],"ev_zh":"或躁扰发狂"},{"f":"FT.PHLEGM","ev":"sound of phlegm in the throat","src":["WHO","GB"],"ev_zh":"痰鸣"},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌质红绛或深绛"},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌苔黄腻或焦褐"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔黄腻或焦褐"},{"f":"PL.RAPID","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉沉滑数"},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉沉滑数"},{"f":"FT.SPASM","ev":"痉挛","src":["GB"]},{"f":"TG.DEEP_RED","ev":"舌质红绛或深绛","src":["GB"]},{"f":"PL.DEEP","ev":"脉沉滑数","src":["GB"]},{"f":"FT.RED_EYES","ev":"目赤","src":["GB"],"gb_secondary":true},{"f":"FT.DRY_MOUTH","ev":"口干","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_RE_DONG_FENG","en":"Phlegm heat stirring wind pattern","zh":"痰热动风证","py":"tán rè dòng fēng zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by distension and tightness in the subcostal region, cough, panting, fever, thirst, expectoration of yellow, sticky phlegm, sound of phlegm in the throat, convulsions of the limbs, dizziness, nausea, and vomiting. Often occurs when internal phlegm heat stirs liver wind.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is slippery and wiry.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1076 (痰热动风证), p. 119","gb":"3.9.5.2.1","gbtext":"眩晕，肢麻、震颤，头摇不止，甚则四肢抽搐，手不能持物，舌质红，舌苔黄腻，脉弦滑数；伴见发热，口黏或口苦，呕恶，胸闷、胁胀，咳喘，喉中痰鸣，咯痰黄稠","status":"draft","links":[{"f":"FT.FEVER","ev":"fever","src":["WHO","GB"],"ev_zh":"发热","gb_secondary":true},{"f":"FT.THIRST","ev":"thirst","src":["WHO"]},{"f":"FT.NAUSEA","ev":"nausea","src":["WHO","GB"],"ev_zh":"呕恶","gb_secondary":true},{"f":"FT.SOB","ev":"panting","src":["WHO","GB"],"ev_zh":"咳喘","gb_secondary":true},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO","GB"],"ev_zh":"眩晕"},{"f":"FT.COUGH","ev":"cough","src":["WHO","GB"],"ev_zh":"咳喘","gb_secondary":true},{"f":"FT.PHLEGM","ev":"sticky phlegm","src":["WHO","GB"],"ev_zh":"喉中痰鸣","gb_secondary":true},{"f":"FT.FLANK_PAIN","ev":"Characterized by distension and tightness in the subcostal region","src":["WHO","GB"],"ev_zh":"胁胀","gb_secondary":true},{"f":"FT.SPASM","ev":"convulsions of the limbs","src":["WHO","GB"],"ev_zh":"震颤"},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌质红"},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔黄腻"},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and wiry","src":["WHO","GB"],"ev_zh":"脉弦滑数"},{"f":"PL.WIRY","ev":"The pulse is slippery and wiry","src":["WHO","GB"],"ev_zh":"脉弦滑数"},{"f":"FT.NUMBNESS","ev":"肢麻","src":["GB"]},{"f":"PL.RAPID","ev":"脉弦滑数","src":["GB"]},{"f":"FT.BITTER_MOUTH","ev":"口黏或口苦","src":["GB"],"gb_secondary":true},{"f":"FT.STICKY_MOUTH","ev":"口黏或口苦","src":["GB"],"gb_secondary":true},{"f":"FT.CHEST_TIGHT","ev":"胸闷","src":["GB"],"gb_secondary":true},{"f":"FT.YELLOW_PHLEGM","ev":"咯痰黄稠","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_RE_JIE_XIONG","en":"Phlegm heat affecting the chest pattern","zh":"痰热结胸证","py":"tán rè jié xiōng zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by a feverish sensation in the chest, chest stuffiness, distension and pain, coughing with yellow phlegm, abdominal hardness and fullness with tenderness. Often occurs when turbid phlegm and heat remain in the chest.","tongue":"The tongue is red with a yellow, greasy coating.","pulse":"The pulse is slippery and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1077 (痰热结胸证), p. 119","gb":"3.9.5.1.1.3","gbtext":"心下痞胀或硬满，按之则痛，或胸膈灼痛，烦热，咳咯痰黄，舌质红，舌苔黄滑或腻，脉滑数；伴见发热、面赤，大便不畅或秘结","status":"draft","links":[{"f":"FT.FEELS_HOT","ev":"Characterized by a feverish sensation in the chest","src":["WHO","GB"],"ev_zh":"烦热"},{"f":"FT.TENDERNESS","ev":"abdominal hardness and fullness with tenderness","src":["WHO"]},{"f":"FT.COUGH","ev":"coughing with yellow phlegm","src":["WHO","GB"],"ev_zh":"咳咯痰黄"},{"f":"FT.PHLEGM","ev":"coughing with yellow phlegm","src":["WHO","GB"],"ev_zh":"咳咯痰黄"},{"f":"FT.YELLOW_PHLEGM","ev":"coughing with yellow phlegm","src":["WHO","GB"],"ev_zh":"咳咯痰黄"},{"f":"FT.CHEST_TIGHT","ev":"chest stuffiness","src":["WHO"]},{"f":"TG.RED","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌质红"},{"f":"TG.COAT_YELLOW","ev":"The tongue is red with a yellow","src":["WHO","GB"],"ev_zh":"舌苔黄滑或腻"},{"f":"TG.COAT_GREASY","ev":"greasy coating","src":["WHO","GB"],"ev_zh":"舌苔黄滑或腻"},{"f":"PL.RAPID","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉滑数"},{"f":"PL.SLIPPERY","ev":"The pulse is slippery and rapid","src":["WHO","GB"],"ev_zh":"脉滑数"},{"f":"TG.COAT_SLIPPERY","ev":"舌苔黄滑或腻","src":["GB"]},{"f":"FT.FEVER","ev":"发热","src":["GB"],"gb_secondary":true},{"f":"FT.RED_FACE","ev":"面赤","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.TAN_SHI_HU_JIE","en":"Intermingled phlegm and food stagnation pattern","zh":"痰食互结证","py":"tán shí hù jié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by chest stuffiness, tightness, distension and pain, coughing with phlegm, a low food intake, abdominal distension, and vomiting of phlegm and undigested food. Often occurs when turbid phlegm and undigested food obstruct the flow of qi.","tongue":"The tongue coating is putrid and greasy.","pulse":"The pulse is wiry and slippery.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1078 (痰食互结证), p. 119","gb":"3.9.10.2","gbtext":"胸脘痞闷或胀痛，咳嗽痰多，食少，腹胀，呕吐痰涎、宿食，舌苔腐腻，脉弦滑","status":"draft","links":[{"f":"FT.POOR_APPETITE","ev":"a low food intake","src":["WHO","GB"],"ev_zh":"食少"},{"f":"FT.ABD_DIST","ev":"abdominal distension","src":["WHO","GB"],"ev_zh":"胸脘痞闷或胀痛"},{"f":"FT.NAUSEA","ev":"and vomiting of phlegm and undigested food","src":["WHO","GB"],"ev_zh":"呕吐痰涎"},{"f":"FT.COUGH","ev":"coughing with phlegm","src":["WHO","GB"],"ev_zh":"咳嗽痰多"},{"f":"FT.PHLEGM","ev":"coughing with phlegm","src":["WHO","GB"],"ev_zh":"咳嗽痰多"},{"f":"FT.CHEST_TIGHT","ev":"Characterized by chest stuffiness","src":["WHO","GB"],"ev_zh":"胸脘痞闷或胀痛"},{"f":"TG.COAT_GREASY","ev":"The tongue coating is putrid and greasy","src":["WHO","GB"],"ev_zh":"舌苔腐腻"},{"f":"PL.SLIPPERY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"},{"f":"PL.WIRY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"},{"f":"FT.MOVING_PAIN","ev":"胸脘痞闷或胀痛","src":["GB"]}]},{"id":"SYN.ETI.TAN_HE_LIU_JIE","en":"Retained phlegm nodules pattern","zh":"痰核留结证","py":"tán hé liú jié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by painless, subcutaneous nodules on the neck and limbs. These nodules are hard, smooth and mobile. They do not appear red or feel warm. Often occurs when turbid phlegm remains in the body. 2 Terminologies on diagnosis, patterns and constitution 二、诊断、病证和体质术语","tongue":"The tongue coating is greasy.","pulse":"The pulse is wiry and slippery.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1079 (痰核留结证), p. 119","gb":"3.9.4.2.1.3","gbtext":"颈项、肢体等处皮下生核，圆滑质硬，推之可移，不红不热不痛，甚或成串，舌苔腻，脉弦滑","status":"draft","links":[{"f":"FT.PHLEGM","ev":"Often occurs when turbid phlegm remains in the body","src":["WHO"]},{"f":"TG.COAT_GREASY","ev":"The tongue coating is greasy","src":["WHO","GB"],"ev_zh":"舌苔腻"},{"f":"PL.SLIPPERY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"},{"f":"PL.WIRY","ev":"The pulse is wiry and slippery","src":["WHO","GB"],"ev_zh":"脉弦滑"}]},{"id":"SYN.ETI.XUE_YU_DONG_XUE","en":"Blood stasis stirring blood pattern","zh":"血瘀动血证","py":"xuè yū dòng xuè zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by bleeding of dark purple blood with clots, localized stabbing pain with a fixed position or bluish lumps. Often occurs when stagnant blood causes the blood to flow out of the vessels.","tongue":"The tongue is purple or with ecchymosis.","pulse":"The pulse is hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1080 (血瘀动血证), p. 119","gb":"4.2.5.2.8","gbtext":"出血，血色紫暗，夹见血块，舌质暗淡或紫，有瘀点、瘀斑，脉细涩；伴见局部刺痛，固定不移，或肢体青紫色斑块、血肿","status":"draft","links":[{"f":"FT.STABBING_PAIN","ev":"localized stabbing pain with a fixed position or bluish lumps","src":["WHO","GB"],"ev_zh":"局部刺痛","gb_secondary":true},{"f":"FT.MENS_CLOTS","ev":"Characterized by bleeding of dark purple blood with clots","src":["WHO","GB"],"ev_zh":"夹见血块"},{"f":"TG.PURPLE","ev":"The tongue is purple or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质暗淡或紫"},{"f":"PL.HESITANT","ev":"The pulse is hesitant","src":["WHO","GB"],"ev_zh":"脉细涩"},{"f":"FT.BLEEDING","ev":"出血","src":["GB"]},{"f":"TG.PALE","ev":"舌质暗淡或紫","src":["GB"]},{"f":"PL.THREADY","ev":"脉细涩","src":["GB"]}]},{"id":"SYN.ETI.XUE_YU_HUA_RE","en":"Blood stasis transformed heat pattern","zh":"血瘀化热证","py":"xuè yū huà rè zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by stabbing pain with a burning sensation, bluish lumps, afternoon or night fever, and a dry mouth with no desire to drink water. Often occurs when prolonged blood stasis transforms into heat.","tongue":"The tongue is dark red or with ecchymosis.","pulse":"The pulse is hesitant and rapid.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1081 (血瘀化热证), p. 119","gb":"4.2.5.2.4","gbtext":"局部固定刺痛、灼痛感，或有青紫肿块，午后或夜间发热，或自觉患处发热，口干、不欲饮，舌质暗红，或有瘀点、瘀斑，脉涩而数","status":"draft","links":[{"f":"FT.FEVER","ev":"afternoon or night fever","src":["WHO","GB"],"ev_zh":"午后或夜间发热"},{"f":"FT.DRY_MOUTH","ev":"and a dry mouth with no desire to drink water","src":["WHO","GB"],"ev_zh":"口干"},{"f":"FT.STABBING_PAIN","ev":"Characterized by stabbing pain with a burning sensation","src":["WHO","GB"],"ev_zh":"局部固定刺痛"},{"f":"TG.RED","ev":"The tongue is dark red or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质暗红"},{"f":"TG.PURPLE","ev":"The tongue is dark red or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质暗红"},{"f":"PL.RAPID","ev":"The pulse is hesitant and rapid","src":["WHO","GB"],"ev_zh":"脉涩而数"},{"f":"PL.HESITANT","ev":"The pulse is hesitant and rapid","src":["WHO","GB"],"ev_zh":"脉涩而数"}]},{"id":"SYN.ETI.XUE_YU_SHUI_TING","en":"Blood stasis induced water retention pattern","zh":"血瘀水停证","py":"xuè yū shuǐ tíng zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by abdominal masses with a stabbing pain, abdominal bulging, inhibited urination, amenorrhoea or oedema. Alternatively, bluish, diffuse swelling and distending pain may be present. Often occurs when stagnant blood causes water retention.","tongue":"The tongue is pale purple or with ecchymosis.","pulse":"The pulse is hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1082 (血瘀水停证), p. 119","gb":"4.2.5.2.3","gbtext":"腹内癥块、刺痛，腹大而胀，闭经，浮肿，小便不利，或局部青紫、漫肿胀痛，舌质淡紫，或有瘀点，脉涩","status":"draft","links":[{"f":"FT.SCANTY_URINE","ev":"inhibited urination","src":["WHO","GB"],"ev_zh":"小便不利"},{"f":"FT.OEDEMA","ev":"amenorrhoea or oedema","src":["WHO","GB"],"ev_zh":"浮肿"},{"f":"FT.STABBING_PAIN","ev":"Characterized by abdominal masses with a stabbing pain","src":["WHO","GB"],"ev_zh":"刺痛"},{"f":"FT.MOVING_PAIN","ev":"diffuse swelling and distending pain may be present","src":["WHO","GB"],"ev_zh":"漫肿胀痛"},{"f":"FT.MENS_SCANTY","ev":"amenorrhoea or oedema","src":["WHO","GB"],"ev_zh":"闭经"},{"f":"TG.PALE","ev":"The tongue is pale purple or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质淡紫"},{"f":"TG.PURPLE","ev":"The tongue is pale purple or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质淡紫"},{"f":"PL.HESITANT","ev":"The pulse is hesitant","src":["WHO","GB"],"ev_zh":"脉涩"}]},{"id":"SYN.ETI.YU_XUE_ZU_GE","en":"Stagnant blood obstructed the diaphragm pattern","zh":"瘀血阻膈证","py":"yū xuè zǔ gé zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by stabbing pain in the diaphragm or epigastric area with a fixed location or difficulty in swallowing food. Often occurs when stagnant blood retains in the thoracic diaphragm.","tongue":"The tongue is purple or with ecchymosis.","pulse":"The pulse is wiry and hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1083 (瘀血阻膈证), p. 119","gb":"3.10.1.5.4","gbtext":"胸膈刺痛，固定不移，进食梗塞，难以咽下，舌质紫，或有瘀点，脉弦或细涩","status":"draft","links":[{"f":"FT.STABBING_PAIN","ev":"Characterized by stabbing pain in the diaphragm or epigastric area with a fixed location or difficulty in swallowing food","src":["WHO","GB"],"ev_zh":"胸膈刺痛"},{"f":"TG.PURPLE","ev":"The tongue is purple or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质紫"},{"f":"PL.WIRY","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉弦或细涩"},{"f":"PL.HESITANT","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉弦或细涩"},{"f":"PL.THREADY","ev":"脉弦或细涩","src":["GB"]}]},{"id":"SYN.ETI.YIN_YI_SI_ZHI","en":"Fluids overflowing into the limbs pattern","zh":"饮溢四肢证","py":"yǐn yì sì zhī zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by body pain/heaviness, and joint pain. Other associated symptoms include cough, panting, chest tightness, and fatigue. Often occurs when fluid overflows to the limbs and the surface of the body.","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1084 (饮溢四肢证), p. 119","gb":"3.9.2.2.3","gbtext":"颜面、四肢浮肿，不汗出，骨节烦疼，肌肉重滞，舌质淡，舌苔滑或腻，脉浮弦或滑；伴见发热、恶寒，胸闷，乏力","status":"draft","links":[{"f":"FT.FATIGUE","ev":"and fatigue","src":["WHO","GB"],"ev_zh":"乏力","gb_secondary":true},{"f":"FT.SOB","ev":"panting","src":["WHO"]},{"f":"FT.COUGH","ev":"Other associated symptoms include cough","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO","GB"],"ev_zh":"胸闷","gb_secondary":true},{"f":"FT.JOINT_PAIN","ev":"and joint pain","src":["WHO","GB"],"ev_zh":"骨节烦疼"},{"f":"FT.OEDEMA","ev":"四肢浮肿","src":["GB"]},{"f":"TG.PALE","ev":"舌质淡","src":["GB"]},{"f":"TG.COAT_GREASY","ev":"舌苔滑或腻","src":["GB"]},{"f":"TG.COAT_SLIPPERY","ev":"舌苔滑或腻","src":["GB"]},{"f":"PL.SUPERFICIAL","ev":"脉浮弦或滑","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉浮弦或滑","src":["GB"]},{"f":"PL.WIRY","ev":"脉浮弦或滑","src":["GB"]},{"f":"FT.FEVER","ev":"发热","src":["GB"],"gb_secondary":true},{"f":"FT.AVERSION_COLD","ev":"恶寒","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.SHUI_YIN","en":"Water-fluid retention pattern","zh":"水饮证","py":"shuǐ yǐn zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by inhibited urination, lower abdominal distension/fullness, thirst, palpitations, dizziness, cough, panting, oedema, cold limbs and diarrhoea. Often occurs when abnormal distribution of bodily fluids causes water–damp retention.","tongue":"The tongue is enlarged with a slippery coating.","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1085 (水饮证), p. 119","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.COLD_LIMBS","ev":"cold limbs and diarrhoea","src":["WHO"]},{"f":"FT.THIRST","ev":"thirst","src":["WHO"]},{"f":"FT.ABD_DIST","ev":"lower abdominal distension/fullness","src":["WHO"]},{"f":"FT.LOOSE_STOOL","ev":"cold limbs and diarrhoea","src":["WHO"]},{"f":"FT.SCANTY_URINE","ev":"Characterized by inhibited urination","src":["WHO"]},{"f":"FT.SOB","ev":"panting","src":["WHO"]},{"f":"FT.OEDEMA","ev":"oedema","src":["WHO"]},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO"]},{"f":"FT.COUGH","ev":"cough","src":["WHO"]},{"f":"FT.PALPITATIONS","ev":"palpitations","src":["WHO"]},{"f":"TG.ENLARGED","ev":"The tongue is enlarged with a slippery coating","src":["WHO"]},{"f":"TG.COAT_SLIPPERY","ev":"The tongue is enlarged with a slippery coating","src":["WHO"]}]},{"id":"SYN.ETI.YIN_YI_XIONG_XIE","en":"Chest/subcostal fluid retention pattern","zh":"饮溢胸胁证","py":"yǐn yì xiōng xié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by subcostal distension/fullness, pain in the subcostal region induced by cough, swallowing, breathing or turning around. Retching or shortness of breath may also be present. Often occurs when fluid remains in the subcostal region.","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1086 (饮溢胸胁证), p. 121","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.NAUSEA","ev":"Retching or shortness of breath may also be present","src":["WHO"]},{"f":"FT.SOB","ev":"Retching or shortness of breath may also be present","src":["WHO"]},{"f":"FT.COUGH","ev":"pain in the subcostal region induced by cough","src":["WHO"]},{"f":"FT.FLANK_PAIN","ev":"Characterized by subcostal distension/fullness","src":["WHO"]}]},{"id":"SYN.ETI.YU_ZU_XIONG_XIE","en":"Chest/subcostal stasis pattern","zh":"瘀阻胸胁证","py":"yū zǔ xiōng xié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by pain in the chest/subcostal region with a fixed location, tenderness, chest tightness, and cyanosis of the lips. Often occurs when stagnant blood obstructs the chest and subcostal region.","tongue":"The tongue is dark or with ecchymosis.","pulse":"The pulse is wiry and hesitant.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1087 (瘀阻胸胁证), p. 121","gb":"3.10.1.4.7","gbtext":"胸胁局部肿胀、隆起，触按辄痛，或胸闷、心痛，口唇紫暗，时或心悸、怔忡，舌质暗滞，有斑点、瘀斑，脉沉涩或细涩","status":"draft","links":[{"f":"FT.TENDERNESS","ev":"tenderness","src":["WHO"]},{"f":"FT.CHEST_TIGHT","ev":"chest tightness","src":["WHO","GB"],"ev_zh":"或胸闷"},{"f":"FT.FLANK_PAIN","ev":"Characterized by pain in the chest/subcostal region with a fixed location","src":["WHO","GB"],"ev_zh":"胸胁局部肿胀"},{"f":"TG.PURPLE","ev":"The tongue is dark or with ecchymosis","src":["WHO","GB"],"ev_zh":"舌质暗滞"},{"f":"PL.WIRY","ev":"The pulse is wiry and hesitant","src":["WHO"]},{"f":"PL.HESITANT","ev":"The pulse is wiry and hesitant","src":["WHO","GB"],"ev_zh":"脉沉涩或细涩"},{"f":"FT.PALPITATIONS","ev":"时或心悸","src":["GB"]},{"f":"PL.DEEP","ev":"脉沉涩或细涩","src":["GB"]},{"f":"PL.THREADY","ev":"脉沉涩或细涩","src":["GB"]}]},{"id":"SYN.ETI.TAI_DU_YUN_RE","en":"Fetal toxin and heat accumulation pattern","zh":"胎毒蕴热证","py":"tāi dú yùn rè zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by skin ulceration and peeling. Symptoms may include mouth ulceration, ulceration of the eyes, or stools with a strong odour (that may contain blood). Often results from contraction of toxic heat as a fetus.","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1088 (胎毒蕴热证), p. 121","gb":"3.8.12.3","gbtext":"患儿壮热、头痛、呕吐，或胁下痞块，黄疸，或臖核肿大，甚则抽搐、神昏，舌苔黄，脉滑数，指纹紫红或黯；伴见皮肤斑疹，口舌、咽喉或胞睑赤烂，或大便腥臭，兼夹脓血","status":"draft","links":[{"f":"FT.DRY_SKIN","ev":"Characterized by skin ulceration and peeling","src":["WHO"]},{"f":"FT.FEVER","ev":"患儿壮热","src":["GB"]},{"f":"FT.HEADACHE","ev":"头痛","src":["GB"]},{"f":"FT.NAUSEA","ev":"呕吐","src":["GB"]},{"f":"FT.FLANK_PAIN","ev":"或胁下痞块","src":["GB"]},{"f":"FT.JAUNDICE","ev":"黄疸","src":["GB"]},{"f":"FT.SPASM","ev":"甚则抽搐","src":["GB"]},{"f":"TG.COAT_YELLOW","ev":"舌苔黄","src":["GB"]},{"f":"PL.RAPID","ev":"脉滑数","src":["GB"]},{"f":"PL.SLIPPERY","ev":"脉滑数","src":["GB"]},{"f":"FT.RASH","ev":"皮肤斑疹","src":["GB"],"gb_secondary":true},{"f":"FT.BLOODY_STOOL","ev":"兼夹脓血","src":["GB"],"gb_secondary":true}]},{"id":"SYN.ETI.JING_KONG_SHANG_SHEN","en":"Fear/fright damaging the kidney pattern","zh":"惊恐伤肾证","py":"jīng kǒng shāng shèn zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by panic, impotence, nocturnal emissions, timidity, paranoia, and bladder/bowel incontinence. Often occurs when severe fear or fright damages kidney qi.","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1089 (惊恐伤肾证), p. 121","gb":"3.11.6.3","gbtext":"骤然惊吓，二便失禁，惊惶不定，易惊、多疑，胆怯，时作恶梦，面色苍白，舌质淡红，脉沉伏或疾数，指纹青紫；伴见阳痿、滑精","status":"draft","links":[{"f":"FT.ENURESIS","ev":"and bladder/bowel incontinence","src":["WHO","GB"],"ev_zh":"二便失禁"},{"f":"FT.ANXIETY","ev":"timidity","src":["WHO","GB"],"ev_zh":"易惊"},{"f":"FT.MALE_SEXUAL","ev":"impotence","src":["WHO","GB"],"ev_zh":"阳痿","gb_secondary":true},{"f":"FT.PALE_FACE","ev":"面色苍白","src":["GB"]},{"f":"PL.DEEP","ev":"脉沉伏或疾数","src":["GB"]},{"f":"PL.RAPID","ev":"脉沉伏或疾数","src":["GB"]}]},{"id":"SYN.ETI.QING_ZHI_YU_JIE","en":"Emotional stagnation pattern","zh":"情志郁结证","py":"qíng zhì yù jié zhèng","he":null,"cat":"Patterns related to causative factors","text":"Characterized by depression, apathetic facial expression, insomnia, dream-disturbed sleep, dizziness, lassitude, and a poor appetite. Often occurs when excessive worry damages the mind.","tongue":"","pulse":"The pulse is wiry.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1090 (情志郁结证), p. 121","gb":"3.11.1","gbtext":"胸胁连少腹闷胀或窜痛，精神抑郁，独处不语，善太息，舌质偏暗，舌苔白，脉弦；伴见自觉咽部梗阻，痛经，或瘿瘤痞块、乳房肿痛等随情绪变化而减轻或加重","status":"draft","links":[{"f":"FT.POOR_APPETITE","ev":"and a poor appetite","src":["WHO"]},{"f":"FT.FATIGUE","ev":"lassitude","src":["WHO"]},{"f":"FT.INSOMNIA","ev":"insomnia","src":["WHO"]},{"f":"FT.DREAMS","ev":"dream-disturbed sleep","src":["WHO"]},{"f":"FT.LOW_MOOD","ev":"Characterized by depression","src":["WHO","GB"],"ev_zh":"精神抑郁"},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO"]},{"f":"PL.WIRY","ev":"The pulse is wiry","src":["WHO","GB"],"ev_zh":"脉弦"},{"f":"FT.FLANK_PAIN","ev":"胸胁连少腹闷胀或窜痛","src":["GB"]},{"f":"FT.MOVING_PAIN","ev":"胸胁连少腹闷胀或窜痛","src":["GB"]},{"f":"TG.PURPLE","ev":"舌质偏暗","src":["GB"]},{"f":"TG.COAT_WHITE","ev":"舌苔白","src":["GB"]},{"f":"FT.MENS_PAI  of qi activity.","tongue":"","pulse":"","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1110 (气闭证), p. 125","gb":null,"gbtext":null,"status":"draft","links":[{"f":"FT.ABD_PAIN","ev":"Characterized by colic or paroxysmal abdominal pain","src":["WHO"]}]},{"id":"SYN.QB.QI_XU_QI_ZHI","en":"Qi deficiency induced qi stagnation pattern","zh":"气虚气滞证","py":"qì xū qì zhì zhèng","he":null,"cat":"Patterns of yin, yang, qi, blood, bodily fluids, essence and marrow","text":"Characterized by lassitude, shortness of breath, fatigue, and distension, tightness and migratory pain in the chest or abdomen. Often occurs when qi fails to move and causes qi stagnation.","tongue":"The tongue is pale.","pulse":"The pulse is wiry and delayed.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1111 (气虚气滞证), p. 125","gb":"4.1.3.6.1.3","gbtext":"胸胁脘腹闷胀、窜痛，舌质淡，脉弦缓；伴见神疲、气短、乏力","status":"draft","links":[{"f":"FT.FATIGUE","ev":"fatigue","src":["WHO","GB"],"ev_zh":"神疲","gb_secondary":true},{"f":"FT.SOB","ev":"shortness of breath","src":["WHO","GB"],"ev_zh":"气短","gb_secondary":true},{"f":"FT.MOVING_PAIN","ev":"tightness and migratory pain in the chest or abdomen","src":["WHO","GB"],"ev_zh":"窜痛"},{"f":"TG.PALE","ev":"The tongue is pale","src":["WHO","GB"],"ev_zh":"舌质淡"},{"f":"PL.WIRY","ev":"The pulse is wiry and delayed","src":["WHO","GB"],"ev_zh":"脉弦缓"},{"f":"PL.SLACK","ev":"The pulse is wiry and delayed","src":["WHO","GB"],"ev_zh":"脉弦缓"},{"f":"FT.ABD_DIST","ev":"胸胁脘腹闷胀","src":["GB"]},{"f":"FT.FLANK_PAIN","ev":"胸胁脘腹闷胀","src":["GB"]}]},{"id":"SYN.QB.XUE_XU","en":"Blood deficiency pattern","zh":"血虚证","py":"xuè xū zhèng","he":null,"cat":"Patterns of yin, yang, qi, blood, bodily fluids, essence and marrow","text":"Often occurs when blood fails to nourish the zang–fu organs, meridians and other body tissues.","tongue":"Characterized by a pale or sallow complexion, pale lips, tongue and fingernails, dizziness, blurred vision, palpitations, dream-disturbed sleep, hands/feet numbness, scanty menstruation with a pale menstrual col AT_YELLOW","ev":"The tongue is red with a yellow coating","src":["WHO","GB"],"ev_zh":"舌苔黄"},{"f":"PL.WIRY","ev":"The pulse is wiry","src":["WHO","GB"],"ev_zh":"脉弦"},{"f":"FT.LOOSE_STOOL","ev":"大便硬结或泄泻","src":["GB"]}]},{"id":"SYN.SP.PI_QI_XU","en":"Spleen qi deficiency pattern","zh":"脾气虚证","py":"pí qì xū zhèng","he":null,"cat":"Patterns of the spleen system","text":"Characterized by low food intake, abdominal distension that aggravates after eating food, loose stools, and lassitude.","tongue":"The tongue is pale with a white coating.","pulse":"The pulse is slack and weak.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1195 (脾气虚证), p. 139","gb":"5.3.1.3.1","gbtext":"食少、腹胀，食后尤甚，大便溏薄，肢体倦怠，少气懒言，面色萎黄，舌质淡，舌苔白，脉缓弱；伴见浮肿，消瘦","status":"draft","links":[{"f":"FT.POOR_APPETITE","ev":"Characterized by low food intake","src":["WHO","GB"],"ev_zh":"食少"},{"f":"FT.ABD_DIST","ev":"abdominal distension that aggravates after eating food","src":["WHO","GB"],"ev_zh":"腹胀"},{"f":"FT.POSTMEAL_DIST","ev":"abdominal distension that aggravates after eating food","src":["WHO","GB"],"ev_zh":"食后尤甚"},{"f":"FT.LOOSE_STOOL","ev":"loose stools","src":["WHO","GB"],"ev_zh":"大便溏薄"},{"f":"FT.FATIGUE","ev":"and lassitude","src":["WHO","GB"],"ev_zh":"肢体倦怠"},{"f":"TG.PALE","ev":"The tongue is pale with a white coating","src":["WHO","GB"],"ev_zh":"舌质淡"},{"f":"TG.COAT_WHITE","ev":"The tongue is pale with a white coating","src":["WHO","GB"],"ev_zh":"舌苔白"},{"f":"PL.WEAK","ev":"The pulse is slack and weak","src":["WHO","GB"],"ev_zh":"脉缓弱"},{"f":"PL.SLACK","ev":"The pulse is slack and weak","src":["WHO","GB"],"ev_zh":"脉缓弱"},{"f":"FT.SOB","ev":"少气懒言","src":["GB"]},{"f":"FT.LOW_VOICE","ev":"少气懒言","src":["GB"]},{"f":"FT.PALE_FACE","ev":"面色萎黄","src":["GB"]},{"f":"FT.OEDEMA","ev":"浮肿","src":["GB"],"gb_secondary":true},{"f":"FT.WEIGHT_LOSS","ev":"消瘦","src":["GB"],"gb_secondary":true}]},{"id":"SYN.SP.PI_QI_XIA_XIAN","en":"Spleen qi sinking pattern","zh":"脾气下陷证","py":"pí qì xià xiàn zhèng","he":null,"cat":"Patterns of the spleen system","text":"Characterized by a bearing-down sensation in the abdomen that aggravates after eating food. Frequent urges to defaecate with a bearing-down sensation of the anus, persistent diarrhoea, rectal prolapse, prolapsed uterus or cloudy urine may be present. Associated symptoms may include shortness of breath, fatigue, lassitude, reluctance to talk, dizziness, blurred vision, a pale, lustreless face, poor appetite and loose stools. This pattern often develops from severe spleen qi deficiency and occurs when spleen qi fails to ascend.","tongue":"The tongue is pale with a white coating.","pulse":"The pulse is delayed and weak.","tp":null,"src":"WHO-ISTTCM-2022 WGM2 1196 (脾气下陷证), p. 139","gb":"4.1.1.4.1","gbtext":"胃脘坠胀，食后加重，或肛门重坠，便意频数，或久泄脱肛，小便频数，甚或失禁，或子宫下垂，崩漏，胎漏，舌质淡，舌苔白，脉缓弱；伴见食少、便溏，消瘦、乏力，头晕、目眩","status":"draft","links":[{"f":"FT.PALE_FACE","ev":"a pale, lustreless face","src":["WHO"]},{"f":"FT.POOR_APPETITE","ev":"poor appetite and loose stools","src":["WHO","GB"],"ev_zh":"食少","gb_secondary":true},{"f":"FT.POSTMEAL_DIST","ev":"Characterized by a bearing-down sensation in the abdomen that aggravates after eating food","src":["WHO","GB"],"ev_zh":"食后加重"},{"f":"FT.LOOSE_STOOL","ev":"poor appetite and loose stools","src":["WHO","GB"],"ev_zh":"或久泄脱肛"},{"f":"FT.TENESMUS","ev":"Frequent urges to defaecate with a bearing-down sensation of the anus","src":["WHO"]},{"f":"FT.PROLAPSE","ev":"rectal prolapse","src":["WHO","GB"],"ev_zh":"胃脘坠胀"},{"f":"FT.YELLOW_URINE","ev":"prolapsed uterus or cloudy urine may be present","src":["WHO"]},{"f":"FT.FATIGUE","ev":"fatigue","src":["WHO","GB"],"ev_zh":"乏力","gb_secondary":true},{"f":"FT.SOB","ev":"Associated symptoms may include shortness of breath","src":["WHO"]},{"f":"FT.LOW_VOICE","ev":"reluctance to talk","src":["WHO"]},{"f":"FT.DIZZY","ev":"dizziness","src":["WHO","GB"],"ev_zh":"头晕","gb_secondary":true},{"f":"FT.EYES_BLURRED","ev":"blurred vision","src":["WHO"]},{"f":"TG.PALE","ev":"The tongue is pale with a white coating","src":[
