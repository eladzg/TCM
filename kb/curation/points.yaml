  name_pinyin: Shènshù
  name_zh: 肾俞
  name_en: Kidney Shu
  location: In the lumbar region, level with the lower edge of the L2 spinous process and 1.5 body-cun from the posterior midline.
  actions: Traditionally tonifies Kidney qi and essence, supports the low back, and regulates urination.
  indications: Reference uses include chronic low-back weakness, urinary disorders, reproductive deficiency patterns, tinnitus, and fatigue.; Secondary uses include edema, asthma linked with Kidney deficiency, and poor memory.
  needling_notes: 'depth: 0.5-1.0 cun perpendicular, individualized to BMI, soft-tissue thickness, and kidney depth; moxibustion: Applicable as non-scarring moxa'
  cautions: BL-23 is included in an ultrasound database of high-risk points. WHO warns that deep lumbar needling can injure the kidney; use anatomy- and body-build-specific depth.
  classical: 腎俞十四椎下兩旁，相去脊各一寸五分，前與臍平，正坐取之。銅人針三分，留七呼，灸以年為壯，明堂灸三壯。素問，刺中腎，六日死，其動為嚏。主虛勞羸瘦，耳聾腎虛，水臟久冷，心腹填滿脹急，兩□滿脹，引小腹急痛脹熱，小便淋，目視□□，少氣溺血，小便濁，出精夢泄，腎中風，踞坐而腰痛，消渴，五勞七傷，虛憊，腳膝拘急，腰寒如冰，頭重身熱，振慄，食多羸瘦，面黃黑，腸鳴，膝中四肢淫濼，洞泄食不化，身腫如水，女人積冷氣成勞，乘經交接羸瘦，寒熱往來。
