  indications: 金匱要略 篇21.2：產婦鬱冒，其脈微弱，嘔不能食，大便反堅，但頭汗出。所以然者，血虛而厥，厥而必冒。冒家欲解，必大汗出。以血虛下厥，孤陽上出，故頭汗出。所以產婦喜汗出者，亡陰血虛，陽氣獨盛，故當汗出，陰陽乃復。大便堅，嘔不能食，小柴胡湯主之。
