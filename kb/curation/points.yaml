  classical: 光明外踝上五寸，足少陽之絡，別走厥陰。銅人針六分，留七呼，灸五壯，明堂灸七壯。主淫濼脛痠胻疼，不能久立，熱病汗不出，卒狂，與陽輔療法同，虛則痿躄，坐不能起，補之，實則足胻熱膝痛，身體不仁，善嚙頰，瀉之。
