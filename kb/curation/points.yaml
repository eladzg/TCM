  channel_id: CH.GV
  name_pinyin: Bǎihuì
  name_zh: 百会
  name_en: Hundred Meetings
  location: At the vertex, 5 B-cun above the anterior hairline on the midline, at the midpoint of the line connecting the two auricular apices.
  actions: Traditionally raises clear yang, calms the spirit, clears the senses, and steadies internal wind.
  indications: Reference uses include vertex headache, dizziness, poor concentration, insomnia, and prolapse patterns.; Secondary uses include tinnitus, nasal blockage, seizure patterns, and emotional agitation.
  needling_notes: 'depth: 0.5-0.8 cun subcutaneous; moxibustion: Applicable according to the checked GV-20 point source'
  classical: 百會（一名三陽一名五會一名嶺上一名天滿）前頂後一寸五分，頂中央旋毛中，可容豆，直兩耳尖。性理北溪陳氏曰：略退些了，猶天之極星居北，手足三陽督脈之會。素註針二分，銅人灸七壯，止七七壯。凡灸頭頂不得過七壯，緣頭頂皮薄，灸不宜多，針二分，得氣即瀉，又素註針四分。主頭風中風，言語蹇□，口噤不開，偏風半身不遂，心煩悶，驚悸，健忘，忘前失後，心神恍惚，無心力，痎瘧，脫肛，風癇，青風心風，角弓反張，羊鳴多哭，語言不擇，發時即死，吐沫汗出而嘔，飲酒面赤，腦重鼻塞，頭痛目眩，食無味，百病皆治，虢太子尸厥，扁鵲取三陽五會，有間太子甦，唐高宗頭痛，秦鳴鶴曰：宜刺百會出血。武后曰：豈有至尊頭上出血之理，已而刺之，微出血，立愈。
