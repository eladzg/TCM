- syndrome_id: SYN.UT.CHONG_REN_YU_ZU
  name_en: Blood stasis obstructing the Chong and Ren pattern
  name_pinyin: chōng rèn yū zǔ zhèng
  name_zh: 冲任瘀阻证
  category: Patterns involving the uterus
  presentation: Characterized by dark purple menstrual colour with clots.
  aetiology: This pattern often occurs when stasis obstructs the uterus. Contributing factors may include inappropriate care during period or after childbirth, contraction of external pathogenic qi or emotional disturbance. It may also develop from further progression of qi stagnation of Chong and Ren.
