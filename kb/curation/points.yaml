  channel_id: CH.GB
  name_pinyin: Xuánzhōng
  name_zh: 悬钟
  name_en: Suspended Bell
  location: On the outer lower leg, anterior to the fibula and 3 B-cun above the lateral malleolus.
  actions: Nourishes marrow in traditional theory; benefits the neck; clears Gallbladder heat; activates the leg channel.
  indications: Neck stiffness; headache; lateral leg or ankle pain; weakness of the lower limb.; Dizziness; post-stroke dysfunction; abdominal distention.
  needling_notes: 'depth: 1.0–1.5 cun perpendicular; moxibustion: Not established in checked sources.'
  classical: 懸鍾（一名絕骨）足外踝上三寸動脈中，尋摸尖骨者是，足三陽之大絡。按之陽明脈絕，乃取之。難經曰：髓會絕骨。疏曰：髓病治此。袁氏曰：足能挺步，以髓會絕骨也。銅人針六分，留七呼，灸五壯。指微云：斜入針二寸許，灸七壯，或五壯。主心腹脹滿，胃中熱，不嗜食，腳氣膝胻痛，筋骨攣痛，足不收，逆氣，虛勞寒損，憂恚心中，欬痛，泄注，喉痺，頸項強，腸痔瘀血，陰急，鼻□，腦疽，大小便□，鼻中乾，煩滿，狂易中風，手足不隨。
