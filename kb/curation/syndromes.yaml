  name_zh: 肾不纳气证
  category: Patterns of the kidney system
  presentation: Characterized by shortness of breath, dyspnoea, panting or sweating upon physical exertion, and more exhalation than inhalation. In severe cases, facial puffiness and leg oedema may be present.
  aetiology: This pattern often occurs when kidney qi fails to absorb lung qi.
  pulse: The pulse is thready or deficient, floating and rootless.
