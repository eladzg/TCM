- point_id: LU7
  channel_id: CH.LU
  name_pinyin: Lièquē
  name_zh: 列缺
  name_en: Broken Sequence
  location: On the radial forearm, between the abductor pollicis longus and extensor pollicis brevis tendons, 1.5 B-cun above the palmar wrist crease.
  actions: Releases exterior wind; restores Lung descent; benefits the nose and throat; supports water passage.
  indications: Early-stage exterior illness; cough; nasal blockage; sore throat; headache; stiff neck.; Facial weakness; urinary difficulty; genital discomfort; weakness of the thumb or index finger.
  needling_notes: 'depth: 0.3-0.5 cun oblique proximally; moxibustion: Not established in checked point-specific sources.'
  classical: 列缺手太陰絡，別走陽明，去腕側上一寸五分，以兩手交叉，食指盡處。兩筋骨罅中，針二分，留五呼，瀉五吸，灸七壯。主偏風，口而喎斜，手腕無力，半身不遂，掌中熱，口噤不開，寒熱瘧，嘔沬，咳嗽，善笑，縱脣口，健忘，溺血。精出陰莖痛，小便熱，癇驚妄見，面目四肢癰腫，肩痺胸背寒慄，少氣不足以息，尸厥寒熱，交兩手而瞀，實則胸背熱，汗出，四肢暴腫，處則胸背寒慄，少氣不足以息。素問曰：實則手銳掌熱，瀉之。虛則欠□，則便遺數，補之。直行者謂之經，旁出者謂之絡。手太陰之支，從腕後直出次指內廉，出其端，是列缺為太陰別走陽明之路。人或有寸關尺三部脈不見，自列缺至陽谿脈見者，俗謂之反關脈，此經脈虛。而絡脈滿，千金翼謂陽脈逆，反大於寸口三倍，惜叔和尚未之及，而況高陽生哉！（□音去）
